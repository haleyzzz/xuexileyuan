<style>
  :root{
    --blue:#4895ef; --blue2:#5cc8ff; --green:#06d6a0; --orange:#ff9f1c;
    --purple:#b292ff; --ink:#3d3a4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#eef6ff,#e6f7ff);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);
    border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  header{background:linear-gradient(120deg,var(--blue),var(--blue2));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(72,149,239,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--blue)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}

  .screen{display:none}
  .screen.on{display:block}

  .btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-size:16px;
    font-family:inherit;cursor:pointer;font-weight:800;color:#fff;background:var(--blue);margin-top:8px}
  .btn.gh{background:var(--orange)}
  .btn.sec{background:#eaf3ff;color:var(--blue)}

  .prog-wrap{margin:6px 0 14px}
  .progress{height:14px;background:#dcecff;border-radius:10px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue2));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center;margin-top:4px}

  .passage{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);
    padding:16px;margin-bottom:14px}
  .passage .ph{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
  .passage .pemoji{font-size:30px}
  .passage .ptitle{font-size:17px;font-weight:800;flex:1;min-width:88px}
  .passage .pbtns{display:flex;gap:6px;flex-wrap:wrap}
  .passage .pbtns button{border:none;border-radius:12px;padding:7px 9px;font-size:13px;
    font-family:inherit;cursor:pointer;font-weight:700;color:#fff;background:var(--purple)}
  .passage .pbtns .b-tr{background:var(--orange)}
  .passage .pbtns .b-gl{background:#ff7a59}
  .ptext{font-size:16px;line-height:1.8;color:var(--ink)}
  .ptrans{font-size:14px;line-height:1.7;color:#777;margin-top:10px;background:#f1f7ff;
    border-radius:12px;padding:10px;display:none}
  .ptrans.on{display:block}
  /* 整篇短文逐字翻译 */
  .pgloss{font-size:14px;line-height:2.2;color:var(--ink);margin-top:10px;background:#fff7f2;
    border-radius:12px;padding:10px 11px;display:none}
  .pgloss.on{display:block}
  .pgloss .glab{font-weight:800;color:#ff7a59;display:block;margin-bottom:5px;font-size:13px}
  .pgloss .sline{padding:5px 0;border-bottom:1px dashed #ffd9c7}
  .pgloss .sline:last-child{border-bottom:none}
  .pgloss .sn{display:inline-block;min-width:19px;color:var(--orange);font-weight:800;font-size:12px}

  .q{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);
    padding:14px;margin-bottom:12px;border:3px solid transparent;transition:border-color .2s}
  .q.done-ok{border-color:var(--green)}
  .q.done-no{border-color:#ff6b6b}
  .q .qt{font-size:15px;font-weight:700;margin-bottom:10px}
  .q .qt .qn{color:var(--blue);margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{border:none;border-radius:12px;padding:11px 14px;font-size:14px;text-align:left;
    font-family:inherit;cursor:pointer;background:#eef4ff;color:var(--ink);transition:.15s}
  .opt:active{transform:scale(.98)}
  .opt.ok{background:var(--green);color:#fff}
  .opt.no{background:#ff6b6b;color:#fff}
  .opt.dim{opacity:.45;pointer-events:none}
  .why{font-size:13px;color:#888;margin-top:10px;background:#f6f8fb;border-radius:10px;
    padding:9px;line-height:1.6;display:none}
  .why.on{display:block}
  /* 逐字翻译 */
  .wtrans{font-size:13px;line-height:2;color:#444;margin-top:8px;background:#fff7f2;
    border-radius:10px;padding:10px;display:none}
  .wtrans.on{display:block}
  .wtrans .lab{font-weight:800;color:#ff7a59;display:block;margin:2px 0 4px}
  .wtrans .optline{margin:1px 0}
  .wtrans .optline b{color:#4895ef;margin-right:4px}
  .gw{margin:0 1px}
  .gw .gc{color:#ff7a59;font-size:11px;margin-left:1px}

  .report{background:#fff;border-radius:24px;box-shadow:0 8px 22px rgba(0,0,0,.08);
    padding:24px;text-align:center;margin-top:14px}
  .report .stars{font-size:34px;letter-spacing:4px;margin:6px 0}
  .report .score{font-size:30px;font-weight:800;color:var(--blue)}
  .report .sub{font-size:14px;color:#888;margin-top:4px}
  .report .line{font-size:15px;color:var(--ink);margin-top:10px}
  .report .pass{color:var(--green);font-weight:800}
  .report .fail{color:#ff6b6b;font-weight:800}

  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;
    text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--blue);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}

  .grades{display:flex;gap:7px;overflow-x:auto;margin:12px 2px 2px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .grades button{border:2px solid #dcecff;background:#fff;color:#666;border-radius:999px;
    padding:8px 15px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
  .grades button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
</style>
</head>

<header>

<div class="stats">

  <div class="stat"><div class="num" id="totalNum">12</div><div class="lbl">📝 题目总数</div></div>

</div>

<div class="grades" id="grades"></div>

<!-- 开始页 -->
<div class="screen on" id="scrMenu">
  <h2 style="font-size:17px;margin:6px 4px 10px">📚 6 篇短文闯关</h2>
  <div class="tip" style="margin:0 0 12px">先读短文（🔊朗读 / 👁整句翻译 / 🔤逐字翻译），再做下面的选择题。答对 80% 即通关！答错会自动显示中文和逐字翻译。</div>
  <div id="resumeInfo" style="margin:0 0 12px;font-size:14px;color:#3a7bd5;font-weight:800;min-height:20px"></div>
  <button class="btn" id="startBtn" onclick="start()">🚀 开始闯关</button>
  <button class="btn sec" onclick="resetProgress()">↺ 本年级从头开始</button>
  <button class="btn sec" onclick="resetBest()">↺ 清空最佳记录</button>
</div>

<!-- 闯关页 -->
<div class="screen" id="scrQuiz">
  <div class="prog-wrap">
    <div class="progress"><i id="progBar"></i></div>
    <div class="prog-txt" id="progTxt">第 1 / 6 关</div>
  </div>
  <div id="quizArea"></div>
  <button class="btn gh" id="nextBtn" onclick="next()" style="display:none">➡️ 下一关</button>
  <button class="btn gh" id="finishBtn" onclick="finish()" style="display:none">🏁 查看战报</button>
</div>

<!-- 战报页 -->
<div class="screen" id="scrReport">
  <div class="report">
    <div class="stars" id="rStars">⭐⭐⭐</div>
    <div class="score" id="rScore">0 / 12</div>
    <div class="sub" id="rPct">正确率 0%</div>
    <div class="line" id="rPass"></div>
  </div>
  <button class="btn" onclick="start()">🔄 再来一轮</button>
  <button class="btn sec" onclick="goMenu()">🏠 回到首页</button>
</div>

<div class="tip">数据按小朋友分别保存，不会上传。</div>

<div class="celebrate" id="celeb">
  <div class="box2">
    <h3>🎉 阅读小达人！</h3>
    <p>闯过全部关卡，英文短文全读懂啦！</p>
    <button onclick="closeCeleb()">继续闯关 💪</button>
  </div>
</div>

  {"id":"rp23","emoji":"📖","title":"The Power of Reading","g":6,"en":"Reading opens new worlds. A good book teaches us. It brings joy and ideas. Read a little every day.","cn":"阅读开启新世界。一本好书教我们。它带来快乐和想法。每天读一点。","qa":[{"q":"What does reading open?","opts":["New worlds","A door only","A box"],"ans":"New worlds","why":"文中说 Reading opens new worlds。"},{"q":"What does a good book bring?","opts":["Joy and ideas","Only noise","Only sleep"],"ans":"Joy and ideas","why":"文中说 It brings joy and ideas。"}]},
  {"id":"rp24","emoji":"🤝","title":"Helping Hands","g":6,"en":"A neighbour needs help. We carry her bags. She smiles and says thanks. Small acts make a big difference.","cn":"一位邻居需要帮助。我们帮她拎包。她微笑着说谢谢。小小的举动带来很大的不同。","qa":[{"q":"Whose bags do we carry?","opts":["A neighbour's","A teacher's","A dog's"],"ans":"A neighbour's","why":"文中说 A neighbour needs help。"},{"q":"Do small acts matter?","opts":["Yes","No"],"ans":"Yes","why":"文中说 make a big difference。"}]},
  {"id":"rp25","emoji":"🚌","title":"The School Bus","g":1,"en":"I take the school bus. The driver is kind. My friend sits next to me. We sing songs on the bus.","cn":"我坐校车。司机很和气。我的朋友坐在我旁边。我们在车上唱歌。","qa":[{"q":"How do I go to school?","opts":["By school bus","By bike","On foot"],"ans":0,"why":"文中说 I take the school bus。"},{"q":"Who sits next to me?","opts":["My friend","My teacher","My sister"],"ans":0,"why":"文中说 My friend sits next to me。"}]},
  {"id":"rp26","emoji":"🥕","title":"In the Garden","g":1,"en":"Grandpa has a garden. There are carrots and tomatoes. I water the plants. The vegetables grow big.","cn":"爷爷有一个菜园。里面有胡萝卜和西红柿。我给植物浇水。蔬菜长得很大。","qa":[{"q":"Whose garden is it?","opts":["Grandpa's","Mine","The teacher's"],"ans":0,"why":"文中说 Grandpa has a garden。"},{"q":"What do I do in the garden?","opts":["Water the plants","Cook food","Watch TV"],"ans":0,"why":"文中说 I water the plants。"}]},
  {"id":"rp27","emoji":"🌧️","title":"Rainy Days","g":2,"en":"It rains today. I stay at home. I draw pictures and read books. Mum makes hot soup for me.","cn":"今天下雨。我待在家里。我画画和读书。妈妈给我做了热汤。","qa":[{"q":"What is the weather like?","opts":["Rainy","Sunny","Snowy"],"ans":0,"why":"文中说 It rains today。"},{"q":"Who makes hot soup?","opts":["Mum","Dad","Grandma"],"ans":0,"why":"文中说 Mum makes hot soup for me。"}]},
  {"id":"rp28","emoji":"🪁","title":"Flying a Kite","g":2,"en":"The wind blows hard. Dad and I fly a kite. The kite flies very high. It looks like a big bird.","cn":"风刮得很大。我和爸爸放风筝。风筝飞得很高。它看起来像一只大鸟。","qa":[{"q":"What do we fly?","opts":["A kite","A plane","A balloon"],"ans":0,"why":"文中说 Dad and I fly a kite。"},{"q":"What does the kite look like?","opts":["A big bird","A fish","A cat"],"ans":0,"why":"文中说 It looks like a big bird。"}]},
  {"id":"rp29","emoji":"🔬","title":"A Science Class","g":3,"en":"Today we have a science class. We learn about water. Ice becomes water. Water becomes vapour. Science is fun.","cn":"今天我们上科学课。我们学习水。冰变成水。水变成水蒸气。科学很有趣。","qa":[{"q":"What do we learn about?","opts":["Water","Fire","Wind"],"ans":0,"why":"文中说 We learn about water。"},{"q":"What does ice become?","opts":["Water","Vapour","Stone"],"ans":0,"why":"文中说 Ice becomes water。"}]},
  {"id":"rp30","emoji":"🏥","title":"A Visit to the Dentist","g":3,"en":"My tooth hurts. Mum takes me to the dentist. The dentist checks my teeth. He says I should brush twice a day.","cn":"我的牙疼。妈妈带我去看牙医。牙医检查我的牙齿。他说我应该一天刷两次牙。","qa":[{"q":"Why do I go to the dentist?","opts":["My tooth hurts","My leg hurts","I want a toy"],"ans":0,"why":"文中说 My tooth hurts。"},{"q":"How often should I brush?","opts":["Twice a day","Once a week","Never"],"ans":0,"why":"文中说 brush twice a day。"}]},
  {"id":"rp31","emoji":"🌳","title":"Planting Trees","g":4,"en":"It is Tree Planting Day. We dig holes and plant small trees. We water them. Trees make our city green.","cn":"今天是植树节。我们挖坑种小树。我们给它们浇水。树让我们的城市变绿。","qa":[{"q":"What day is it?","opts":["Tree Planting Day","Children's Day","New Year"],"ans":0,"why":"文中说 It is Tree Planting Day。"},{"q":"What do trees do to our city?","opts":["Make it green","Make it dirty","Make it dark"],"ans":0,"why":"文中说 Trees make our city green。"}]},
  {"id":"rp32","emoji":"🐠","title":"The Goldfish","g":4,"en":"I have a goldfish. It lives in a round bowl. It swims all day. I feed it every morning.","cn":"我有一条金鱼。它住在圆鱼缸里。它整天游泳。我每天早上喂它。","qa":[{"q":"Where does the goldfish live?","opts":["In a round bowl","In a river","In the sea"],"ans":0,"why":"文中说 It lives in a round bowl。"},{"q":"When do I feed it?","opts":["Every morning","Every night","Once a week"],"ans":0,"why":"文中说 I feed it every morning。"}]},
  {"id":"rp33","emoji":"🧭","title":"Finding the Way","g":5,"en":"Lucy loses her way. A policeman helps her. Go straight and turn left. The bookstore is on the right.","cn":"露西迷路了。一位警察帮她。直走然后左转。书店就在右边。","qa":[{"q":"Who helps Lucy?","opts":["A policeman","A teacher","A doctor"],"ans":0,"why":"文中说 A policeman helps her。"},{"q":"Where is the bookstore?","opts":["On the right","On the left","Behind her"],"ans":0,"why":"文中说 The bookstore is on the right。"}]},
  {"id":"rp34","emoji":"⏰","title":"Don't Be Late","g":5,"en":"Tom is always late for school. He buys a clock. Now he gets up at six thirty. He is never late again.","cn":"汤姆上学总是迟到。他买了一个闹钟。现在他六点半起床。他再也不迟到了。","qa":[{"q":"What does Tom buy?","opts":["A clock","A watch","A phone"],"ans":0,"why":"文中说 He buys a clock。"},{"q":"Is Tom late again?","opts":["No","Yes","Sometimes"],"ans":0,"why":"文中说 He is never late again。"}]},
  {"id":"rp35","emoji":"🗑️","title":"Rubbish Sorting","g":6,"en":"We sort rubbish at school. Paper goes into the blue bin. Food waste goes into the green bin. It helps the earth.","cn":"我们在学校给垃圾分类。纸放进蓝色垃圾桶。厨余垃圾放进绿色垃圾桶。这有助于保护地球。","qa":[{"q":"Where does paper go?","opts":["The blue bin","The green bin","The red bin"],"ans":0,"why":"文中说 Paper goes into the blue bin。"},{"q":"What does sorting rubbish help?","opts":["The earth","The moon","Nothing"],"ans":0,"why":"文中说 It helps the earth。"}]},
  {"id":"rp36","emoji":"🏅","title":"Never Give Up","g":6,"en":"Lily learns to ride a bike. She falls down many times. She does not give up. At last she can ride fast.","cn":"莉莉学骑自行车。她摔倒了很多次。她不放弃。最后她能骑得很快。","qa":[{"q":"What does Lily learn?","opts":["To ride a bike","To swim","To dance"],"ans":0,"why":"文中说 Lily learns to ride a bike。"},{"q":"Does she give up?","opts":["No","Yes","At first"],"ans":0,"why":"文中说 She does not give up。"}]}

// 把英文句子渲染成「词 + 中文」逐字翻译
function gloss(text){
  var tokens = String(text).split(/(\s+)/);
  var out='';
  for(var i=0;i<tokens.length;i++){
    var t=tokens[i];
    if(t===''||/^\s+$/.test(t)){ out+=t; continue; }
    var m=t.match(/^([^A-Za-z]*)([A-Za-z][A-Za-z'\-]*)([^A-Za-z]*)$/);
    if(!m){ out+=t; continue; }
    var pre=m[1], word=m[2], post=m[3];
    var key=word.toLowerCase();
    if(key.length>2 && key.slice(-2)==="'s") key=key.slice(0,-2);
    var zh=DICT[key];
    if(!zh && window.Gloss && window.Gloss.DICT) zh=window.Gloss.DICT[key]; /* 兜底：共享大词典 */
    out+=pre;
    if(zh) out+='<span class="gw">'+word+'<span class="gc">'+zh+'</span></span>';
    else out+='<span class="gw">'+word+'</span>';
    out+=post;
  }
  return out;
}

var PASSAGES = ALLP; // 当前筛选后的列表

var CHILD='user', KEY='', store={}, curGrade='all';
var TOTAL=0, current=0, score=0, answered=0;
var PASS_LINE=0.8;

function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

/* ============ 断点续学：跨会话保存/读取学习进度 ============
 * 独立落盘到 localStorage（不依赖外部模块），按 (孩子 + 年级) 分别记录当前关序号。
 * 下次进入自动从上次未学完的关继续，而不是重置回第一关。 */
function progKey(){ return 'engread_progress_' + CHILD + '_' + curGrade; }
function saveProgress(){
  try{ localStorage.setItem(progKey(), String(current)); }catch(e){}
}
function loadProgress(){
  var v=0;
  try{ v=parseInt(localStorage.getItem(progKey()),10); }catch(e){ v=0; }
  if(isNaN(v)||v<0) v=0;
  if(v>=PASSAGES.length) v=0; // 已完成或越界 → 从头开始
  return v;
}
function clearProgress(){ try{ localStorage.removeItem(progKey()); }catch(e){} }
function gradeKey(){ return 'engread_grade_' + CHILD; }
// 菜单上显示续学提示，并切换开始按钮文案
function renderMenuProgress(){
  var info=document.getElementById('resumeInfo');
  var btn=document.getElementById('startBtn');
  if(!info||!btn) return;
  var v=loadProgress();
  if(v>0 && v<PASSAGES.length){
    info.textContent='📌 上次学到：第 '+(v+1)+' 关 / 共 '+PASSAGES.length+' 关';
    btn.textContent='🚀 继续闯关（第 '+(v+1)+' 关）';
  } else {
    info.textContent='';
    btn.textContent='🚀 开始闯关';
  }
}
// 重置本年级续学进度（不影响最佳对题记录）
function resetProgress(){
  clearProgress(); current=0; renderMenuProgress();
}

function speak(text){
  /* 统一走 speech.js：优选最标准英文音色（Google/Natural/Apple），杜绝机械音 */
  if(window.Speech && Speech.speak){ Speech.speak(text, 0.9); return; }
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=0.9; u.pitch=1;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
function speakPassage(i){ speak(PASSAGES[i].en); }

function start(){
  score=0; answered=0;
  // 断点续学：从上次未学完的关继续，而不是重置回第一关
  current = loadProgress();
  saveProgress();        // 先落盘当前关，确保即使后续渲染异常也不会丢失进度
  setScreen('scrQuiz');
  renderPassage();
}
function goMenu(){ renderMenuProgress(); setScreen('scrMenu'); }

function setScreen(id){
  ['scrMenu','scrQuiz','scrReport'].forEach(function(s){
    document.getElementById(s).classList.toggle('on', s===id);
  });
}

function renderPassage(){
  var p=PASSAGES[current];
  var html=''+
    '<div class="passage">'+
      '<div class="ph"><span class="pemoji">'+p.emoji+'</span>'+
        '<span class="ptitle">'+p.title+'</span>'+
        '<div class="pbtns"><button onclick="speakPassage('+current+')">🔊 朗读</button>'+
        '<button class="b-tr" onclick="toggleTrans('+current+')">👁 翻译</button>'+
        '<button class="b-gl" onclick="togglePGloss('+current+')">🔤 逐字</button></div>'+
      '</div>'+
      '<div class="ptext" id="ptext-'+current+'">'+p.en+'</div>'+
      '<div class="ptrans" id="ptrans-'+current+'">'+p.cn+'</div>'+
      '<div class="pgloss" id="pgloss-'+current+'"></div>'+
    '</div>';
  p.qa.forEach(function(q,qi){
    var gi=current*2+qi;
    html+='<div class="q" id="q-'+gi+'">'+
      '<div class="qt"><span class="qn">Q'+(gi+1)+'.</span>'+q.q+'</div>'+
      '<div class="opts">';
    q.opts.forEach(function(o,oi){
      html+='<button class="opt" id="opt-'+gi+'-'+oi+'" onclick="answer('+gi+','+qi+','+oi+')">'+o+'</button>';
    });
    html+='</div>'+
      '<div class="why" id="why-'+gi+'"></div>'+
      '<div class="wtrans" id="wtrans-'+gi+'"></div>'+
      '<div id="hw-'+gi+'" class="hw-slot"></div>'+
    '</div>';
  });
  html+='<div style="margin-top:10px"><button onclick="nextReveal()" style="border:none;border-radius:14px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;background:#3a7bd5">➡️ 下一关（对照答案）</button></div>';
  document.getElementById('quizArea').innerHTML=html;
  updateProg();
  // 手写区：每道小题一块手写板，写完点「对照答案」看正确选项+解析
  p.qa.forEach(function(q,qi){
    var gi=current*2+qi;
    var _slot=document.getElementById('hw-'+gi);
    if(_slot && window.Handwrite){
      var at=(typeof q.ans==='number')?q.opts[q.ans]:q.ans;
      var _hw=Handwrite.create({revealText:at+'　'+q.why, placeholder:'✍️ 写出你的答案'});
      _slot.appendChild(_hw.el);
    }
  });
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('finishBtn').style.display='none';
}
function toggleTrans(i){
  document.getElementById('ptrans-'+i).classList.toggle('on');
}
// 整篇短文逐字翻译：按句拆行，每行词对词，孩子好对照
function buildPGloss(i){
  var el=document.getElementById('pgloss-'+i);
  if(!el) return null;
  if(el.getAttribute('data-filled')==='1') return el;
  var sents=String(PASSAGES[i].en).match(/[^.!?]+[.!?]*/g)||[PASSAGES[i].en];
  var h='<span class="glab">🔤 整篇逐字翻译（词对词）</span>';
  var n=0;
  for(var k=0;k<sents.length;k++){
    var s=sents[k].replace(/^\s+|\s+$/g,'');
    if(!s) continue;
    n++;
    h+='<div class="sline"><span class="sn">'+n+'.</span>'+gloss(s)+'</div>';
  }
  el.innerHTML=h;
  el.setAttribute('data-filled','1');
  return el;
}
function togglePGloss(i){
  var el=buildPGloss(i);
  if(el) el.classList.toggle('on');
}
function answer(gi,qi,oi){
  var q=PASSAGES[Math.floor(gi/2)].qa[qi];
  var qEl=document.getElementById('q-'+gi);
  if(qEl.classList.contains('done-ok')||qEl.classList.contains('done-no')) return;
  answered++;
  var ai=(typeof q.ans==='number')?q.ans:q.opts.indexOf(q.ans);
  var ok = (oi===ai);
  if(ok) score++;
  // color opts
  q.opts.forEach(function(o,bi){
    var b=document.getElementById('opt-'+gi+'-'+bi);
    b.classList.add('dim');
    if(bi===ai) b.classList.add('ok');
    if(bi===oi && !ok) b.classList.add('no');
  });
  qEl.classList.add(ok?'done-ok':'done-no');
  var w=document.getElementById('why-'+gi);
  w.textContent='解析：'+q.why;
  w.classList.add('on');
  if(!ok){
    // 答错：展开整篇中文翻译 + 整篇逐字 + 逐字翻译问句与选项，帮基础弱的孩子看懂
    document.getElementById('ptrans-'+current).classList.add('on');
    var pg=buildPGloss(current);
    if(pg) pg.classList.add('on');
    var wt=document.getElementById('wtrans-'+gi);
    var hh='<span class="lab">🔤 逐字翻译（词对词）</span>';
    hh+='<div>问句：'+gloss(q.q)+'</div>';
    q.opts.forEach(function(o,oi2){ hh+='<div class="optline"><b>'+String.fromCharCode(65+oi2)+'</b>'+gloss(o)+'</div>'; });
    wt.innerHTML=hh; wt.classList.add('on');
  }
  updateProg();
  // all questions of this passage answered?
  if(answered >= (current+1)*2){
    if(current < PASSAGES.length-1){
      document.getElementById('nextBtn').style.display='block';
    } else {
      document.getElementById('finishBtn').style.display='block';
    }
  }
}
function next(){
  if(current < PASSAGES.length-1){ current++; saveProgress(); renderPassage(); }
}
/* 手写模式：只写不点选项时，也能对照答案并翻到下一关 */
function nextReveal(){
  var p=PASSAGES[current];
  p.qa.forEach(function(q,qi){
    var gi=current*2+qi;
    var w=document.getElementById('why-'+gi);
    if(w){ var at=(typeof q.ans==='number')?q.opts[q.ans]:q.ans; w.textContent='解析：'+at+'　'+q.why; w.classList.add('on'); }
  });
  answered=Math.max(answered,(current+1)*2);
  updateProg();
  if(current < PASSAGES.length-1){ next(); }
  else { document.getElementById('finishBtn').style.display='block'; saveProgress(); }
}
function updateProg(){
  var qpct = Math.round(answered/TOTAL*100);
  document.getElementById('progBar').style.width=qpct+'%';
  document.getElementById('progTxt').textContent='第 '+(current+1)+' / '+PASSAGES.length+' 关 · 已答 '+answered+' / '+TOTAL;
}
function finish(){
  setScreen('scrReport');
  var pct = TOTAL? Math.round(score/TOTAL*100):0;
  var stars = pct>=90?3 : pct>=PASS_LINE*100?2 : pct>=60?1 : 0;
  var starStr = stars>0 ? '⭐'.repeat(stars) : '—';
  document.getElementById('rStars').textContent=starStr;
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rPct').textContent='正确率 '+pct+'%';
  var pass = pct>=PASS_LINE*100;
  document.getElementById('rPass').innerHTML = pass
    ? '<span class="pass">🎊 通关成功！达到 '+PASS_LINE*100+'% 过关线</span>'
    : '<span class="fail">💪 还差一点，再读一遍短文就通关啦</span>';
  // save best
  store=getStore();
  if(score > (store.best||0)){ store.best=score; setStore(store); }
  document.getElementById('bestNum').textContent=store.best||0;
  if(pass) celebrate();
  // 全部通关：写入"已完成"哨兵(=关总数)，下次打开自动从头再练一轮
  try{ localStorage.setItem(progKey(), String(PASSAGES.length)); }catch(e){}
}
function resetBest(){
  if(confirm('确定清空最佳对题记录？')){ setStore({best:0}); document.getElementById('bestNum').textContent='0'; }
}
function celebrate(){
  var emo=['🎉','✨','📖','🌟','⭐','💡','🎊','🔤'];
  for(var k=0;k<26;k++){
    (function(){
      var c=document.createElement('div'); c.className='confetti';
      c.textContent=emo[Math.floor(Math.random()*emo.length)];
      c.style.left=Math.random()*100+'vw';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ c.remove(); },4200);
    })();
  }
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

function renderGrades(){
  var labels=[['all','全部'],['1','一年级'],['2','二年级'],['3','三年级'],['4','四年级'],['5','五年级'],['6','六年级']];
  var html='';
  labels.forEach(function(l){
    html+='<button class="'+(curGrade===l[0]?'on':'')+'" onclick="setGradeFilter(\''+l[0]+'\')">'+l[1]+'</button>';
  });
  document.getElementById('grades').innerHTML=html;
}
function setGradeFilter(g){
  curGrade=g;
  try{ localStorage.setItem(gradeKey(), g); }catch(e){}
  PASSAGES = (g==='all') ? ALLP : ALLP.filter(function(p){ return p.g===parseInt(g,10); });
  TOTAL = PASSAGES.reduce(function(s,p){ return s+p.qa.length; },0);
  document.getElementById('totalNum').textContent=TOTAL;
  renderGrades();
  start();
}

(function(){
  var s=Portal.getSession();
  CHILD=(s&&s.child)?s.child:'user';
  KEY='english-read-'+CHILD;
  // 恢复上次选择的年级筛选：否则续学键(progKey 含 curGrade)与上次不一致，会回到第 1 关
  try{ var _g=localStorage.getItem(gradeKey()); if(_g) curGrade=_g; }catch(e){}
  PASSAGES = (curGrade==='all') ? ALLP : ALLP.filter(function(p){ return p.g===parseInt(curGrade,10); });
  TOTAL = PASSAGES.reduce(function(s,p){ return s+p.qa.length; },0);
  document.getElementById('totalNum').textContent=TOTAL;
  store=getStore();
  document.getElementById('bestNum').textContent=store.best||0;
  var d=new Date();
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('dateStr').textContent=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+wk;
  renderGrades();
  renderMenuProgress();
})();
