<meta charset="UTF-8">

<title>🎯 数学应用题闯关</title>
<style>
  :root{
    --pink:#ff8fab; --yellow:#ffd166; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#b292ff; --orange:#ff9f1c; --cream:#fff8ef; --ink:#3d3a4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#fff8ef,#eef6ff);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  header{background:linear-gradient(120deg,var(--blue),var(--green));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(76,201,240,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--blue)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}

  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}

  /* 题目卡 */
  .qcard{background:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 8px 22px rgba(76,201,240,.22);margin:6px 0}
  .qno{font-size:13px;color:#aaa;font-weight:700}
  .qtext{font-size:19px;font-weight:800;line-height:1.6;margin:8px 0 4px}
  .qnote{font-size:13px;color:#9aa;margin-bottom:6px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .opt{border:2px solid #cfe8ff;background:#fafdff;border-radius:16px;padding:14px;
    font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
  .opt:active{transform:scale(.98)}
  .opt .k{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;
    border-radius:50%;background:var(--blue);color:#fff;font-size:14px;margin-right:10px}
  .opt.right{border-color:var(--green);background:#eafff6;color:#1a9e76}
  .opt.wrong{border-color:#ff6b6b;background:#fff0f0;color:#e5484d}
  .opt.done{cursor:default}
  .feedback{font-size:14px;font-weight:800;margin-top:10px;min-height:20px;text-align:center}
  .feedback.ok{color:var(--green)}
  .feedback.no{color:#e5484d}
  .why{font-size:13px;color:#888;margin-top:6px;line-height:1.6;text-align:center;background:#f6faff;border-radius:12px;padding:10px}

  .progress{height:14px;background:#e3f0ff;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}

  .ctrls{display:flex;gap:10px;margin-top:14px}
  .ctrls button{flex:1;border:none;border-radius:16px;padding:14px;font-size:15px;
    font-family:inherit;cursor:pointer;color:#fff;font-weight:800;transition:transform .12s}
  .ctrls button:active{transform:scale(.96)}
  .c-next{background:var(--blue)}
  .c-restart{background:var(--orange)}

  /* 结算 */
  .result{background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 22px rgba(76,201,240,.22);margin:6px 0;display:none}
  .result .stars{font-size:40px;letter-spacing:6px;margin:8px 0}
  .result .score{font-size:30px;font-weight:800;color:var(--blue)}
  .result .msg{font-size:14px;color:#888;margin:8px 0 4px;line-height:1.6}

  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);
    border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
</style>
</head>
<body>



<header>
  <h1>🎯 数学应用题闯关</h1>
  <div class="date" id="dateStr">今天</div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="idxNum">1</div><div class="lbl">📍 第几题</div></div>
  <div class="stat"><div class="num" id="totalNum">0</div><div class="lbl">📚 总题数</div></div>
  <div class="stat"><div class="num" id="scoreNum">0</div><div class="lbl">✅ 答对</div></div>
</div>

<div class="qcard" id="qcard">
  <div class="qno" id="qno">题目 1 / 10</div>
  <div class="qtext" id="qtext">题干</div>
  <div class="qnote" id="qnote"></div>
  <div class="opts" id="opts"></div>
  <div id="hwSlot"></div>
  <div style="display:flex;justify-content:center;margin:8px 0"><button onclick="hwNextQuestion()" style="border:none;border-radius:14px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;background:#3a7bd5">➡️ 下一题（对照答案）</button></div>
  <div class="feedback" id="feedback"></div>
  <div class="why" id="why" hidden></div>
</div>

<div class="ctrls" id="ctrls" hidden>
  <button class="c-next" onclick="next()">➡️ 下一题</button>
  <button class="c-restart" onclick="restart()">🔄 再来一轮</button>
</div>

<div class="result" id="result">
  <div class="stars" id="rStars">⭐⭐⭐</div>
  <div class="score" id="rScore">10 / 10</div>
  <div class="msg" id="rMsg">全对！数学小天才 🏆</div>
  <button class="c-restart" style="border:none;color:#fff;padding:12px 28px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:800" onclick="restart()">🔄 再闯一次</button>
</div>

<div class="progress"><i id="progBar"></i></div>
<div class="prog-txt" id="progTxt">进度 0%</div>

<div class="tip">读完题先在心里列式算一算，再选答案。<br>数据按小朋友分别保存，不会上传。</div>

<div class="confetti" id="confettiBox" hidden></div>

<script>

var PASS_LINE = 0.8;   // 闯关过关线：正确率 ≥ 80% 视为通关

/* ============ 状态 ============ */
var idx = 0;
var score = 0;
var locked = false;   // 本题是否已作答（锁定选项）
var best = loadBest();

/* ============ 渲染 ============ */
function render(){
  var item = QUIZ[idx];
  document.getElementById('idxNum').textContent = idx + 1;
  document.getElementById('totalNum').textContent = QUIZ.length;
  document.getElementById('scoreNum').textContent = score;
  document.getElementById('qno').textContent = '题目 ' + (idx+1) + ' / ' + QUIZ.length;
  document.getElementById('qtext').textContent = item.q;
  document.getElementById('qnote').textContent = item.note ? '💡 ' + item.note : '';
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  var why = document.getElementById('why'); why.hidden = true; why.textContent = '';
  // 选项
  var letters = ['A','B','C','D'];
  document.getElementById('opts').innerHTML = item.opts.map(function(o,i){
    return '<button class="opt" onclick="choose('+i+')"><span class="k">'+letters[i]+'</span>'+o+'</button>';
  }).join('');
  // 手写区：每题重建手写板，写完点「对照答案」看正确数字+解析
  var _slot=document.getElementById('hwSlot');
  if(_slot && window.Handwrite){
    _slot.innerHTML='';
    var _hw=Handwrite.create({revealText:item.opts[item.ans]+'　'+item.why, placeholder:'✍️ 写出算式和答案'});
    _slot.appendChild(_hw.el);
  }
  locked = false;
  document.getElementById('ctrls').hidden = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('qcard').style.display = 'block';
  // 进度
  var pct = Math.round(idx / QUIZ.length * 100);
  document.getElementById('progBar').style.width = pct + '%';
  document.getElementById('progTxt').textContent = '进度 ' + pct + '%';
}

/* ============ 作答 ============ */
function choose(i){
  if (locked) return;
  locked = true;
  var item = QUIZ[idx];
  var btns = document.getElementById('opts').children;
  for (var k=0;k<btns.length;k++){
    btns[k].classList.add('done');
    if (k === item.ans) btns[k].classList.add('right');
    if (k === i && i !== item.ans) btns[k].classList.add('wrong');
  }
  var fb = document.getElementById('feedback');
  if (i === item.ans){ score++; fb.textContent = '✅ 答对啦！'; fb.className='feedback ok'; }
  else { fb.textContent = '❌ 正确是 ' + item.opts[item.ans]; fb.className='feedback no'; }
  document.getElementById('scoreNum').textContent = score;
  var why = document.getElementById('why');
  why.hidden = false; why.textContent = '解析：' + item.why;
  document.getElementById('ctrls').hidden = false;
}

/* ============ 下一题 / 结算 ============ */
function next(){
  if (idx >= QUIZ.length - 1){ finish(); return; }
  idx++;
  render();
}

/* 手写模式：只写不点选项时，也能对照答案并翻到下一题 */
function hwNextQuestion(){
  if (locked) return; locked = true;
  var item = QUIZ[idx];
  var why = document.getElementById('why'); why.hidden = false; why.textContent = '解析：' + item.why;
  var fb = document.getElementById('feedback'); fb.textContent = '✅ 已对照答案'; fb.className = 'feedback ok';
  setTimeout(next, 1200);
}
function finish(){
  document.getElementById('qcard').style.display = 'none';
  document.getElementById('ctrls').hidden = true;
  document.getElementById('progBar').style.width = '100%';
  document.getElementById('progTxt').textContent = '进度 100%';
  var rate = score / QUIZ.length;
  var stars = rate >= 1 ? '⭐⭐⭐' : (rate >= PASS_LINE ? '⭐⭐' : (rate >= 0.6 ? '⭐' : '🌱'));
  var msg = rate >= 1 ? '全对！数学小天才 🏆'
    : (rate >= PASS_LINE ? '通关！正确率达标 👍' : '再练练，下次更棒 💪');
  document.getElementById('rStars').textContent = stars;
  document.getElementById('rScore').textContent = score + ' / ' + QUIZ.length;
  document.getElementById('rMsg').textContent = msg;
  document.getElementById('result').style.display = 'block';
  if (score > best){ best = score; saveBest(); }
  if (rate >= PASS_LINE) confettiBurst();
}

/* ============ 庆祝 ============ */
function confettiBurst(){
  var emo = ['🌸','⭐','🌟','💡','🎉'];
  for (var i=0;i<20;i++){
    var s = document.createElement('div');
    s.className='confetti'; s.textContent = emo[i%emo.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
    document.body.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 3200); })(s);
  }
}

/* ============ 再来一轮 ============ */
function restart(){
  idx = 0; score = 0; locked = false;
  render();
}

/* ============ 存储 ============ */
function loadBest(){ try{ return parseInt(localStorage.getItem(KEY+'_best'))||0; }catch(e){ return 0; } }
function saveBest(){ try{ localStorage.setItem(KEY+'_best', String(best)); }catch(e){} }

/* ============ 启动 ============ */
(function(){
  try{ document.getElementById('dateStr').textContent =
    new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}); }catch(e){}
  render();
})();
