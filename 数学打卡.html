<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.github.com https:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'">

<script src="portal-common.js"></script>
<script>try{if(window.Portal&&Portal.require)Portal.require(["student","parent"],location.href);}catch(e){}</script>
<script src="accounts.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>➗ 数学每日打卡小精灵</title>
<style>
  :root{
    --pink:#ff8fab; --yellow:#ffd166; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#b292ff; --orange:#ff9f1c; --cream:#fff8ef; --ink:#3d3a4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#fff8ef,#eef6ff);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  header{background:linear-gradient(120deg,var(--blue),var(--green));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(76,201,240,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--orange)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}
  .tasks{display:flex;flex-direction:column;gap:10px}
  .task{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;
    padding:14px 16px;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.05);
    transition:transform .12s,background .2s;border:3px solid transparent}
  .task:active{transform:scale(.97)}
  .task .emoji{font-size:30px;flex-shrink:0}
  .task .txt{flex:1;font-size:15px}
  .task .txt small{display:block;color:#aaa;font-size:12px;margin-top:2px}
  .box{width:30px;height:30px;border-radius:50%;border:3px solid #cfe8ff;
    flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff}
  .task.done{background:#eafff6;border-color:var(--green)}
  .task.done .box{background:var(--green);border-color:var(--green)}
  .task.done .txt{color:#1a9e76;text-decoration:line-through;text-decoration-color:#9be8cf}
  .progress{height:14px;background:#e3f0ff;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}
  .week{display:flex;gap:6px;margin-top:6px}
  .day{flex:1;background:#fff;border-radius:14px;padding:10px 4px;text-align:center;
    box-shadow:0 3px 8px rgba(0,0,0,.05);font-size:12px;position:relative}
  .day .d{font-size:18px}
  .day.done{background:linear-gradient(135deg,#fff3c4,#ffe08a)}
  .day.today{outline:3px solid var(--blue)}
  .day .star{position:absolute;top:-8px;right:-4px;font-size:14px}
  .quiz{background:#fff;border-radius:18px;padding:16px;box-shadow:0 4px 12px rgba(0,0,0,.05);text-align:center}
  .q{font-size:30px;font-weight:800;color:var(--blue);margin:8px 0}
  .qsmall{font-size:14px;color:#aaa}
  .qbtns{display:flex;gap:10px;margin-top:12px}
  .qbtns button{flex:1;border:none;border-radius:14px;padding:11px;font-size:15px;
    font-family:inherit;cursor:pointer;color:#fff;font-weight:700}
  .qans{background:var(--orange)}
  .qnext{background:var(--blue)}
  .qres{font-size:15px;color:var(--green);min-height:22px;margin-top:10px;font-weight:700}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;
    text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px}
  .celebrate button{margin-top:16px;border:none;background:var(--orange);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
</style>
</head>
<body>

<header>
  <h1>➗ 数学每日打卡小精灵</h1>
  <div class="date" id="dateStr">今天</div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="streakNum">0</div><div class="lbl">🔥 连续打卡天数</div></div>
  <div class="stat"><div class="num" id="starNum">0</div><div class="lbl">⭐ 收集星星</div></div>
  <div class="stat"><div class="num" id="doneNum">0</div><div class="lbl">✅ 完成天数</div></div>
</div>

<h2>📝 今日打卡任务</h2>
<div class="tasks" id="tasks"></div>

<div class="progress"><i id="progBar"></i></div>
<div class="prog-txt" id="progTxt">完成 0 / 8 项</div>

<h2>📅 本周打卡日历</h2>
<div class="week" id="week"></div>

<h2>🎯 口算小挑战</h2>
<div class="quiz">
  <div class="qsmall">算一算下面这道题：</div>
  <div class="q" id="qText">23 + 45 = ?</div>
  <div class="qres" id="qRes"></div>
  <div class="qbtns">
    <button class="qans" onclick="showAns()">看答案 👀</button>
    <button class="qnext" onclick="newQuiz()">换一题 ➡️</button>
  </div>
</div>

<button class="reset" onclick="resetToday()">↺ 重置今天的打卡</button>
<div class="tip">数据只保存在这台设备的浏览器里，不会上传。<br>每天算一算、想一想，数学越来越扎实！</div>

<div class="celebrate" id="celeb">
  <div class="box2">
    <h3>🎉 太棒啦！</h3>
    <p id="celebTxt">今天全完成，获得 ⭐ 星星一枚！</p>
    <button onclick="closeCeleb()">继续加油 💪</button>
  </div>
</div>

<script>
var CHILD=(window.Portal&&Portal.getSession&&Portal.getSession().child)||'user';
// 学前（中班）儿童使用适龄任务集；小学儿童沿用原任务（每孩子独立 KEY，完成度判定按 TASKS.length，安全）
var IS_TODDLER=false;
try{ IS_TODDLER=window.Accounts&&Accounts.isToddler&&Accounts.isToddler(CHILD); }catch(e){}
var TASKS = IS_TODDLER ? [
  {id:'count',emoji:'🔢',name:'数一数 1~20',tip:'正着数/倒着数给爸妈听'},
  {id:'card',emoji:'🃏',name:'认数字卡片 5 张',tip:'说说像什么（2 像鸭子）'},
  {id:'compare',emoji:'⚖️',name:'比一比大小',tip:'谁多谁少/谁高谁矮'},
  {id:'shape',emoji:'🔺',name:'认 1 个图形',tip:'圆形/三角形/正方形'},
  {id:'sort',emoji:'🧦',name:'分类小任务 1 次',tip:'按颜色/大小/种类分一分'},
  {id:'life',emoji:'🛒',name:'生活数学 1 次',tip:'分水果/摆碗筷数一数'},
  {id:'build',emoji:'🧱',name:'图形拼搭 1 次',tip:'积木/磁力片搭一搭'},
  {id:'game',emoji:'🎲',name:'亲子数学游戏 1 次',tip:'飞行棋/数楼梯'}
] : [
  {id:'calc',emoji:'🧮',name:'口算打卡 10 题',tip:'计时挑战自己'},
  {id:'review',emoji:'🏗️',name:'复习 1 个易错点',tip:'进位/单位换算'},
  {id:'preview',emoji:'🚀',name:'预习四年级新知 1 个',tip:'大数/运算定律'},
  {id:'apply',emoji:'📝',name:'做 1 道应用题',tip:'读题→列式→检查'},
  {id:'game',emoji:'🎲',name:'玩数学游戏 1 次',tip:'24点/数独/购物'},
  {id:'life',emoji:'🛒',name:'生活数学 1 次',tip:'量一量/记记账'},
  {id:'oralset',emoji:'🔢',name:'口算专项 5 题',tip:'进位/退位练习'},
  {id:'geom',emoji:'📐',name:'看 1 个图形知识',tip:'对称/周长/面积'}
];
const KEY='mathCheckIn_'+CHILD+'_v1';
let data=load();let cur=null;
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{records:{}}}catch(e){return{records:{}}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}

function render(){
  const tk=todayKey();const rec=data.records[tk]||{};
  const now=new Date();
  const wk=['周日','周一','周二','周三','周四','周五','周六'][now.getDay()];
  document.getElementById('dateStr').textContent=now.getMonth()+1+'月'+now.getDate()+'日 '+wk;
  const box=document.getElementById('tasks');box.innerHTML='';let done=0;
  TASKS.forEach(t=>{const isDone=!!rec[t.id];if(isDone)done++;
    const el=document.createElement('div');el.className='task'+(isDone?' done':'');
    el.innerHTML=`<div class="emoji">${t.emoji}</div><div class="txt">${t.name}<small>${t.tip}</small></div><div class="box">${isDone?'✔':''}</div>`;
    el.onclick=()=>toggle(t.id);box.appendChild(el);});
  document.getElementById('progBar').style.width=(done/TASKS.length*100)+'%';
  document.getElementById('progTxt').textContent='完成 '+done+' / '+TASKS.length+' 项';
  document.getElementById('starNum').textContent=countStars();
  document.getElementById('doneNum').textContent=countDoneDays();
  document.getElementById('streakNum').textContent=countStreak();
  renderWeek();
}
function toggle(id){const tk=todayKey();if(!data.records[tk])data.records[tk]={};
  if(data.records[tk][id]){delete data.records[tk][id]}else{data.records[tk][id]=1}
  save();render();if(Object.keys(data.records[tk]).length===TASKS.length)celebrate();}
function countStars(){let s=0;for(const k in data.records)s+=Object.keys(data.records[k]).length;return s}
function countDoneDays(){let n=0;for(const k in data.records)if(Object.keys(data.records[k]).length===TASKS.length)n++;return n}
function countStreak(){let s=0;const d=new Date();
  if(!(data.records[todayKey()]&&Object.keys(data.records[todayKey()]).length===TASKS.length))d.setDate(d.getDate()-1);
  while(true){const k=dateKey(d);
    if(data.records[k]&&Object.keys(data.records[k]).length===TASKS.length){s++;d.setDate(d.getDate()-1)}else break;}
  return s;}
function renderWeek(){const wk=document.getElementById('week');wk.innerHTML='';
  const now=new Date();const monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);
  const labels=['一','二','三','四','五','六','日'];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);const k=dateKey(d);
    const full=data.records[k]&&Object.keys(data.records[k]).length===TASKS.length;const isToday=k===todayKey();
    const el=document.createElement('div');el.className='day'+(full?' done':'')+(isToday?' today':'');
    el.innerHTML=`<div>${labels[i]}</div><div class="d">${d.getDate()}</div>`+(full?'<span class="star">⭐</span>':'');
    wk.appendChild(el);}}
// quiz generator
function rnd(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function newQuiz(){
  // 学前儿童只出 10 以内加减；小学儿童四则运算
  if(IS_TODDLER){
    const t=rnd(0,1);let q,a;
    if(t===0){const x=rnd(1,9),y=rnd(1,10-x);q=x+'+'+y;a=x+y}
    else{const x=rnd(2,10),y=rnd(1,x-1);q=x+'-'+y;a=x-y}
    cur=a;document.getElementById('qText').textContent=q+' = ?';
    document.getElementById('qRes').textContent='';return;
  }
  const t=rnd(0,3);let q,a;
  if(t===0){const x=rnd(12,89),y=rnd(11,78);q=x+'+'+y;a=x+y}
  else if(t===1){const x=rnd(30,99),y=rnd(11,x);q=x+'-'+y;a=x-y}
  else if(t===2){const x=rnd(2,9),y=rnd(2,9);q=x+'×'+y;a=x*y}
  else{const y=rnd(2,9),a2=rnd(2,9)*y;q=a2+'÷'+y;a=a2/y}
  cur=a;document.getElementById('qText').textContent=q+' = ?';
  document.getElementById('qRes').textContent='';}
function showAns(){if(cur!==null)document.getElementById('qRes').textContent='答案是：'+cur+' ✅';}
function celebrate(){document.getElementById('celebTxt').textContent='今天 '+TASKS.length+' 项全完成，获得 ⭐ 星星一枚！';document.getElementById('celeb').style.display='flex';confetti()}
function closeCeleb(){document.getElementById('celeb').style.display='none'}
function confetti(){const emojis=['⭐','🎉','🌟','💛','🎊','✨'];
  for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.textContent=emojis[i%emojis.length];
    c.style.left=Math.random()*100+'vw';c.style.animationDuration=(2+Math.random()*2)+'s';c.style.fontSize=(18+Math.random()*20)+'px';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4200);}}
function resetToday(){const tk=todayKey();delete data.records[tk];save();render();}
newQuiz();render();
</script>
</body>
</html>
