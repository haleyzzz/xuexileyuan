<style>
  :root{
    --green:#06d6a0; --purple:#b292ff; --blue:#4cc9f0; --orange:#ff9f1c;

  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}

  header{background:linear-gradient(120deg,var(--green),var(--purple));color:#fff;

  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:24px;font-weight:800;color:var(--green)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}

  .items{display:flex;flex-direction:column;gap:12px}
  .item{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);
    overflow:hidden;border:3px solid transparent;transition:border-color .2s}
  .item.done{border-color:var(--green)}
  .ifront{padding:15px 16px;display:flex;align-items:center;gap:14px;cursor:pointer}
  .ifront .iemoji{font-size:32px;flex-shrink:0}
  .ifront .itxt{flex:1}
  .ifront .iname{font-size:16px;font-weight:800}
  .ifront .ihint{font-size:12px;color:#aaa;margin-top:3px}
  .ifront .iarrow{font-size:20px;color:var(--green);flex-shrink:0}
  .iback{padding:4px 16px 14px}
  .iback .guide{font-size:13px;color:#666;line-height:1.7;background:#f1fbf8;
    border-radius:12px;padding:10px;margin-bottom:10px}
  .iback textarea{width:100%;border:1.5px solid #e6eef0;border-radius:12px;padding:10px;
    font-size:14px;font-family:inherit;resize:vertical;min-height:62px;color:var(--ink)}
  .iback textarea:focus{outline:none;border-color:var(--green)}
  .iback .irow{display:flex;gap:10px;margin-top:10px}
  .iback .irow button{flex:1;border:none;border-radius:14px;padding:10px;font-size:14px;
    font-family:inherit;cursor:pointer;font-weight:700;color:#fff}
  .b-save{background:var(--blue)}
  .b-mark{background:var(--green)}
  .imark{width:100%;border:none;border-top:1px solid #f0f0f0;background:#fff;
    padding:11px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#bbb}
  .item.done .imark{color:var(--green);background:#edfff8}
  .mark-ic{display:inline-block;width:20px}
  .recnote{font-size:12px;color:#999;margin-top:6px;padding:0 4px;line-height:1.5}

  .progress{height:14px;background:#d8f5ec;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--purple));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}
  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;
    text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--green);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
</style>

var CHILD='user', KEY='', TEXT={};
function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function isDone(id){ var s=getStore(); return !!(s[id]&&s[id].done); }
function noteOf(id){ var s=getStore(); return (s[id]&&s[id].note)||''; }

var pens={};
function render(){
  pens={};
  var html='';
  TASKS.forEach(function(t,i){
    var done=isDone(t.id);
    html+='<div class="item'+(done?' done':'')+'" id="item-'+i+'">'+
      '<div class="ifront" onclick="flip('+i+')">'+
        '<span class="iemoji">'+t.emoji+'</span>'+
        '<div class="itxt"><div class="iname">'+t.name+'</div>'+
        '<div class="ihint">'+t.hint+'</div></div>'+
        '<span class="iarrow">👉</span>'+
      '</div>'+
      '<div class="iback" id="back-'+i+'" hidden>'+
        '<div class="guide">🔎 观察指南：'+t.guide+'</div>'+
        '<textarea id="ta-'+i+'" placeholder="我发现了……（记下来吧）">'+escapeHtml(noteOf(t.id))+'</textarea>'+
        '<div class="mtitle" style="margin-top:8px">🖌 也可以画一张观察到的事物（选填）</div>'+
        '<div id="penSlot-'+i+'"></div>'+
        '<div class="pp-tools"><button class="pp-btn save" onclick="savePen('+i+')">📥 保存图画</button></div>'+
        '<div class="pp-previews" id="penprev-'+i+'">'+penPrevHtml(i)+'</div>'+
        '<div class="irow"><button class="b-save" onclick="saveNote('+i+')">💾 保存记录</button>'+
        '<button class="b-mark" onclick="mark('+i+')">✅ 已观察</button></div>'+
        (done?'<div class="recnote">📝 已记录：'+escapeHtml(noteOf(t.id))+'</div>':'')+
      '</div>'+
      '<button class="imark" onclick="mark('+i+')">'+
        '<span class="mark-ic">'+(done?'✅':'⬜')+'</span>'+(done?' 已观察':' 标记已观察')+'</button>'+
    '</div>';
  });
  document.getElementById('items').innerHTML=html;
  updateStats();
}
function flip(i){
  var b=document.getElementById('back-'+i);
  if(b.hidden){ b.hidden=false; document.getElementById('item-'+i).querySelector('.iarrow').textContent='👆'; requestAnimationFrame(function(){ initPen(i); }); }
  else { b.hidden=true; document.getElementById('item-'+i).querySelector('.iarrow').textContent='👉'; }
}
function initPen(i){
  if(pens[i]) return;
  var slot=document.getElementById('penSlot-'+i); if(!slot) return;
  if(!window.PenPaint) return;
  pens[i]=PenPaint.create({height:180, placeholder:'🖌 画你观察到的事物'});
  slot.appendChild(pens[i].el);
}
function savePen(i){
  var pen=pens[i]; if(!pen || pen.isEmpty()){ alert('先在画板上画点什么～'); return; }
  var t=TASKS[i]; var s=getStore(); s[t.id]=s[t.id]||{};
  s[t.id].images=(s[t.id].images||[]).concat(pen.toDataURL());
  setStore(s);
  renderPenPrev(i);
}
function penPrevHtml(i){
  var t=TASKS[i]; var s=getStore(); var imgs=(s[t.id]&&s[t.id].images)||[];
  if(!imgs.length) return '';
  return imgs.map(function(src,idx){
    return '<div class="pp-pwrap"><img src="'+src+'" alt="笔迹"><button class="pp-pd" onclick="delPenImg('+i+','+idx+')">✕</button></div>';
  }).join('');
}
function renderPenPrev(i){
  var el=document.getElementById('penprev-'+i); if(el) el.innerHTML=penPrevHtml(i);
}
function delPenImg(i,idx){
  var t=TASKS[i]; var s=getStore(); if(!s[t.id]||!s[t.id].images) return;
  s[t.id].images.splice(idx,1); setStore(s); renderPenPrev(i);
}
function saveNote(i){
  var t=TASKS[i], ta=document.getElementById('ta-'+i).value;
  var s=getStore(); s[t.id]=s[t.id]||{}; s[t.id].note=ta; setStore(s);
  var note=document.getElementById('item-'+i).querySelector('.recnote');
  if(!note){ note=document.createElement('div'); note.className='recnote';
    document.getElementById('back-'+i).appendChild(note); }
  note.textContent='📝 已记录：'+(ta||'（空）');
  flash(document.getElementById('back-'+i).querySelector('.b-save'),'已存！');
}
function mark(i){
  var t=TASKS[i];
  var s=getStore(); s[t.id]=s[t.id]||{};
  if(s[t.id].done){ delete s[t.id].done; if(!s[t.id].note) delete s[t.id]; }
  else { s[t.id].done=true; s[t.id].at=Date.now();
    var ta=document.getElementById('ta-'+i); if(ta) s[t.id].note=ta.value; }
  setStore(s);
  render();
  if(Object.keys(getStore()).filter(function(k){ return getStore()[k].done; }).length===TASKS.length){ celebrate(); }
}
function updateStats(){
  var done=Object.keys(getStore()).filter(function(k){ return getStore()[k].done; }).length;
  var total=TASKS.length, pct=total?Math.round(done/total*100):0;
  document.getElementById('doneNum').textContent=done;
  document.getElementById('totalNum').textContent=total;
  document.getElementById('pctNum').textContent=pct+'%';
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent='完成 '+done+' / '+total+' 项';
}
function resetAll(){ if(confirm('确定清空所有观察记录？')){ setStore({}); render(); } }
function escapeHtml(s){ return (s||'').replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function flash(btn,txt){ var o=btn.textContent; btn.textContent=txt; setTimeout(function(){ btn.textContent=o; },900); }
function celebrate(){
  var emo=['🎉','✨','🌿','🌟','🔭','🌈','🍃','🌸'];
  for(var k=0;k<26;k++){
    (function(){
      var c=document.createElement('div'); c.className='confetti';
      c.textContent=emo[Math.floor(Math.random()*emo.length)];
      c.style.left=Math.random()*100+'vw';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ c.remove(); },4200);
    })();
  }
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

(function(){
  var s=Portal.getSession();
  CHILD=(s&&s.child)?s.child:'user';
  KEY='science-observe-'+CHILD;
  var d=new Date();
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('dateStr').textContent=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+wk;
  render();
})();
</script>
