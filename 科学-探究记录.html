<title>🔬 科学探究记录</title>
<style>
  :root{
    --green:#06d6a0; --purple:#b292ff; --blue:#4cc9f0; --orange:#ff9f1c;
    --pink:#f72585; --ink:#2b3a4a;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#fff3e6,#eafff7);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  header{background:linear-gradient(120deg,var(--orange),var(--green));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(255,159,28,.35)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:24px;font-weight:800;color:var(--orange)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}

  .items{display:flex;flex-direction:column;gap:12px}
  .item{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);
    overflow:hidden;border:3px solid transparent;transition:border-color .2s}
  .item.done{border-color:var(--green)}
  .ifront{padding:15px 16px;display:flex;align-items:center;gap:14px;cursor:pointer}
  .ifront .iemoji{font-size:32px;flex-shrink:0}
  .ifront .itxt{flex:1}
  .ifront .iname{font-size:16px;font-weight:800}
  .ifront .ihint{font-size:12px;color:#aaa;margin-top:3px}
  .ifront .iarrow{font-size:20px;color:var(--orange);flex-shrink:0}
  .iback{padding:4px 16px 14px}
  .iback .q{font-size:15px;font-weight:800;color:var(--orange);margin:6px 0 8px}
  .iback .guide{font-size:13px;color:#666;line-height:1.7;background:#fff6ec;
    border-radius:12px;padding:10px;margin-bottom:10px}
  .iback .guide b{color:var(--ink)}
  .iback label{display:block;font-size:13px;font-weight:700;margin:8px 2px 4px;color:#557}
  .iback textarea{width:100%;border:1.5px solid #ffe2c2;border-radius:12px;padding:10px;
    font-size:14px;font-family:inherit;resize:vertical;min-height:54px;color:var(--ink)}
  .iback textarea:focus{out-line:none;border-color:var(--orange)}

  /* 多媒体区 */
  .media{border:1.5px dashed #ffd1a3;border-radius:14px;padding:10px;margin:10px 0;background:#fffaf3}
  .media .mtitle{font-size:13px;font-weight:700;color:var(--orange);margin-bottom:8px}
  .upload-btn{display:inline-block;background:var(--blue);color:#fff;border:none;border-radius:12px;
    padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:8px}
  .rec-btn{display:inline-block;background:var(--pink);color:#fff;border:none;border-radius:12px;
    padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-right:8px}
  .rec-btn.recording{background:#e22;animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.55}}
  .rec-tip{font-size:11px;color:#aaa;margin-top:6px}
  .previews{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .pwrap{position:relative}
  .pwrap img{width:74px;height:74px;object-fit:cover;border-radius:10px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.12)}
  .pwrap .pd{position:absolute;right:-6px;top:-6px;width:20px;height:20px;border-radius:50%;
    background:#c33;color:#fff;border:none;font-size:12px;line-height:20px;cursor:pointer;font-family:inherit}
  .voice-tag{display:inline-flex;align-items:center;gap:6px;background:#fdeaff;border:1.5px solid #e9b3ff;
    border-radius:12px;padding:6px 10px;margin-top:6px;font-size:13px;color:#a23}
  .voice-tag button{border:none;background:#a23;color:#fff;border-radius:8px;padding:3px 8px;cursor:pointer;font-family:inherit}

  .iback .irow{display:flex;gap:10px;margin-top:12px}
  .iback .irow button{flex:1;border:none;border-radius:14px;padding:11px;font-size:14px;
    font-family:inherit;cursor:pointer;font-weight:700;color:#fff}
  .b-save{background:var(--green)}
  .b-clear{background:#cdd}
  .recnote{font-size:12px;color:#999;margin-top:6px;padding:0 4px;line-height:1.5}

  .progress{height:14px;background:#ffe6cc;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--green));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}

  /* 探究日记 */
  .diary{display:flex;flex-direction:column;gap:10px;margin-top:4px}
  .drec{background:#fff;border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.05);
    padding:12px 14px;border-left:5px solid var(--orange)}
  .drec .dh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .drec .dh .de{font-size:22px}
  .drec .dh .dn{font-size:14px;font-weight:800;flex:1}
  .drec .dh .dd{font-size:11px;color:#aaa}
  .drec .dh .ddel{border:none;background:none;color:#c99;font-size:16px;cursor:pointer;font-family:inherit}
  .drec .dr{font-size:13px;line-height:1.6;color:#556;margin:2px 0}
  .drec .dr b{color:var(--ink)}
  .drec .dphotos{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
  .drec .dphotos img{width:64px;height:64px;object-fit:cover;border-radius:9px;cursor:pointer;box-shadow:0 2px 5px rgba(0,0,0,.1)}
  .drec .dvoice{margin:6px 0}
  .empty{font-size:13px;color:#aaa;text-align:center;padding:14px}

  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;
    text-decoration:underline;display:block;margin:14px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--orange);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
  /* 图片放大遮罩 */
  .imgmodal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;
    align-items:center;justify-content:center;z-index:120;flex-direction:column;padding:20px}
  .imgmodal img{max-width:100%;max-height:80vh;border-radius:12px}
  .imgmodal .close{margin-top:14px;background:#fff;color:#333;border:none;border-radius:12px;
    padding:9px 22px;font-size:15px;cursor:pointer;font-family:inherit;font-weight:700}
</style>
</head>

<h2>🌟 选一个主题来探究</h2>

<button class="reset" onclick="resetAll()">↺ 清空我的探究日记</button>

</div>

<div class="imgmodal" id="imgModal" onclick="closeImg()">

<script>
var TOPICS=[
  {id:'seed',emoji:'🌱',name:'种子发芽需要什么？',
    mat:'绿豆、棉花、水、两个小盘',

    mat:'盐、温水、透明杯、搅拌棒',

var CHILD, store={records:[]}, openId=null;
var KEY='sci-inquiry-'+ (CHILD||'');

function load(){
  CHILD = (window.Portal && Portal.getSession && Portal.getSession().child) || 'child';
  KEY = 'sci-inquiry-'+CHILD;
  try{ var s=localStorage.getItem(KEY); if(s) store=JSON.parse(s); }catch(e){}
  if(!store.records) store.records=[];
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){ alert('存储空间满了，照片太多啦，删掉一些再试～'); } }

function init(){
  load();
  var d=new Date();
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('dateStr').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+wk;
  renderTopics(); renderDiary(); renderStats();
}

function doneTopics(){
  var set={}; store.records.forEach(function(r){ set[r.topicId]=1; });
  return Object.keys(set).length;
}
function renderStats(){
  var dn=doneTopics(), tot=TOPICS.length, rn=store.records.length;
  document.getElementById('doneNum').textContent=dn;
  document.getElementById('recNum').textContent=rn;
  document.getElementById('pctNum').textContent=Math.round(dn/tot*100)+'%';
  document.getElementById('progBar').style.width=(dn/tot*100)+'%';
  document.getElementById('progTxt').textContent='完成 '+dn+' / '+tot+' 个主题';
}

function renderTopics(){
  var html='';
  TOPICS.forEach(function(t){
    var has=store.records.some(function(r){return r.topicId===t.id;});
    html+='<div class="item'+(has?' done':'')+'" id="it-'+t.id+'">'+
      '<div class="ifront" onclick="toggle(\''+t.id+'\')">'+
        '<div class="iemoji">'+t.emoji+'</div>'+
        '<div class="itxt"><div class="iname">'+esc(t.name)+'</div>'+
        '<div class="ihint">'+(has?'已留下记录 ✅':'点开做实验、写记录')+'</div></div>'+
        '<div class="iarrow">'+(openId===t.id?'▲':'▶')+'</div>'+
      '</div>'+
      (openId===t.id? backHtml(t):'')+
    '</div>';
  });
  document.getElementById('items').innerHTML=html;
  if(openId) requestAnimationFrame(initPen);
}
function backHtml(t){
  var photos=(openDraft&&openDraft.photos)||[];
  var voice=(openDraft&&openDraft.voice)||null;
  var pv='';
  photos.forEach(function(p,i){
    pv+='<div class="pwrap"><img src="'+p+'" onclick="showImg(\''+p.replace(/'/g,"\\'")+'\')"><button class="pd" onclick="delPhoto('+i+')">✕</button></div>';
  });
  var vt = voice ? '<div class="voice-tag">🎤 已录语音 <button onclick="playVoice(\''+voice.replace(/'/g,"\\'")+'\')">▶ 试听</button> <button onclick="delVoice()">删</button></div>' : '';
  var recState = (recTopicId===t.id && recording)? ' recording':'';
  return '<div class="iback">'+
    '<div class="q">❓ '+esc(t.name)+'</div>'+
    '<div class="guide"><b>🧰 准备材料：</b>'+esc(t.mat)+'<br>'+
      '<b>🪜 怎么做：</b>'+esc(t.step)+'<br>'+
      '<b>💡 引导思考：</b>'+esc(t.think)+'</div>'+
    '<label>🌟 我的猜想</label>'+
    '<textarea id="tg" placeholder="你觉得会发生什么？">'+draftVal(t.id,'guess')+'</textarea>'+
    '<label>👀 我观察到的</label>'+
    '<textarea id="ts" placeholder="实验里你看到了什么？">'+draftVal(t.id,'see')+'</textarea>'+
    '<label>🧠 我的结论</label>'+
    '<textarea id="tc" placeholder="你发现了什么道理？">'+draftVal(t.id,'concl')+'</textarea>'+
    '<div class="media">'+
      '<div class="mtitle">📷 拍张照片 / 🎤 录段语音（选填）</div>'+
      '<label class="upload-btn">📷 选照片<input type="file" accept="image/*" multiple id="tphoto" style="display:none" onchange="onPick(event)"></label>'+
      '<button class="rec-btn'+recState+'" id="trec" onclick="'+(recording? 'stopRec(\''+t.id+'\')':'startRec(\''+t.id+'\')')+'">'+(recording&&recTopicId===t.id?'⏹ 停止录音':'🎤 录语音')+'</button>'+
      '<div class="rec-tip">照片会自动压缩保存；语音最多 30 秒。都可以不填。</div>'+
      '<div class="mtitle" style="margin-top:10px">🖌 画一张示意图（选填）</div>'+
      '<div id="penSlot"></div>'+
      '<div class="pp-tools"><button class="pp-btn save" onclick="savePen()">📥 保存笔迹到记录</button></div>'+
      '<div class="rec-tip">画完点「保存笔迹到记录」，会像照片一样存进这条记录；图（照片+笔迹）最多共 6 张。</div>'+
      '<div class="previews" id="tpreviews">'+pv+'</div>'+
      vt+
    '</div>'+
    '<div class="irow">'+
      '<button class="b-save" onclick="saveRec(\''+t.id+'\')">💾 保存这条记录</button>'+
      '<button class="b-clear" onclick="clearDraft(\''+t.id+'\')">🧹 清空</button>'+
    '</div>'+
    '<div class="recnote">提示：猜想、发现、结论都填一点，保存后会出现在下方「探究日记」里。有照片/语音会一起存进去。</div>'+
  '</div>';
}
function draftVal(topicId,key){
  if(!openDraft||openDraft.topicId!==topicId) return '';
  return esc(openDraft[key]||'');
}
var openDraft=null;
var recTopicId=null, recording=false;
var _pen=null;
function initPen(){
  var slot=document.getElementById('penSlot'); if(!slot) return;
  if(!window.PenPaint){ return; }
  _pen=PenPaint.create({height:180, placeholder:'🖌 画实验装置 / 你看到的现象'});
  slot.appendChild(_pen.el);
}
function savePen(){
  if(!openId || !_pen || _pen.isEmpty()){ alert('先在画板上画点什么吧～'); return; }
  if(openDraft.photos.length>=6){ alert('每个主题最多存 6 张图（照片 + 笔迹）哦～'); return; }
  openDraft.photos.push(_pen.toDataURL());
  renderTopics();
}

function toggle(id){
  if(openId===id){ openId=null; openDraft=null; }
  else {
    openId=id;
    var rec=store.records.filter(function(r){return r.topicId===id;}).pop();
    openDraft= rec? {topicId:id,guess:rec.guess||'',see:rec.see||'',concl:rec.concl||'',photos:(rec.photos||[]).slice(),voice:rec.voice||null}
                 : {topicId:id,guess:'',see:'',concl:'',photos:[],voice:null};
  }
  renderTopics();
}
function syncDraft(){
  if(!openDraft) return;
  var g=document.getElementById('tg'), s=document.getElementById('ts'), c=document.getElementById('tc');
  if(g) openDraft.guess=g.value; if(s) openDraft.see=s.value; if(c) openDraft.concl=c.value;
}
function clearDraft(id){
  syncDraft();
  openDraft={topicId:id,guess:'',see:'',concl:'',photos:[],voice:null};
  renderTopics();
}
function saveRec(id){
  syncDraft();
  var g=openDraft.guess.trim(), s=openDraft.see.trim(), c=openDraft.concl.trim();
  if(!g && !s && !c && !(openDraft.photos&&openDraft.photos.length) && !openDraft.voice){
    alert('先写一点猜想、发现或结论，或拍张照片/录段语音吧～'); return;
  }
  var t=TOPICS.filter(function(x){return x.id===id;})[0];
  store.records.push({topicId:id, topicName:t.name, emoji:t.emoji, guess:g, see:s, concl:c,
    photos:(openDraft.photos||[]).slice(), voice:openDraft.voice||null, ts:Date.now()});
  save();
  renderTopics(); renderDiary(); renderStats();
  if(doneTopics()===TOPICS.length) celebrate();
  else confetti();
}

/* 图片：选择 -> 压缩 -> 存草稿 */
function onPick(ev){
  if(!openDraft) return;
  var files=ev.target.files||[];
  var left=6-((openDraft.photos||[]).length);
  var n=Math.min(files.length, Math.max(0,left));
  if(left<=0){ alert('每个主题最多存 6 张照片哦～'); }
  var pending=n;
  if(pending===0) return;
  for(var i=0;i<n;i++){
    compressImg(files[i], function(b64){
      if(b64){ openDraft.photos.push(b64); }
      pending--;
      if(pending===0){ renderTopics(); }
    });
  }
  ev.target.value='';
}
function compressImg(file, cb){
  if(!file || !/^image\//.test(file.type)){ cb(null); return; }
  var reader=new FileReader();
  reader.onload=function(){
    var img=new Image();
    img.onload=function(){
      var max=900, w=img.width, h=img.height;
      if(w>max||h>max){ var r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      try{
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        cb(cv.toDataURL('image/jpeg',0.72));
      }catch(e){ cb(null); }
    };
    img.onerror=function(){ cb(null); };
    img.src=reader.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}
function delPhoto(i){
  if(!openDraft||!openDraft.photos) return;
  openDraft.photos.splice(i,1); renderTopics();
}

/* 语音：MediaRecorder 录制 -> base64 */
var mediaRec=null, recChunks=[], recStream=null, recTimer=null;
function canRecord(){ return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); }
function startRec(topicId){
  if(!openDraft||openDraft.topicId!==topicId) return;
  if(!canRecord()){ alert('当前浏览器不支持录音（需 https 或较新手机）'); return; }
  recTopicId=topicId;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    recStream=st; recChunks=[];
    var opt={}; try{ if(MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported('audio/webm')) opt.mimeType='audio/webm'; }catch(e){}
    mediaRec=new MediaRecorder(st,opt);
    mediaRec.ondataavailable=function(e){ if(e.data&&e.data.size) recChunks.push(e.data); };
    mediaRec.onstop=function(){
      var blob=new Blob(recChunks,{type:mediaRec.mimeType||'audio/webm'});
      var rd=new FileReader();
      rd.onload=function(){ openDraft.voice=rd.result; recording=false; renderTopics(); };
      rd.readAsDataURL(blob);
      if(recStream) recStream.getTracks().forEach(function(t){t.stop();});
    };
    mediaRec.start();
    recording=true; renderTopics();
    recTimer=setTimeout(function(){ if(mediaRec&&mediaRec.state==='recording') stopRec(topicId); }, 30000);
  }).catch(function(){ alert('无法访问麦克风，请检查浏览器权限'); recording=false; });
}
function stopRec(topicId){
  if(recTimer){ clearTimeout(recTimer); recTimer=null; }
  if(mediaRec&&mediaRec.state==='recording'){ mediaRec.stop(); }
  else { recording=false; renderTopics(); }
}
function delVoice(){
  if(!openDraft) return;
  openDraft.voice=null; recording=false; renderTopics();
}
function playVoice(src){ var a=new Audio(src); a.play(); }

/* 图片放大 */
function showImg(src){ document.getElementById('imgBig').src=src; document.getElementById('imgModal').style.display='flex'; }
function closeImg(){ document.getElementById('imgModal').style.display='none'; }

function renderDiary(){
  var box=document.getElementById('diary');
  if(!store.records.length){ box.innerHTML='<div class="empty">还没有记录，去上面选个主题做实验吧 🔬</div>'; return; }
  var arr=store.records.slice().sort(function(a,b){return b.ts-a.ts;});
  var html='';
  arr.forEach(function(r,idx){
    var realIdx=store.records.indexOf(r);
    var photos=(r.photos||[]);
    var pv='';
    photos.forEach(function(p){ pv+='<img src="'+p+'" onclick="showImg(\''+p.replace(/'/g,"\\'")+'\')">'; });
    var vv = r.voice ? '<div class="dvoice"><audio controls src="'+r.voice+'"></audio></div>' : '';
    html+='<div class="drec">'+
      '<div class="dh"><span class="de">'+r.emoji+'</span>'+
        '<span class="dn">'+esc(r.topicName)+'</span>'+
        '<span class="dd">'+fmt(r.ts)+'</span>'+
        '<button class="ddel" onclick="delRec('+realIdx+')">✕</button></div>'+
      (r.guess?'<div class="dr"><b>🌟 猜想：</b>'+esc(r.guess)+'</div>':'')+
      (r.see?'<div class="dr"><b>👀 发现：</b>'+esc(r.see)+'</div>':'')+
      (r.concl?'<div class="dr"><b>🧠 结论：</b>'+esc(r.concl)+'</div>':'')+
      (pv?'<div class="dphotos">'+pv+'</div>':'')+
      vv+
    '</div>';
  });
  box.innerHTML=html;
}
function delRec(i){
  if(!confirm('删除这条探究记录？')) return;
  store.records.splice(i,1); save();
  renderTopics(); renderDiary(); renderStats();
}
function fmt(ts){
  var d=new Date(ts);
  return (d.getMonth()+1)+'/'+d.getDate()+' '+(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes();
}

function resetAll(){
  if(!confirm('清空「'+CHILD+'」的所有探究日记？此操作不可恢复。')) return;
  store={records:[]}; save(); openId=null; openDraft=null; recording=false; recTopicId=null;
  renderTopics(); renderDiary(); renderStats();
}

/* 撒花 */
function confetti(){
  var emojis=['🎉','🔬','✨','🌟','💡','🧪','🌈','⭐'];
  for(var i=0;i<24;i++){
    (function(i){
      var s=document.createElement('div');
      s.className='confetti'; s.textContent=emojis[i%emojis.length];
      s.style.left=(Math.random()*100)+'vw';
      s.style.animationDuration=(1.6+Math.random()*1.4)+'s';
      document.body.appendChild(s);
      setTimeout(function(){ s.remove(); },3200);
    })(i);
  }
}
function celebrate(){ document.getElementById('celeb').style.display='flex'; confetti(); }
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

init();
</script>
