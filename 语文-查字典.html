  .opt.ok{background:var(--green);color:#fff}
  .opt.no{background:#ff6b6b;color:#fff}
  .opt.dim{opacity:.45;pointer-events:none}
  .optrow{display:flex;align-items:center;gap:8px;margin-top:8px}

var CHILD='user', KEY='', store={};
var TOTAL=0, score=0, answered=0, PASS_LINE=0.8;
function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function start(){ score=0; answered=0; setScreen('scrQuiz'); renderQuiz(); }
function goMenu(){ setScreen('scrMenu'); }
function setScreen(id){ ['scrMenu','scrQuiz','scrReport'].forEach(function(s){ document.getElementById(s).classList.toggle('on', s===id); }); }
function speakZh(text){
  if(!window.speechSynthesis){ if(window.toast) window.toast('当前浏览器不支持发音'); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  var u=new SpeechSynthesisUtterance(text);
  u.lang='zh-CN'; u.rate=0.85; u.pitch=1;
  var vs=speechSynthesis.getVoices()||[];
  var zh=vs.filter(function(v){ return v.lang && /^zh[-_]/i.test(v.lang); });
  if(zh.length){
    var pick=zh.slice().sort(function(a,b){
      function sc(v){ var n=(v.name||'').toLowerCase(), s=0;
        if(/google|natural|neural/.test(n)) s+=5;
        if(/xiaoxiao|xiaoIce|huihui|tingting|yaoyao|kangkang|mei-|taiwan|hongkong/i.test(n)) s+=3;
        if(/microsoft/.test(n)) s+=2; return s; }
      return sc(b)-sc(a);
    })[0];
    u.voice=pick;
  }
  window.__ttsUtt=u;
  try{ speechSynthesis.resume(); }catch(e){}
  var started=false; u.onstart=function(){started=true;};
  var pt=setTimeout(function(){ if(!started && !speechSynthesis.speaking && window.toast) window.toast('点了没声音？检查：①设备音量 ②iPad 侧边静音键 ③系统语音朗读设置'); },3000);
  u.onend=function(){ if(pt){clearTimeout(pt);pt=null;} };
  u.onerror=function(){ if(pt){clearTimeout(pt);pt=null;} };
  setTimeout(function(){ try{ speechSynthesis.speak(u); }catch(e){} },60);
}

function renderQuiz(){
  var html='';
  QUIZ.forEach(function(q,gi){
    html+='<div class="q" id="q-'+gi+'">'+
      '<div class="qt"><span class="qn">Q'+(gi+1)+'.</span>'+q.q+'<button class="spk" onclick="speakZh('+"'"+q.q+"'"+')" title="朗读题目">🔊</button></div><div class="opts">';
    q.opts.forEach(function(o,oi){ html+='<div class="optrow"><button class="opt" id="opt-'+gi+'-'+oi+'" onclick="answer('+gi+','+oi+')">'+o+'</button>'+'<button class="spk" onclick="speakZh('+"'"+o+"'"+')" title="朗读">🔊</button></div>'; });
    html+='</div><div class="why" id="why-'+gi+'"></div><div class="hw-slot" id="hw-'+gi+'"></div></div>';
  });
  document.getElementById('quizArea').innerHTML=html;
  if(window.Handwrite){
    QUIZ.forEach(function(q,gi){
      var slot=document.getElementById('hw-'+gi);
      var hw=Handwrite.create({revealText:String(q.opts[q.ans]), placeholder:'✍️ 用手写部首（如 '+q.opts[q.ans]+'）', onReveal:function(){ markHW(gi, TOTAL); }});
      slot.appendChild(hw.el);
    });
  }
  updateProg();
  document.getElementById('finishBtn').style.display='none';
}
function markHW(gi, total){
  var qEl=document.getElementById('q-'+gi);
  if(!qEl || qEl.dataset.hw || qEl.classList.contains('done-ok') || qEl.classList.contains('done-no')) return;
  qEl.dataset.hw='1';
  answered++;
  var w=document.getElementById('why-'+gi); if(w){ w.textContent='解析：'+QUIZ[gi].why; w.classList.add('on'); }
  updateProg();
  if(answered>=total){ document.getElementById('finishBtn').style.display='block'; }
}
function answer(gi,oi){
  var q=QUIZ[gi];
  var qEl=document.getElementById('q-'+gi);
  if(qEl.dataset.hw) return;
  if(qEl.classList.contains('done-ok')||qEl.classList.contains('done-no')) return;
  answered++;
  var ok=(oi===q.ans);
  if(ok) score++;
  q.opts.forEach(function(o,bi){
    var b=document.getElementById('opt-'+gi+'-'+bi);
    b.classList.add('dim');
    if(bi===q.ans) b.classList.add('ok');
    if(bi===oi && !ok) b.classList.add('no');
  });
  qEl.classList.add(ok?'done-ok':'done-no');
  var w=document.getElementById('why-'+gi);
  w.textContent='解析：'+q.why; w.classList.add('on');
  updateProg();
  if(answered>=TOTAL){ document.getElementById('finishBtn').style.display='block'; }
}
function updateProg(){
  var pct=Math.round(answered/TOTAL*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent='已答 '+answered+' / '+TOTAL;
}
function finish(){
  setScreen('scrReport');
  var pct=TOTAL?Math.round(score/TOTAL*100):0;
  var stars=pct>=90?3:pct>=PASS_LINE*100?2:pct>=60?1:0;
  document.getElementById('rStars').textContent=stars>0?'⭐'.repeat(stars):'—';
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rPct').textContent='正确率 '+pct+'%';
  var pass=pct>=PASS_LINE*100;
  document.getElementById('rPass').innerHTML=pass?'<span class="pass">🎊 通关成功！达到 '+PASS_LINE*100+'% 过关线</span>':'<span class="fail">💪 还差一点，再练一遍就通关啦</span>';
  store=getStore();
  if(score>(store.best||0)){ store.best=score; setStore(store); }
  document.getElementById('bestNum').textContent=store.best||0;
  if(pass) celebrate();
}
function resetBest(){ if(confirm('确定清空最佳对题记录？')){ setStore({best:0}); document.getElementById('bestNum').textContent='0'; } }
function celebrate(){
  var emo=['🎉','✨','🔍','🌟','⭐','💡','📚','📕'];
  for(var k=0;k<26;k++){ (function(){ var c=document.createElement('div'); c.className='confetti'; c.textContent=emo[Math.floor(Math.random()*emo.length)]; c.style.left=Math.random()*100+'vw'; c.style.animationDuration=(2+Math.random()*2)+'s'; document.body.appendChild(c); setTimeout(function(){ c.remove(); },4200); })(); }
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

  document.getElementById('dateStr').textContent=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+wk;
})();
