<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.github.com https:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🪢 跳绳运动趋势图</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:17px;color:#3d3a4b;
    background:linear-gradient(135deg,#eafaf1,#fff8ef 55%,#e7f3ff);padding:16px;max-width:820px;margin:0 auto;
    overflow-x:hidden}
  /* 飘动的装饰 emoji */
  .float{position:fixed;font-size:30px;opacity:.18;pointer-events:none;animation:rise linear infinite;z-index:0}
  @keyframes rise{0%{transform:translateY(110vh) rotate(0)}100%{transform:translateY(-20vh) rotate(360deg)}}
  .wrap{position:relative;z-index:1}

  .hero{background:linear-gradient(120deg,#06d6a0,#4cc9f0 60%,#ffd166);
    color:#fff;border-radius:26px;padding:22px 20px;text-align:center;
    box-shadow:0 10px 26px rgba(6,214,160,.35);margin-bottom:16px;position:relative;overflow:hidden}
  .hero h1{font-size:24px;letter-spacing:1px;text-shadow:0 2px 6px rgba(0,0,0,.12)}
  .hero .cheer{font-size:15px;margin-top:8px;opacity:.97;font-weight:600}
  .hero .badge{display:inline-block;background:rgba(255,255,255,.25);border-radius:20px;
    padding:6px 16px;margin-top:12px;font-size:14px;font-weight:700}

  .card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 6px 18px rgba(0,0,0,.06);margin-bottom:16px;position:relative;z-index:1}
  h2{font-size:18px;margin-bottom:12px;display:flex;align-items:center;gap:8px}

  /* 切换 周/月 */
  .toggle{display:flex;background:#eef6f2;border-radius:16px;padding:5px;gap:5px}
  .toggle button{flex:1;border:none;background:transparent;border-radius:12px;min-height:48px;
    font-size:16px;font-weight:800;font-family:inherit;color:#7a8a82;cursor:pointer;transition:.2s}
  .toggle button.on{background:#fff;color:#06d6a0;box-shadow:0 3px 10px rgba(0,0,0,.08)}

  /* 图表 */
  .chartbox{width:100%;overflow:hidden}
  svg{width:100%;height:auto;display:block}
  .line{fill:none;stroke:url(#g1);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.7s cubic-bezier(.4,0,.2,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .area{opacity:0;animation:fade 1s ease .6s forwards}
  @keyframes fade{to{opacity:1}}
  .gridline{stroke:#eef1f3;stroke-width:1}
  .axis{font-size:11px;fill:#aab;font-family:inherit}
  .node{transform:scale(0);transform-box:fill-box;transform-origin:center;
    animation:pop .45s cubic-bezier(.34,1.56,.64,1) forwards}
  @keyframes pop{to{transform:scale(1)}}
  .val{font-size:11px;font-weight:800;fill:#06b389;opacity:0;animation:fade .4s ease forwards}
  .mark{font-size:11px;font-weight:800;opacity:0;animation:fade .4s ease .9s forwards}
  .avgline{stroke:#ff9f1c;stroke-width:2;stroke-dasharray:6 5;opacity:0;animation:fade .6s ease 1s forwards}
  .avgtext{fill:#ff9f1c;font-weight:800;font-size:11px;opacity:0;animation:fade .4s ease 1.2s forwards}
  .pulse{animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{r:7}50%{r:9}}

  /* 小结 */
  .sum{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(min-width:560px){.sum{grid-template-columns:repeat(4,1fr)}}
  .s{background:linear-gradient(135deg,#fff8ef,#eafaf1);border-radius:16px;padding:14px;text-align:center;border:2px solid #eafff6}
  .s .n{font-size:23px;font-weight:800;color:#06d6a0}
  .s .l{font-size:12px;color:#999;margin-top:2px}
  .s.alt .n{color:#ff9f1c}

  .tip{font-size:13px;color:#8a8a8a;line-height:1.7;margin-top:4px}
  .demo{background:#fff3c4;border-radius:14px;padding:10px 12px;font-size:13px;color:#b8860b;
    margin-bottom:14px;display:none}
  .btns{display:flex;gap:10px;margin-top:4px}
  .btn{border:none;border-radius:14px;min-height:50px;padding:0 18px;font-size:16px;font-weight:800;
    font-family:inherit;cursor:pointer;color:#fff;flex:1}
  .btn:active{transform:scale(.97)}
  .g{background:linear-gradient(120deg,#06d6a0,#4cc9f0)}
  .o{background:linear-gradient(120deg,#ff9f1c,#ff8fab)}
  .foot{text-align:center;font-size:12px;color:#bcc;margin:8px 0 4px}
  /* 打破纪录：撒花 + 庆祝弹条 */
  .confetti{position:fixed;top:-30px;font-size:24px;pointer-events:none;z-index:60;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}
  .rectoast{position:fixed;left:50%;top:16%;transform:translate(-50%,-24px);
    background:linear-gradient(120deg,#ff9f1c,#ff8fab);color:#fff;padding:16px 28px;border-radius:20px;
    font-size:19px;font-weight:800;line-height:1.5;box-shadow:0 12px 32px rgba(255,143,171,.5);
    z-index:90;opacity:0;transition:.4s;pointer-events:none;text-align:center;max-width:90vw}
  .rectoast.show{opacity:1;transform:translate(-50%,0)}
  /* 里程碑勋章弹窗（与跳绳打卡同源，主题色由 rope-badges.js 注入 CSS 变量） */
  #badgeOverlay{position:fixed;inset:0;z-index:84;display:none;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 38%,var(--lightA,rgba(255,209,102,.28)),var(--lightB,rgba(10,12,30,.78)));padding:18px}
  #badgeOverlay.show{display:flex;animation:bfade .3s ease}
  @keyframes bfade{from{opacity:0}to{opacity:1}}
  #badgeOverlay .modal{position:relative;overflow:hidden;width:min(86vw,360px);border-radius:28px;
    padding:26px 22px 22px;color:#fff;text-align:center;
    border:2px solid var(--border,rgba(255,209,102,.65));box-shadow:0 0 50px var(--glow,rgba(255,209,102,.45));
    background:var(--modalBg,linear-gradient(160deg,#1f2a4d,#3a1f57 70%,#4a234f))}
  #badgeOverlay .ray{position:absolute;top:42%;left:50%;width:340px;height:340px;margin:-170px 0 0 -170px;
    background:var(--ray,conic-gradient(from 0deg,transparent 0 8deg,rgba(255,209,102,.22) 8deg 12deg,transparent 12deg 30deg));
    animation:bspin 14s linear infinite;z-index:0;pointer-events:none}
  @keyframes bspin{to{transform:rotate(360deg)}}
  #badgeOverlay .content{position:relative;z-index:1}
  #badgeOverlay .ring{width:140px;height:140px;margin:6px auto 0;border-radius:50%;
    background:var(--ring,conic-gradient(from 0deg,#ffd166,#ff9f1c,#ff8fab,#4cc9f0,#06d6a0,#ffd166));
    animation:bspin 4s linear infinite;filter:blur(.4px);
    -webkit-mask:radial-gradient(circle,transparent 50px,#000 52px);mask:radial-gradient(circle,transparent 50px,#000 52px)}
  #badgeOverlay .bigem{font-size:72px;margin-top:-140px;position:relative;z-index:1;
    filter:drop-shadow(0 0 16px var(--border,#ffd166))}
  #badgeOverlay .shine{background:linear-gradient(90deg,#fff 0%,var(--grad1,#fff3b0) 30%,#fff 50%,var(--grad2,#ffb703) 70%,#fff 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;background-size:200% auto;
    animation:bshine 2.4s linear infinite;font-weight:800;font-size:25px;margin:10px 0 4px}
  @keyframes bshine{to{background-position:200% center}}
  #badgeOverlay .glowtxt{text-shadow:0 0 12px var(--glow,rgba(255,209,102,.9));line-height:1.7;font-size:15px;position:relative;z-index:1}
  #badgeOverlay .stars{font-size:20px;font-weight:800;margin:6px 0 2px;position:relative;z-index:1}
  .fab-back{position:fixed;left:14px;bottom:16px;z-index:60;border:0;border-radius:99px;padding:12px 18px;font-size:15px;font-weight:800;background:linear-gradient(135deg,#06d6a0,#4cc9f0);color:#fff;box-shadow:0 8px 20px rgba(6,214,160,.4);cursor:pointer;text-decoration:none;}
</style>
</head>
<body>


<!-- 飘动装饰 -->
<div class="float" style="left:6%;animation-duration:18s">🪢</div>
<div class="float" style="left:28%;animation-duration:24s;animation-delay:3s">⭐</div>
<div class="float" style="left:52%;animation-duration:20s;animation-delay:6s">💪</div>
<div class="float" style="left:74%;animation-duration:26s;animation-delay:2s">🏆</div>
<div class="float" style="left:90%;animation-duration:22s;animation-delay:5s">🔥</div>

<div class="wrap">
  <div class="hero">
    <h1>🪢 我的跳绳成长曲线</h1>
    <div class="cheer" id="cheer">每一下绳子，都在雕刻更棒的自己！</div>
    <div class="badge" id="heroBadge">⭐ 一起跳起来吧</div>
  </div>

  <div class="demo" id="demo">🌟 这是示例数据～ 去「跳绳打卡」里记录几次，这里就会变成你真实的成长曲线啦！</div>

  <div class="card">
    <h2>📊 趋势切换</h2>
    <div class="toggle">
      <button id="weekBtn" class="on">🗓 周视图</button>
      <button id="monthBtn">📅 月视图</button>
    </div>
    <div class="chartbox" id="chartbox" style="margin-top:14px"></div>
  </div>

  <div class="card">
    <h2>🎯 本期小结</h2>
    <div class="sum" id="sum"></div>
    <div class="tip" id="sumTip" style="margin-top:12px"></div>
  </div>

  <div class="card">
    <h2>💡 鼓励一下</h2>
    <div class="tip" id="enc"></div>
    <div class="btns">
      <button class="btn g" id="goCheckin">🪢 去跳绳打卡</button>
      <button class="btn o" id="refreshBtn">🔄 刷新数据</button>
    </div>
  </div>

  <div class="foot">数据来自本机「跳绳打卡」记录 · 离线可用 · 关掉再开自动同步</div>
</div>

<!-- 打破纪录庆祝弹条 -->
<div class="rectoast" id="recordToast"></div>

<!-- 里程碑勋章弹窗（破纪录达 30/50/100 天时弹出，主题色由 rope-badges.js 注入） -->
<div id="badgeOverlay">
  <div class="modal">
    <div class="ray"></div>
    <div class="content">
      <div class="ring"></div>
      <div class="bigem" id="badgeEmoji">💎</div>
      <h3 class="shine" id="badgeTitle">30天金牌跳绳侠</h3>
      <div class="stars" id="badgeStars">+6⭐</div>
      <p class="glowtxt" id="badgeSub">金光闪闪，绳技初成！</p>
      <p class="glowtxt" id="badgeText"></p>
      <button onclick="document.getElementById('badgeOverlay').classList.remove('show')" style="margin-top:14px;border:none;border-radius:14px;min-height:50px;padding:0 28px;font-size:16px;font-weight:800;font-family:inherit;color:#333;background:#fff;cursor:pointer">继续闪耀 ✨</button>
    </div>
  </div>
</div>

<script src="rope-particles.js"></script>
<script src="rope-badges.js"></script>
<script src="accounts.js"></script>
<script>
var APP='ropetrend'; var ME=null;
let mode='week';
let trendState=null;

function todayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function parseKey(k){const p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function weekStart(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
function fmtMD(d){return (d.getMonth()+1)+'/'+d.getDate();}
function fmtM(d){return (d.getMonth()+1)+'月';}

/* 计算当前连续打卡天数（记录存在即视为已完成） */
function currentStreak(records){
  if(!records)return 0;
  const kk=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  let s=0;const d=new Date();
  if(!records[kk(new Date())])d.setDate(d.getDate()-1);
  while(records[kk(d)]){s++;d.setDate(d.getDate()-1);}
  return s;
}
/* 检测是否打破个人纪录（连续天数刷新历史最高） */
function checkRecord(streak){
  if(streak<3)return;
  let best=trendState.best||0;
  if(best===0){trendState.best=streak;Accounts.set(APP, ME, 'state', trendState);return;}
  if(streak>best){
    trendState.best=streak;Accounts.set(APP, ME, 'state', trendState);
    confetti();
    // 选取与当前连续天数匹配的里程碑主题（30金 / 50紫 / 100青蓝）
    let theme=null;
    if(window.RopeBadges){const T=window.RopeBadges.THEMES;
      if(streak>=100)theme=T[100];else if(streak>=50)theme=T[50];else if(streak>=30)theme=T[30];}
    if(theme && window.RopeBadges){
      // 达到里程碑：直接复用里程碑勋章弹窗（含同款主题粒子 + 主题光效/光环）
      showRecordToast(streak,theme);
      window.RopeBadges.show(streak);
    }else{
      // 普通破纪录：顶部弹条 + 默认青绿能量粒子
      showRecordToast(streak,null);
      recordBurst(streak,null);
    }
  }
}
// 破纪录粒子：配色与里程碑主题保持一致（复用 rope-badges 的 THEMES）
function recordBurst(streak,theme){
  if(!window.RopeParticles)return;
  if(theme){
    RopeParticles.burst({
      count:theme.pcount||90, colors:theme.particleColors, emojis:theme.emojis,
      gravity:0.08, spread:theme.pspread||7, upBias:-2.5,
      sizeMin:theme.psize||3, sizeMax:(theme.psize||3)+4,
      duration:theme.pdur||3600, originY:0.2, shape:'mixed', zIndex:95, fade:0.011
    });
  }else{
    // 未达里程碑的破纪录：默认青绿能量主题
    RopeParticles.burst({
      count:80, colors:['#06d6a0','#4cc9f0','#ffd166','#ffffff','#ff8fab'],
      emojis:['🪢','🔥','🎉','⭐'], gravity:0.09, spread:8, upBias:-3,
      sizeMin:3, sizeMax:7, duration:3200, originY:0.2, shape:'mixed', zIndex:95, fade:0.012
    });
  }
}
function showRecordToast(streak,theme){
  const t=document.getElementById('recordToast');
  t.innerHTML='🎉 打破个人纪录！<br>连续打卡 <b>'+streak+'</b> 天 🔥';
  if(theme){
    const c1=theme.particleColors[0], c2=theme.particleColors[1]||c1;
    t.style.background='linear-gradient(120deg,'+c1+','+c2+')';
    if(theme.glow)t.style.boxShadow='0 12px 32px '+theme.glow;
  }else{
    t.style.background='';t.style.boxShadow='';
  }
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}
function confetti(){
  const emo=['🪢','⭐','🎉','💪','🔥','🌟'];
  for(let i=0;i<26;i++){
    const s=document.createElement('div');s.className='confetti';
    s.textContent=emo[Math.floor(Math.random()*emo.length)];
    s.style.left=Math.random()*100+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    s.style.fontSize=(18+Math.random()*18)+'px';
    document.body.appendChild(s);
    setTimeout(()=>s.remove(),3200);
  }
}
/* 上方的 showRecordToast(streak,theme) 已涵盖主题配色，此处旧的同名定义已弃用，避免覆盖 */

/* 读取真实数据 */
function loadRecords(){
  const s=Accounts.get('rope', ME, 'state', null);
  if(s&&s.records&&Object.keys(s.records).length)return s.records;
  return null;
}

/* 生成示例数据（仅当无真实记录时） */
function sampleRecords(){
  const rec={};const today=new Date();
  // 模拟最近 10 周，逐步上升趋势
  for(let w=10;w>=1;w--){
    const ws=new Date(today);ws.setDate(ws.getDate()-w*7);
    const weeksInMonth=4;
    for(let i=0;i<Math.min(4+(10-w),6);i++){
      const d=new Date(ws);d.setDate(d.getDate()+i*2);
      if(d>today)break;
      const base=80+(10-w)*22+Math.round(Math.random()*60);
      rec[todayKey(d)]={count:base,duration:Math.round(base/20),note:''};
    }
  }
  return rec;
}

/* 聚合 */
function buildSeries(records){
  const real = !!records;
  const rec = records || sampleRecords();
  const today=new Date();
  let points=[];
  if(mode==='week'){
    // 最近 12 周，每周合计
    for(let i=11;i>=0;i--){
      const ws=new Date(today);ws.setDate(ws.getDate()-i*7);const start=weekStart(ws);
      const end=new Date(start);end.setDate(end.getDate()+6);
      let sum=0;
      for(const k in rec){const d=parseKey(k);if(d>=start&&d<=end)sum+=(+rec[k].count||0);}
      points.push({label:fmtMD(start),value:sum});
    }
  }else{
    // 最近 12 个月，每月合计
    for(let i=11;i>=0;i--){
      const dt=new Date(today.getFullYear(),today.getMonth()-i,1);
      const y=dt.getFullYear(),m=dt.getMonth();
      const start=new Date(y,m,1),end=new Date(y,m+1,0);
      let sum=0;
      for(const k in rec){const d=parseKey(k);if(d>=start&&d<=end)sum+=(+rec[k].count||0);}
      points.push({label:fmtM(dt),value:sum});
    }
  }
  return {points,real};
}

/* 绘制图表 */
function drawChart(){
  const recs=loadRecords();
  const {points,real}=buildSeries(recs);
  document.getElementById('demo').style.display = real?'none':'block';

  const W=680,H=360, pl=52,pr=18,pt=34,pb=46;
  const x0=pl, x1=W-pr, y0=pt, y1=H-pb;
  const n=points.length;
  const maxV=Math.max(10,...points.map(p=>p.value));
  const ymax=Math.ceil(maxV/50)*50;
  const X=i=> n===1? (x0+x1)/2 : x0+(x1-x0)*i/(n-1);
  const Y=v=> y1-(y1-y0)*v/ymax;

  // 平均值（仅统计有数据的点）
  const dataPts=points.filter(p=>p.value>0);
  const avg=dataPts.length? Math.round(dataPts.reduce((a,p)=>a+p.value,0)/dataPts.length):0;
  // 最高/最低
  let maxP=null,minP=null;
  points.forEach((p,i)=>{if(p.value>0){if(!maxP||p.value>maxP.value)maxP={...p,i};if(!minP||p.value<minP.value)minP={...p,i};}});

  let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="跳绳趋势折线图">';
  svg+='<defs>';
  svg+='<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">';
  svg+='<stop offset="0%" stop-color="#06d6a0"/><stop offset="55%" stop-color="#4cc9f0"/><stop offset="100%" stop-color="#ffd166"/></linearGradient>';
  svg+='<linearGradient id="a1" x1="0" y1="0" x2="0" y2="1">';
  svg+='<stop offset="0%" stop-color="#4cc9f0" stop-opacity=".35"/><stop offset="100%" stop-color="#4cc9f0" stop-opacity="0"/></linearGradient>';
  svg+='</defs>';

  // 横向网格 + y 轴标签
  for(let g=0;g<=4;g++){
    const yy=Y(ymax*g/4);
    svg+='<line class="gridline" x1="'+x0+'" y1="'+yy+'" x2="'+x1+'" y2="'+yy+'"/>';
    svg+='<text class="axis" x="'+(x0-8)+'" y="'+(yy+4)+'" text-anchor="end">'+Math.round(ymax*g/4)+'</text>';
  }

  // 折线 + 区域
  let dPath='',area='';
  points.forEach((p,i)=>{const xx=X(i),yy=Y(p.value);
    dPath+=(i===0?'M':'L')+xx.toFixed(1)+' '+yy.toFixed(1)+' ';});
  area='M'+X(0)+' '+y1+' '+dPath.replace(/^M/,'L')+' L'+X(n-1)+' '+y1+' Z';
  svg+='<path class="area" d="'+area+'" fill="url(#a1)"/>';
  svg+='<path class="line" pathLength="1" d="'+dPath+'"/>';

  // 平均值线
  if(avg>0){
    const ay=Y(avg);
    svg+='<line class="avgline" x1="'+x0+'" y1="'+ay+'" x2="'+x1+'" y2="'+ay+'"/>';
    svg+='<text class="avgtext" x="'+(x1-4)+'" y="'+(ay-6)+'" text-anchor="end">平均 '+avg+' 下</text>';
  }

  // 节点 + 数值
  points.forEach((p,i)=>{const xx=X(i),yy=Y(p.value);
    const delay=(0.5+i*0.12).toFixed(2)+'s';
    const col = (maxP&&i===maxP.i)?'#ff9f1c':(minP&&i===minP.i?'#4cc9f0':'#06d6a0');
    svg+='<circle class="node" cx="'+xx.toFixed(1)+'" cy="'+yy.toFixed(1)+'" r="6" fill="#fff" stroke="'+col+'" stroke-width="3" style="animation-delay:'+delay+'"/>';
    if(p.value>0){
      const ty = yy-14<y0+6? yy+22 : yy-14;
      svg+='<text class="val" x="'+xx.toFixed(1)+'" y="'+ty.toFixed(1)+'" text-anchor="middle" style="animation-delay:'+delay+'">'+p.value+'</text>';
    }
    // x 轴标签（周视图隔一个显示，避免拥挤）
    const show = mode==='month'? true : (i%2===0 || i===n-1);
    if(show) svg+='<text class="axis" x="'+xx.toFixed(1)+'" y="'+(y1+20)+'" text-anchor="middle">'+p.label+'</text>';
  });

  // 最高/最低标注
  if(maxP){
    const xx=X(maxP.i),yy=Y(maxP.value);
    svg+='<text class="mark" x="'+xx.toFixed(1)+'" y="'+(yy-30)+'" text-anchor="middle" fill="#ff9f1c">🏆 最高 '+maxP.value+'</text>';
  }
  if(minP && (!maxP||minP.i!==maxP.i)){
    const xx=X(minP.i),yy=Y(minP.value);
    svg+='<text class="mark" x="'+xx.toFixed(1)+'" y="'+(yy+26)+'" text-anchor="middle" fill="#4cc9f0">💧 最低 '+minP.value+'</text>';
  }
  svg+='</svg>';
  document.getElementById('chartbox').innerHTML=svg;

  renderSummary(points,avg,maxP,minP,real);
  if(real) checkRecord(currentStreak(recs)); // 打破个人纪录时撒花
}

/* 小结卡 */
function renderSummary(points,avg,maxP,minP,real){
  const total=points.reduce((a,p)=>a+p.value,0);
  const best=maxP?maxP.value:0;
  const unit=mode==='week'?'周':'月';
  const box=document.getElementById('sum');
  box.innerHTML=
    '<div class="s"><div class="n">'+total+'</div><div class="l">本期总次数</div></div>'+
    '<div class="s alt"><div class="n">'+best+'</div><div class="l">'+unit+'最高</div></div>'+
    '<div class="s"><div class="n">'+avg+'</div><div class="l">平均/'+unit+'</div></div>'+
    '<div class="s alt"><div class="n">'+points.filter(p=>p.value>0).length+'</div><div class="l">有记录'+unit+'数</div></div>';

  // 小结文案
  let tip='';
  if(!real){tip='当前显示的是示例数据。当你在「跳绳打卡」中累计记录后，上面的数字和曲线会变成你自己的真实成绩 💪';}
  else if(total===0){tip='还没有打卡记录哦，快去跳几分钟，第一根数据点就由你来点亮！🌟';}
  else if(avg>0){
    const rising = points.length>1 && points[points.length-1].value>=points[0].value;
    tip='本期你一共跳了 <b>'+total+'</b> 下，平均每个'+unit+'约 <b>'+avg+'</b> 下，最高的一'+unit+'达到 <b>'+best+'</b> 下！'+
      (rising?' 曲线整体向上，状态越来越棒 🚀':' 保持节奏，下一次就能刷新纪录 💥');
  }
  document.getElementById('sumTip').innerHTML=tip;

  // 鼓励文案
  const enc=[
    '🪢 绳子的声音，是努力在唱歌！',
    '💪 每一次起跳，都在和更好的自己击掌。',
    '🔥 坚持不是一天的事，但每一天都算数！',
    '🌈 累的时候想想：你已经比昨天的自己更强了。',
    '⭐ 小小绳子，大大能量，你是跳绳小超人！',
    '🏆 纪录就是用来被打破的，下一个就是你！'
  ];
  document.getElementById('enc').textContent=enc[Math.floor(Math.random()*enc.length)];

  // hero 文案
  if(real && total>0){
    let pb=trendState.best||0;
    if(!pb){pb=currentStreak(loadRecords());}
    document.getElementById('heroBadge').textContent='⭐ 本期已跳 '+total+' 下 · 个人最佳 '+pb+' 天';
    document.getElementById('cheer').textContent= avg>200?'哇，平均每次都这么猛，跳绳小达人！':'稳步前进，每一下都算数！';
  }else if(!real){
    document.getElementById('heroBadge').textContent='🌟 示例模式 · 快去记录真实成绩';
  }
}

/* 切换 */
document.getElementById('weekBtn').onclick=()=>{mode='week';
  document.getElementById('weekBtn').classList.add('on');document.getElementById('monthBtn').classList.remove('on');drawChart();};
document.getElementById('monthBtn').onclick=()=>{mode='month';
  document.getElementById('monthBtn').classList.add('on');document.getElementById('weekBtn').classList.remove('on');drawChart();};

document.getElementById('refreshBtn').onclick=()=>{drawChart();bounce();};
document.getElementById('goCheckin').onclick=()=>{
  // 优先打开同目录的跳绳打卡页面
  const url='跳绳打卡.html';
  const a=document.createElement('a');a.href=url;a.target='_blank';
  try{a.click();}catch(e){window.open(url);}
};

function bounce(){
  const h=document.querySelector('.hero');h.style.transform='scale(1.02)';
  setTimeout(()=>h.style.transform='',180);
}

/* 多标签页同步：其他页面更新数据时刷新 */
Accounts.gate(APP, { onLogin: function(user){
  ME = user;
  trendState = Accounts.get(APP, ME, 'state', {best:0});
  if(window.RopeBadges && RopeBadges.mountMuteToggle) RopeBadges.mountMuteToggle();
  window.addEventListener('storage', e=>{ if(e.key===Accounts.key('rope', ME, 'state')) drawChart(); });
  drawChart();
  Accounts.mountSwitch(APP);
}});
</script>
