<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.github.com https:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'">

<meta charset="utf-8">
<title>家长陪读 · 亲子共读</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#ffd6a5">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1f2a44; --sub:#7b87a3;
    --line:#e6ecf5; --blue:#4cc9f0; --pink:#ff8fab; --gold:#ffd166;
    --green:#06d6a0; --purple:#b292ff; --radius:18px; --shadow:0 8px 24px rgba(31,42,68,.08);
  }
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#eaf6ff 0%,#fff6ec 60%,#fdeef6 100%);
    color:var(--ink);padding:0 0 40px;
    -webkit-tap-highlight-color:transparent;
  }
  .top{
    position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .top .brand{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
  .top .back{margin-left:auto;border:none;background:linear-gradient(135deg,#6a5ae0,#5b4bd6);color:#fff;border-radius:14px;padding:11px 18px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 12px rgba(91,75,214,.45)}
  .top .back:active{transform:scale(.95)}
  main{max-width:560px;margin:0 auto;padding:22px 16px}
  .hero{text-align:center;margin:10px 0 14px}
  .hero .big{font-size:52px;line-height:1}
  .hero h1{font-size:22px;margin-top:8px}
  .hero p{color:var(--sub);font-size:14px;line-height:1.7;margin-top:8px}
  /* 孩子切换 */
  .child-switch{display:flex;gap:10px;margin:6px 0 4px}
  .child-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    background:#fff;border:3px solid #eee;border-radius:18px;padding:12px 8px;cursor:pointer;
    font-weight:800;font-size:15px;transition:.15s;color:#9a9a9a}
  .child-tab .ava{font-size:26px}
  .child-tab .rl{font-size:12px;color:#bbb;font-weight:700}
  .child-tab.zachary.active{border-color:#ff8c42;color:#3d3a4b;background:#fff6ef;box-shadow:0 6px 16px rgba(255,140,66,.18)}
  .child-tab.zoran.active{border-color:#4cc9f0;color:#3d3a4b;background:#eef9ff;box-shadow:0 6px 16px rgba(76,201,240,.18)}
  .child-tab:active{transform:scale(.98)}
  .sec-title{font-size:15px;font-weight:800;margin:22px 4px 12px;display:flex;align-items:center;gap:6px}
  .grid{display:grid;grid-template-columns:1fr;gap:14px}
  .entry{
    display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--radius);
    padding:18px 16px;box-shadow:var(--shadow);cursor:pointer;border:1px solid var(--line);
    text-decoration:none;color:var(--ink);transition:transform .12s;
  }
  .entry:active{transform:translateY(2px) scale(.99)}
  .entry .e-ico{font-size:42px;line-height:1;width:64px;text-align:center;
    background:#f3f7ff;border-radius:16px;padding:10px 0}
  .entry .e-main{flex:1;min-width:0}
  .entry .e-name{font-size:17px;font-weight:800}
  .entry .e-ds{font-size:13px;color:var(--sub);margin-top:4px;line-height:1.5}
  .entry .e-go{font-size:22px;color:var(--pink);font-weight:800;flex:0 0 auto}
  /* 陪读指引 */
  .tips{margin-top:14px;background:#fff;border-radius:var(--radius);padding:18px 16px;
    box-shadow:var(--shadow);border:1px solid var(--line)}
  .tips h3{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .tips ul{list-style:none;display:flex;flex-direction:column;gap:10px}
  .tips li{font-size:13px;color:var(--ink);line-height:1.6;display:flex;gap:8px;align-items:flex-start}
  .tips li .tk{font-size:16px;line-height:1.2;flex:0 0 auto}
  /* 共读记录 */
  .rec{background:#fff;border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);border:1px solid var(--line)}
  .rec .rh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;margin-bottom:6px}
  .rec .rstreak{font-size:13px;color:var(--sub);margin-bottom:12px}
  .rec .rstreak b{color:var(--orange,#ff9f1c);font-size:16px}
  .rec .dots{display:flex;gap:8px;justify-content:space-between;margin-bottom:14px}
  .rec .dot{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
  .rec .dot .c{width:100%;aspect-ratio:1;border-radius:14px;background:#f1f3f7;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;transition:.2s}
  .rec .dot.on .c{background:linear-gradient(135deg,#4cc9f0,#06d6a0);box-shadow:0 4px 12px rgba(6,214,160,.3)}
  .rec .dot.today .c{outline:3px solid #ffd166;outline-offset:2px}
  .rec .dot .d{font-size:11px;color:var(--sub);font-weight:700}
  .rec .btns{display:flex;gap:10px}
  .rec .btn{border:none;border-radius:14px;padding:13px 16px;font-size:15px;font-weight:800;font-family:inherit;cursor:pointer;flex:1}
  .rec .btn:active{transform:scale(.97)}
  .rec .btn.done{background:#e8fbf1;color:#06a37a;border:2px solid #b8eccf}
  .rec .btn.idle{background:linear-gradient(135deg,#ff9f1c,#ff8fab);color:#fff;box-shadow:0 6px 16px rgba(255,143,171,.35)}
  .rec .btn.ghost{background:#fff;color:#7b87a3;border:2px solid var(--line);flex:0 0 auto}
  /* 亲子互动题 */
  .games{display:flex;flex-direction:column;gap:12px}
  .gcard{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--line);
    padding:16px;cursor:pointer;transition:.15s}
  .gcard:active{transform:scale(.99)}
  .gcard .gq{font-size:15px;font-weight:800;display:flex;gap:8px;align-items:flex-start}
  .gcard .gq .gn{font-size:13px;color:#fff;background:var(--purple);border-radius:8px;padding:2px 8px;font-weight:800;flex:0 0 auto}
  .gcard .ga{font-size:13px;color:#3a6;line-height:1.6;margin-top:10px;background:#f3fbf6;border-radius:12px;padding:10px 12px;display:none}
  .gcard.open .ga{display:block;animation:slideIn .25s}
  @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
  .gmore{text-align:center;margin-top:4px}
  .gmore button{border:none;background:var(--purple);color:#fff;border-radius:14px;padding:11px 20px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 4px 12px rgba(178,146,255,.35)}
  .gmore button:active{transform:scale(.97)}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:28px;line-height:1.7}
  .banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(120deg,#ff9f1c,#ff8fab);color:#fff;padding:14px 22px;border-radius:18px;
    font-size:15px;font-weight:700;box-shadow:0 10px 28px rgba(255,143,171,.5);z-index:95;opacity:0;
    transition:.4s;max-width:92vw;text-align:center;pointer-events:none}
  .banner.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>

/* ===== 工具 ===== */
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return ymd(new Date()); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function readKey(uid){ return 'parent_read_'+uid; }
function getReads(uid){ try{ return JSON.parse(localStorage.getItem(readKey(uid)))||[]; }catch(e){ return []; } }
function setReads(uid,arr){ localStorage.setItem(readKey(uid), JSON.stringify(arr)); }
function showBanner(t){ var b=document.getElementById('banner'); b.textContent=t; b.classList.add('show'); clearTimeout(b._t); b._t=setTimeout(function(){ b.classList.remove('show'); },3800); }

/* ===== 共读记录 ===== */
function toggleRead(){
  var uid=CUR, t=todayStr(), arr=getReads(uid);
  var i=arr.indexOf(t);
  if(i>=0){ arr.splice(i,1); showBanner('已取消今天陪读记录（积分同步回退）'); }
  else { arr.push(t); arr.sort(); showBanner('📖 今天陪读打卡完成！+3 积分 💝'); }
  setReads(uid,arr); renderRead();
}
function clearRead(){
  if(!confirm('确定清空 '+PROFILE[CUR].name+' 的全部共读记录？')) return;
  localStorage.removeItem(readKey(CUR)); renderRead();
}
function computeStreak(arr){
  var set={}; arr.forEach(function(d){ set[d]=1; });
  var cur=new Date(); cur.setHours(0,0,0,0);
  if(!set[ymd(cur)]) cur.setDate(cur.getDate()-1); // 今天没打则从昨天起算
  var n=0;
  for(var g=0; g<2000; g++){
    if(set[ymd(cur)]){ n++; cur.setDate(cur.getDate()-1); } else break;
  }
  return n;
}
function renderRead(){
  var p=PROFILE[CUR], arr=getReads(CUR), set={};
  arr.forEach(function(d){ set[d]=1; });
  var streak=computeStreak(arr);
  document.getElementById('recStreak').innerHTML='已累计共读 <b>'+arr.length+'</b> 天 · 当前连续 <b>'+streak+'</b> 天 🔥';
  // 最近 7 天
  var today=new Date(); today.setHours(0,0,0,0);
  var wd=['日','一','二','三','四','五','六'], dots='';
  for(var i=6;i>=0;i--){
    var d=new Date(today); d.setDate(d.getDate()-i);
    var k=ymd(d), on=!!set[k], isToday=(i===0);
    dots+='<div class="dot'+(on?' on':'')+(isToday?' today':'')+'">'+
      '<div class="c">'+(on?'✓':'')+'</div>'+
      '<div class="d">'+(isToday?'今天':wd[d.getDay()])+'</div></div>';
  }
  document.getElementById('recDots').innerHTML=dots;
  var btn=document.getElementById('recBtn');
  if(set[todayStr()]){ btn.className='btn done'; btn.textContent='✓ 今天已打卡（点此取消）'; }
  else { btn.className='btn idle'; btn.textContent='📖 今天陪读打卡'; }
}

/* ===== 亲子互动题（轮换） ===== */
var GAME_OFF=0;
function renderGames(){
  var list=PROFILE[CUR].games, n=list.length;
  var html='';
  for(var i=0;i<3;i++){
    var idx=(GAME_OFF+i)%n;
    var g=list[idx];
    html+='<div class="gcard" id="gc-'+idx+'" onclick="flipGame('+idx+')">'+
      '<div class="gq"><span class="gn">Q'+(i+1)+'</span><span>'+esc(g.q)+'</span></div>'+
      '<div class="ga">💡 陪玩建议：'+esc(g.a)+'</div></div>';
  }
  document.getElementById('games').innerHTML=html;
}
function flipGame(idx){
  var el=document.getElementById('gc-'+idx); if(el) el.classList.toggle('open');
}
function rotateGames(){ GAME_OFF=(GAME_OFF+3)%PROFILE[CUR].games.length; renderGames(); }

/* ===== 孩子切换 ===== */
function renderSwitch(){
  document.getElementById('childSwitch').innerHTML=KIDS.map(function(u){
    var on=(u.id===CUR);
    return '<div class="child-tab '+u.id+(on?' active':'')+'" onclick="setChild(\''+u.id+'\')">'+
      '<span class="ava">'+u.emoji+'</span><span>'+u.name+'</span><span class="rl">'+u.role+'</span></div>';
  }).join('');
}
function setChild(id){
  if(!PROFILE[id]) return; CUR=id;
  renderSwitch(); renderAll();
  window.scrollTo({top:0,behavior:'smooth'});
}
function renderAll(){
  var p=PROFILE[CUR];
  document.getElementById('hero').innerHTML='<div class="big">'+p.emoji+'👨‍👩‍👧</div>'+
    '<h1>'+esc(p.hero)+'</h1><p>'+p.sub+'</p>';
  document.getElementById('apps').innerHTML=p.apps.map(function(a){
    return '<a class="entry" href="'+a.url+'">'+
      '<div class="e-ico">'+a.e+'</div>'+
      '<div class="e-main"><div class="e-name">'+esc(a.n)+'</div><div class="e-ds">'+esc(a.d)+'</div></div>'+
      '<div class="e-go">➡️</div></a>';
  }).join('');
  document.getElementById('tips').innerHTML='<h3>🤱 陪读小建议 · '+esc(p.stage)+'</h3><ul>'+
    p.tips.map(function(t){ return '<li><span class="tk">'+t[0]+'</span><span>'+esc(t[1])+'</span></li>'; }).join('')+'</ul>';
  document.getElementById('foot').innerHTML='家长陪读 · 数据按孩子独立存储（'+esc(p.name)+'）'+
    '<br>哥哥 Zachary / 弟弟 Zoran 切换查看，互不影响';
  renderRead(); renderGames();
}

/* 启动 */
renderSwitch();
renderAll();
</script>
