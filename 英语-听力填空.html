<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#eef5ff,#e9fbf6);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);
    border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  header{background:linear-gradient(120deg,var(--blue),var(--cyan));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(72,149,239,.35)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:24px;font-weight:800;color:var(--blue)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}

  .card{background:#fff;border-radius:22px;box-shadow:0 6px 16px rgba(0,0,0,.07);padding:20px}
  .qhead{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:#888;margin-bottom:8px}
  .qhead .badge{background:var(--blue);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
  .sentence{font-size:21px;font-weight:800;line-height:1.7;text-align:center;margin:10px 0 4px;
    color:var(--ink);min-height:64px}
  .sentence .blank{display:inline-block;min-width:70px;border-bottom:3px dotted var(--cyan);
    color:var(--blue);margin:0 4px}
  .cn{font-size:14px;color:#888;text-align:center;margin-bottom:10px}
  .audio-row{display:flex;justify-content:center;gap:10px;margin:8px 0 16px}
  .audio-row button{border:none;border-radius:14px;padding:11px 18px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:inherit;color:#fff;background:var(--cyan)}
  .audio-row .again{background:#dfe7f5;color:var(--blue)}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .opt{border:2px solid #eef2f9;border-radius:16px;padding:14px;font-size:17px;font-weight:800;
    text-align:center;cursor:pointer;font-family:inherit;background:#fff;transition:.15s}
  .opt:active{transform:scale(.97)}
  .opt.right{background:#e7fbf0;border-color:var(--green);color:#0a8a5f}
  .opt.wrong{background:#fff0f3;border-color:var(--pink);color:#c8154f}
  .opt:disabled{cursor:default}
  .explain{margin-top:14px;font-size:14px;line-height:1.6;color:#555;background:#f3f8ff;
    border-radius:12px;padding:10px 12px;display:none}
  .explain.show{display:block}
  .explain b{color:var(--blue)}

  .progress{height:14px;background:#e3ecfb;border-radius:10px;overflow:hidden;margin:16px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--cyan));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}

  .result{background:#fff;border-radius:22px;box-shadow:0 6px 16px rgba(0,0,0,.07);padding:24px;text-align:center;display:none}
  .result.show{display:block}
  .result .stars{font-size:34px;letter-spacing:4px;margin:6px 0}
  .result h3{font-size:22px;margin-bottom:6px}
  .result p{color:#777;font-size:14px;line-height:1.6}
  .result .score{font-size:30px;font-weight:800;color:var(--blue);margin:8px 0}
  .result .again{margin-top:16px;border:none;background:var(--blue);color:#fff;
    padding:12px 28px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}

  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:16px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--blue);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}

  .grades{display:flex;gap:7px;overflow-x:auto;margin:12px 2px 2px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .grades button{border:2px solid #e3ecfb;background:#fff;color:#666;border-radius:999px;
    padding:8px 15px;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;white-space:nowrap;transition:.15s}
  .grades button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
</style>
</head>

<header>
  <h1>🎧 英语听力填空</h1>
  <div class="date" id="dateStr">今天</div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="idxNum">1</div><div class="lbl">📝 当前题号</div></div>
  <div class="stat"><div class="num" id="okNum">0</div><div class="lbl">✅ 答对</div></div>
  <div class="stat"><div class="num" id="pctNum">0%</div><div class="lbl">📈 正确率</div></div>
</div>

<div class="grades" id="grades"></div>

<div class="card" id="quizBox">
  <div class="qhead"><span class="badge" id="qBadge">第 1 题</span><span id="qCat">听力</span></div>
  <div class="sentence" id="sentence"></div>
  <div class="cn" id="cnTip"></div>
  <div style="display:flex;justify-content:center;margin:4px 0 12px"><button onclick="toggleGloss('lfGloss')" style="border:none;border-radius:14px;padding:9px 16px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:#fff;background:#ff7a59">🔤 逐字翻译</button></div>
  <div class="pgloss" id="lfGloss" style="margin:0 0 6px"></div>
  <div class="audio-row">
    <button onclick="play()">🔊 播放句子</button>
    <button class="again" onclick="play()">🔁 再听一次</button>
    <button class="again" onclick="playSlow()">🐢 慢速听</button>
  </div>
  <div class="opts" id="opts"></div>
  <div id="hwSlot"></div>
  <div style="display:flex;justify-content:center;margin:8px 0"><button onclick="submitCloze()" style="border:none;border-radius:14px;padding:10px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#fff;background:#3a7bd5">➡️ 下一题（对照答案）</button></div>
  <div class="explain" id="explain"></div>
</div>

<div class="progress"><i id="progBar"></i></div>
<div class="prog-txt" id="progTxt">完成 0 / 0 题</div>

<div class="result" id="result">
  <h3 id="rTitle">闯关结束</h3>
  <div class="stars" id="rStars">⭐⭐⭐</div>
  <div class="score" id="rScore">0 / 0</div>
  <p id="rMsg"></p>
  <button class="again" onclick="startQuiz()">🔄 再来一轮</button>
</div>

<div class="tip">先听完整句子（空里的单词会读出来），再从选项里选出或用手写写出<b>你听到的那个单词</b>。听不清点「🐢 慢速听」。做对 80% 算通关🌟<br>数据按小朋友分别保存，不会上传。</div>

<div class="celebrate" id="celeb">
  <div class="box2">
    <h3>🎉 小耳朵真灵！</h3>
    <p>全部题目都认真听完啦，听力越来越棒！</p>
    <button onclick="closeCeleb()">继续练习 💪</button>
  </div>
</div>

var QUESTIONS = ALLQ; // 当前筛选后的列表

var CHILD='user', KEY='', idx=0, ok=0, locked=false, curGrade='all';
function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

function speakSentence(text, rate){
  /* 统一走 speech.js：优选最标准英文音色（Google/Natural/Apple），杜绝机械音 */
  if(window.Speech && Speech.speak){ Speech.speak(text, rate||0.85); return; }
  try{
    var u=new SpeechSynthesisUtterance(text);
    u.lang='en-US'; u.rate=rate||0.85; u.pitch=1;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
/* 朗读完整句子（空格处读出正确单词）——听到的单词一定在选项里 */
function play(){ speakSentence(QUESTIONS[idx].s.replace('___', QUESTIONS[idx].ans)); }
function playSlow(){ speakSentence(QUESTIONS[idx].s.replace('___', QUESTIONS[idx].ans), 0.6); }

/* 逐字翻译：读取容器 data-en 懒构建词对词翻译，点击切换显隐 */
function toggleGloss(id){
  var el=document.getElementById(id); if(!el || !window.Gloss) return;
  if(el.getAttribute('data-filled')!=='1'){
    el.innerHTML=Gloss.buildPGlossHTML(el.getAttribute('data-en')||'');
    el.setAttribute('data-filled','1');
  }
  el.classList.toggle('on');
}

function renderQuestion(){
  var q=QUESTIONS[idx];
  document.getElementById('idxNum').textContent=idx+1;
  document.getElementById('qBadge').textContent='第 '+(idx+1)+' 题';
  document.getElementById('qCat').textContent=q.cat;
  document.getElementById('sentence').innerHTML=q.s.replace('___','<span class="blank">＿＿</span>');
  document.getElementById('cnTip').textContent=q.cn;
  var lg=document.getElementById('lfGloss'); if(lg){ lg.setAttribute('data-en', q.s); lg.removeAttribute('data-filled'); lg.classList.remove('on'); }
  locked=false;
  var html='';
  q.opt.forEach(function(o,i){
    html+='<div class="opt" id="opt-'+i+'" onclick="choose('+i+')">'+o+'</div>';
  });
  document.getElementById('opts').innerHTML=html;
  // 手写区：每题重建一块手写板，写完点「对照答案」看正确单词
  var _slot=document.getElementById('hwSlot');
  if(_slot && window.Handwrite){
    _slot.innerHTML='';
    var _hw=Handwrite.create({revealText:q.ans, placeholder:'✍️ 用手写写出空里的单词'});
    _slot.appendChild(_hw.el);
  }
  document.getElementById('explain').className='explain';
  var done=idx, total=QUESTIONS.length;
  document.getElementById('progBar').style.width=Math.round(done/total*100)+'%';
  document.getElementById('progTxt').textContent='完成 '+done+' / '+total+' 题';
  if(window.Resume) Resume.set('english-listen', CHILD, 'idx_'+curGrade, idx);
  setTimeout(play,250);
}

function choose(i){
  if(locked) return;
  locked=true;
  var q=QUESTIONS[idx];
  var chosen=document.getElementById('opt-'+i);
  var correctIdx=q.opt.indexOf(q.ans);
  document.getElementById('opt-'+correctIdx).classList.add('right');
  if(i===correctIdx){ ok++; }
  else { chosen.classList.add('wrong'); }
  document.getElementById('okNum').textContent=ok;
  var total=QUESTIONS.length, pct=total?Math.round(ok/total*100):0;
  // 正确率按已做累计
  var doneNow=idx+1;
  document.getElementById('pctNum').textContent=Math.round(ok/doneNow*100)+'%';
  // 禁用所有选项
  q.opt.forEach(function(o,k){ document.getElementById('opt-'+k).setAttribute('disabled',''); });
  var ex=document.getElementById('explain');
  ex.innerHTML='<b>'+q.ans+'</b> —— '+q.s.replace('___','<u>'+q.ans+'</u>')+'　（'+q.cn+'）';
  ex.className='explain show';
  setTimeout(next,1100);
}

function next(){
  idx++;
  if(idx>=QUESTIONS.length){ finish(); }
  else { renderQuestion(); }
}

/* 手写模式：只写不点选项时，也能对照答案并翻到下一题 */
function submitCloze(){
  if(locked) return; locked=true;
  var q=QUESTIONS[idx];
  var ex=document.getElementById('explain');
  ex.innerHTML='<b>'+q.ans+'</b> —— '+q.s.replace('___','<u>'+q.ans+'</u>')+'　（'+q.cn+'）';
  ex.className='explain show';
  q.opt.forEach(function(o,k){ var b=document.getElementById('opt-'+k); if(b) b.setAttribute('disabled',''); });
  setTimeout(next,1100);
}

function finish(){
  document.getElementById('quizBox').style.display='none';
  var total=QUESTIONS.length, pct=total?Math.round(ok/total*100):0;
  document.getElementById('progBar').style.width='100%';
  document.getElementById('progTxt').textContent='完成 '+total+' / '+total+' 题';
  document.getElementById('rScore').textContent=ok+' / '+total;
  var stars = pct>=90?'⭐⭐⭐' : pct>=80?'⭐⭐' : pct>=60?'⭐' : '🌱';
  document.getElementById('rStars').textContent=stars;
  document.getElementById('rTitle').textContent= pct>=80?'🏆 通关啦！':'再练练～';
  document.getElementById('rMsg').textContent='正确率 '+pct+'%'+(pct>=80?'，听力小能手！':'，多听几遍就会更好～');
  document.getElementById('result').className='result show';
  if(pct>=80){ celebrate(); }
}

function startQuiz(){
  // 断点续学：续到本次年级上次做到的第几题
  var _sv = (window.Resume ? (Resume.get('english-listen', CHILD, 'idx_'+curGrade) || 0) : 0);
  if(_sv >= QUESTIONS.length) _sv = 0;
  idx=_sv; ok=0; locked=false;
  document.getElementById('okNum').textContent=0;
  document.getElementById('pctNum').textContent='0%';
  document.getElementById('result').className='result';
  document.getElementById('quizBox').style.display='block';
  renderQuestion();
}

function celebrate(){
  var emo=['🎉','✨','🌟','⭐','🎧','💡','🌈','🍎'];
  for(var k=0;k<26;k++){
    (function(){
      var c=document.createElement('div'); c.className='confetti';
      c.textContent=emo[Math.floor(Math.random()*emo.length)];
      c.style.left=Math.random()*100+'vw';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ c.remove(); },4200);
    })();
  }
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

function renderGrades(){
  var labels=[['all','全部'],['1','一年级'],['2','二年级'],['3','三年级'],['4','四年级'],['5','五年级'],['6','六年级']];
  var html='';
  labels.forEach(function(l){
    html+='<button class="'+(curGrade===l[0]?'on':'')+'" onclick="setGradeFilter(\''+l[0]+'\')">'+l[1]+'</button>';
  });
  document.getElementById('grades').innerHTML=html;
}
function setGradeFilter(g){
  curGrade=g;
  QUESTIONS = (g==='all') ? ALLQ : ALLQ.filter(function(q){ return q.g===parseInt(g,10); });
  renderGrades();
  startQuiz();
}

(function(){
  var s=Portal.getSession();
  CHILD=(s&&s.child)?s.child:'user';
  KEY='english-listen-'+CHILD;
  var d=new Date();
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('dateStr').textContent=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+wk;
  renderGrades();
  startQuiz();
})();
