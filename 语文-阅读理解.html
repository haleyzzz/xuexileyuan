function speak(t){ try{ if(!('speechSynthesis'in window))return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.9; window.speechSynthesis.speak(u); }catch(e){} }
function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function setScreen(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');}); document.getElementById(id).classList.add('on'); }
var score=0, answered=0, list=[];
function renderChips(){
  var h=''; GRADES.forEach(function(t){ h+='<button class="chip'+(t[1]===curGrade?' on':'')+'" onclick="pickGrade(\''+t[1]+'\')">'+t[0]+'</button>'; });
  document.getElementById('gradeChips').innerHTML=h;
}
function pickGrade(g){ curGrade=g; renderChips(); }
function start(){
  score=0; answered=0;
  var ps = curGrade? PASSAGES.filter(function(p){return p.g===curGrade;}):PASSAGES.slice();
  list=[]; ps.forEach(function(p){ p.qa.forEach(function(q){ list.push({p:p, q:q}); }); });
  setScreen('scrQuiz'); renderQuiz();
}
function renderQuiz(){
  var html2='';
  PASSAGES.forEach(function(p){
    if(curGrade && p.g!==curGrade) return;
    html2+='<div class="passage"><div class="ph"><span class="pt">'+p.emoji+' '+p.title+'</span><span class="pg">'+p.g+'年级</span></div>';
    html2+='<div class="ptxt" id="txt'+p.id+'">'+p.text+'</div><button class="spk" onclick="speak(document.getElementById(\'txt'+p.id+'\').innerText)" style="margin:8px 0">🔊 朗读短文</button>';
    p.qa.forEach(function(q){
      var gidx = list.findIndex(function(l){return l.p.id===p.id && l.q===q;});
      html2+='<div class="q" id="q'+gidx+'"><div class="qt"><span class="qn">Q</span>'+q.q+'</div><div class="opts">';
      q.opts.forEach(function(op,oi){ html2+='<button class="opt" onclick="choose('+gidx+','+oi+')" id="o'+gidx+'_'+oi+'">'+op+'</button>'; });
      html2+='</div><div class="why" id="w'+gidx+'"></div><div id="hw'+gidx+'" class="hw-slot"></div></div>';
    });
    html2+='</div>';
  });
  document.getElementById('quizArea').innerHTML=html2;
  document.getElementById('finishBtn').style.display='none';
  updateProg();
  if(window.Handwrite){
    list.forEach(function(entry, idx){
      var it=entry.q;
      var hw=Handwrite.create({revealText: it.opts[it.ans], placeholder:'✍️ 在这里用手写答案'});
      document.getElementById('hw'+idx).appendChild(hw.el);
      var rb=hw.el.querySelector('.hw-tools .hw-btn:last-child');
      if(rb) rb.addEventListener('click', function(){ markHW(it, idx, list.length); });
    });
  }
}
function choose(idx,oi){
  var it=list[idx]; var q=document.getElementById('q'+idx);
  if(q.classList.contains('done-ok')||q.classList.contains('done-no')) return;
  answered++;
  var ok=(oi===it.q.ans);
  var opts=q.querySelectorAll('.opt');
  opts.forEach(function(b,i){ b.classList.add('dim'); if(i===it.q.ans) b.classList.add('ok'); });
  if(ok){ q.classList.add('done-ok'); score++; } else { q.classList.add('done-no'); opts[oi].classList.add('no'); }
  var w=document.getElementById('w'+idx); w.textContent='💡 '+it.q.why; w.classList.add('on');
  updateProg();
  if(answered>=list.length) document.getElementById('finishBtn').style.display='block';
}
function markHW(it, idx, total){
  var q=document.getElementById('q'+idx);
  if(q.classList.contains('done-ok')||q.classList.contains('done-no')||q.classList.contains('done-hw')) return;
  answered++;
  q.classList.add('done-hw');
  var w=document.getElementById('w'+idx);
  if(w){ w.innerHTML='💡 '+it.why; w.classList.add('on'); }
  updateProg();
  if(answered>=total) document.getElementById('finishBtn').style.display='block';
}
function updateProg(){
  document.getElementById('progBar').style.width=(answered/list.length*100)+'%';
  document.getElementById('progTxt').textContent='已答 '+answered+' / '+list.length;
}
function finish(){
  var pct=Math.round(score/list.length*100);
  document.getElementById('rScore').textContent=score+' / '+list.length;
  document.getElementById('rPct').textContent='正确率 '+pct+'%';
  var stars = pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('rStars').textContent=stars;
  var pass = score/list.length>=0.8;
  document.getElementById('rPass').innerHTML = pass?'<span class="pass">🎊 通关！阅读小能手</span>':'<span class="fail">再读读，争取通关 80%</span>';
  if(score>(store.best||0)){ store.best=score; setStore(store); }
  if(pass) showCeleb();
  setScreen('scrReport');
}
function resetBest(){ if(confirm('确定清空最佳对题记录？')){ setStore({best:0}); store={best:0}; document.getElementById('bestNum').textContent='0'; } }
function goMenu(){ setScreen('scrMenu'); }
function showCeleb(){ var c=document.getElementById('celeb'); c.style.display='flex'; }
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }
(function init(){
  var s=Portal.getSession(); CHILD=(s&&s.child)?s.child:'user'; KEY='cnread-'+CHILD; store=getStore();
  document.getElementById('dateStr').textContent=new Date().toLocaleDateString('zh-CN');
  var n=0; PASSAGES.forEach(function(p){ n+=p.qa.length; });
  document.getElementById('totalNum').textContent=n;
  document.getElementById('bestNum').textContent=store.best||0;
  renderChips();
})();
</script>
