<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#fff8ef,#fdeff4);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  header{background:linear-gradient(120deg,var(--pink),var(--orange));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(255,143,171,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--orange)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}

  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}

  /* 模式条 */
  .mode{display:flex;gap:8px;margin:6px 0 4px}
  .mode button{flex:1;border:2px solid #ffd1dc;background:#fff;color:var(--ink);
    border-radius:14px;padding:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .mode button.on{background:linear-gradient(120deg,var(--pink),var(--orange));color:#fff;border-color:transparent}

  /* 主卡 */
  .card{background:#fff;border-radius:24px;padding:22px 18px;text-align:center;
    box-shadow:0 8px 22px rgba(255,143,171,.25);margin:6px 0;min-height:300px;
    display:flex;flex-direction:column;justify-content:center;align-items:center}
  .big{font-size:96px;font-weight:800;line-height:1.1;color:var(--ink);user-select:none;transition:.2s}
  .big.hide{color:#f0d7df;filter:blur(6px)}
  .hint{font-size:14px;color:#aaa;margin:10px 0 4px}
  .py{font-size:26px;font-weight:800;color:var(--purple);margin:6px 0;letter-spacing:1px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:8px 0}
  .tag{background:#fef0f5;border-radius:12px;padding:6px 12px;font-size:13px;color:#c25573}
  .tag b{color:var(--orange)}
  .mean{font-size:14px;color:#777;margin-top:6px;line-height:1.6;max-width:380px}

  /* 控制 */
  .ctrls{display:flex;gap:10px;margin-top:14px}
  .ctrls button{flex:1;border:none;border-radius:16px;padding:14px;font-size:15px;
    font-family:inherit;cursor:pointer;color:#fff;font-weight:800;transition:transform .12s}
  .ctrls button:active{transform:scale(.96)}
  .c-speak{background:var(--purple)}
  .c-flip{background:var(--pink)}
  .c-next{background:var(--orange)}
  .c-know{background:var(--green)}

  .progress{height:14px;background:#ffe3ec;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--pink));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}

  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--orange);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);
    border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}

<script>
/* iOS 朗读稳定性补丁：保留 utterance 全局引用防 GC 静音 + 朗读前 resume()（与 speech.js 同逻辑，本页未引 speech.js 故内联） */
(function(){ if(window.__ttsPatched) return; window.__ttsPatched=true;
  if(!window.speechSynthesis) return;
  var _sp=window.speechSynthesis.speak.bind(window.speechSynthesis);
  window.speechSynthesis.speak=function(u){ try{window.speechSynthesis.resume();}catch(e){} window.__ttsUtt=u; return _sp(u); };
})();
</script>

<header>
  <h1>✍️ 语文字词听写</h1>
  <div class="date" id="dateStr">今天</div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="idxNum">1</div><div class="lbl">📍 第几个</div></div>
  <div class="stat"><div class="num" id="totalNum">0</div><div class="lbl">📚 总字数</div></div>
  <div class="stat"><div class="num" id="knowNum">0</div><div class="lbl">✅ 已会</div></div>
</div>

<h2>🎧 听写方式</h2>
<div class="mode">
  <button id="mListen" class="on" onclick="setMode('listen')">报听写（先听后写）</button>
  <button id="mCard" onclick="setMode('card')">认字卡（直接看）</button>
</div>

<div class="card">
  <div class="big" id="big">字</div>
  <div class="hint" id="hint">点「朗读」听报字，写完再点「看答案」核对 ✍️</div>
  <div class="py" id="py" hidden></div>
  <div class="meta" id="meta" hidden></div>
  <div class="mean" id="mean" hidden></div>
</div>

<div id="hwSlot"></div>

<div class="ctrls">
  <button class="c-speak" onclick="speakWord()">🔊 朗读</button>
  <button class="c-flip" onclick="flip()">👀 看答案</button>
  <button class="c-know" onclick="markKnow()">✅ 已会</button>
  <button class="c-next" onclick="next()">➡️ 下一个</button>
</div>

<div class="progress"><i id="progBar"></i></div>
<div class="prog-txt" id="progTxt">进度 0%</div>

<div class="tip">点「朗读」会读出这个字，先在本子上写一写，再点「看答案」核对拼音、部首和组词。<br>数据按小朋友分别保存，不会上传。</div>

<div class="celebrate" id="celeb">
  <div class="box2">
    <h3>🎉 这一轮完成啦！</h3>
    <p id="celebMsg">你已会了不少字，真棒！</p>
    <button onclick="closeCeleb()">继续加油 💪</button>
  </div>
</div>

  {"zi":"恐","py":"kǒng","bs":"心","bh":10,"zc":"恐怕·惊恐","sy":"害怕；也许"}
];

/* ============ 状态 ============ */
var idx = 0;            // 当前字索引
var mode = 'listen';    // listen / card
var known = loadKnown();// 已会集合 {zi:true}

/* ============ 断点续学（记住学到第几个字）============ */
function loadIdx(){
  try{ var v=parseInt(localStorage.getItem(KEY+'_idx'),10); if(!isNaN(v)&&v>=0&&v<WORDS.length) idx=v; }catch(e){}
}
function saveIdx(){ try{ localStorage.setItem(KEY+'_idx', String(idx)); }catch(e){} }
function resetIdx(){ idx=0; saveIdx(); render(); var t=document.getElementById('resumeTip'); if(t) t.remove(); }
function mountResumeBanner(){
  if(idx<=0) return;
  var h=document.querySelector('header'); if(!h) return;
  var tip=document.createElement('div'); tip.id='resumeTip';
  tip.style.cssText='margin:10px 16px 0;background:#eef9ff;border:1px solid #b9e3ff;color:#247;font-size:13px;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px';
  tip.innerHTML='📍 上次学到第 '+(idx+1)+' 个字（共 '+WORDS.length+'）';
  var btn=document.createElement('button'); btn.type='button'; btn.textContent='↺ 从第1个开始';
  btn.style.cssText='border:none;background:#4cc9f0;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:700';
  btn.onclick=resetIdx;
  tip.appendChild(btn);
  h.insertAdjacentElement('afterend', tip);
}

/* ============ 朗读（中文 TTS）============ */
function speakWord(){
  var w = WORDS[idx];
  try{
    var u = new SpeechSynthesisUtterance(w.zi);
    u.lang = 'zh-CN'; u.rate = 0.9; u.pitch = 1;
    var voices = window.speechSynthesis.getVoices();
    var zh = voices.filter(function(v){ return /zh|Chinese/i.test(v.lang); })[0];
    if (zh) u.voice = zh;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}

/* ============ 渲染 ============ */
function render(){
  var w = WORDS[idx];
  document.getElementById('idxNum').textContent = idx + 1;
  document.getElementById('totalNum').textContent = WORDS.length;
  document.getElementById('knowNum').textContent = Object.keys(known).length;
  document.getElementById('big').textContent = w.zi;
  // 听写模式：默认遮住答案；认字卡模式：直接显示
  var showAns = (mode === 'card');
  document.getElementById('big').classList.toggle('hide', !showAns && mode==='listen' ? false : false);
  document.getElementById('py').hidden = !showAns;
  document.getElementById('meta').hidden = !showAns;
  document.getElementById('mean').hidden = !showAns;
  if (showAns){
    document.getElementById('py').textContent = w.py;
    document.getElementById('meta').innerHTML =
      '<span class="tag">部首 <b>'+w.bs+'</b></span>' +
      '<span class="tag">笔画 <b>'+w.bh+'</b></span>' +
      '<span class="tag">组词 <b>'+w.zc+'</b></span>';
    document.getElementById('mean').textContent = '释义：' + w.sy;
  }
  document.getElementById('hint').textContent = (mode==='card')
    ? '这是认字卡，点「朗读」听读音，点「看答案」再核对'
    : '点「朗读」听报字，写完再点「看答案」核对 ✍️';
  // 进度
  var pct = Math.round((idx) / WORDS.length * 100);
  document.getElementById('progBar').style.width = (pct) + '%';
  document.getElementById('progTxt').textContent = '进度 ' + pct + '%';
  renderHW();
}

/* ============ 手写（Apple Pencil / 手指）============ */
var curHW=null;
function renderHW(){
  var slot=document.getElementById('hwSlot'); if(!slot) return;
  slot.innerHTML='';
  if(!window.Handwrite) return;
  var w=WORDS[idx];
  curHW=Handwrite.create({revealText: w.zi, placeholder:'✍️ 用手写「'+w.zi+'」　('+(w.py||'')+')'});
  slot.appendChild(curHW.el);
}

/* ============ 交互 ============ */
function setMode(m){
  mode = m;
  document.getElementById('mListen').classList.toggle('on', m==='listen');
  document.getElementById('mCard').classList.toggle('on', m==='card');
  render();
}
function flip(){
  var w = WORDS[idx];
  if(curHW) curHW.reveal();
  document.getElementById('py').hidden = false;
  document.getElementById('meta').hidden = false;
  document.getElementById('mean').hidden = false;
  document.getElementById('py').textContent = w.py;
  document.getElementById('meta').innerHTML =
    '<span class="tag">部首 <b>'+w.bs+'</b></span>' +
    '<span class="tag">笔画 <b>'+w.bh+'</b></span>' +
    '<span class="tag">组词 <b>'+w.zc+'</b></span>';
  document.getElementById('mean').textContent = '释义：' + w.sy;
}
function markKnow(){
  var w = WORDS[idx];
  known[w.zi] = true;
  saveKnown();
  document.getElementById('knowNum').textContent = Object.keys(known).length;
  confettiBurst();
  next();
}
function next(){
  if (idx >= WORDS.length - 1){
    // 一轮结束
    document.getElementById('big').textContent = '🎉';
    document.getElementById('py').hidden = true;
    document.getElementById('meta').hidden = true;
    document.getElementById('mean').hidden = true;
    document.getElementById('hint').textContent = '这一轮全部过完啦！点「下一个」可重新开始';
    document.getElementById('progBar').style.width = '100%';
    document.getElementById('progTxt').textContent = '进度 100%';
    showCeleb();
    idx = 0; // 复位，方便再来一轮
    saveIdx();
    return;
  }
  idx++;
  saveIdx();
  render();
}

/* ============ 庆祝 ============ */
function confettiBurst(){
  var emo = ['🌸','⭐','🌟','💖','🎉'];
  for (var i=0;i<18;i++){
    var s = document.createElement('div');
    s.className='confetti'; s.textContent = emo[i%emo.length];
    s.style.left = Math.random()*100 + 'vw';
    s.style.animationDuration = (1.6 + Math.random()*1.4) + 's';
    document.body.appendChild(s);
    (function(el){ setTimeout(function(){ el.remove(); }, 3200); })(s);
  }
}
function showCeleb(){
  var n = Object.keys(known).length;
  document.getElementById('celebMsg').textContent =
    '本轮 '+WORDS.length+' 个字听完啦！累计已会 '+n+' 个字，真棒 👍';
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

/* ============ 存储 ============ */
function loadKnown(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {}; }catch(e){ return {}; }
}
function saveKnown(){
  try{ localStorage.setItem(KEY, JSON.stringify(known)); }catch(e){}
}

/* ============ 启动 ============ */
(function(){
  try{ document.getElementById('dateStr').textContent =
    new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'}); }catch(e){}
  loadIdx();
  render();
  mountResumeBanner();
})();
</script>
<script src="handwrite.js"></script>
</body>
</html>
