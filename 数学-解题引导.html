<meta charset="UTF-8">

<title>🧩 数学解题引导</title>
<style>
  :root{
    --pink:#ff8fab; --yellow:#ffd166; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#b292ff; --orange:#ff9f1c; --cream:#fff8ef; --ink:#3d3a4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#fff8ef,#eef6ff);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  header{background:linear-gradient(120deg,var(--purple),var(--blue));color:#fff;
    border-radius:24px;padding:18px;text-align:center;box-shadow:0 8px 22px rgba(178,146,255,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}

  .tabs{display:flex;gap:8px;margin:14px 0}
  .tabs button{flex:1;border:none;border-radius:16px;padding:12px;font-size:15px;font-weight:800;
    font-family:inherit;cursor:pointer;color:#fff;background:#cdd6e8;transition:.15s}
  .tabs button.on{background:linear-gradient(120deg,var(--purple),var(--blue));box-shadow:0 4px 12px rgba(178,146,255,.4)}
  .tabs button:active{transform:scale(.97)}

  h2{font-size:17px;margin:6px 4px 10px;display:flex;align-items:center;gap:8px}

  /* 例题卡 */
  .ex{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 18px rgba(178,146,255,.18);margin:10px 0;cursor:pointer;transition:.15s}
  .ex:active{transform:scale(.99)}
  .ex .top{display:flex;align-items:flex-start;gap:10px}
  .ex .emoji{font-size:26px;line-height:1}
  .ex .q{font-size:17px;font-weight:800;line-height:1.5;flex:1}
  .ex .arrow{font-size:18px;color:#bbb;transition:.2s;margin-top:2px}
  .ex.open .arrow{transform:rotate(90deg);color:var(--purple)}
  .steps{display:none;margin-top:12px;flex-direction:column;gap:10px}
  .ex.open .steps{display:flex}
  .step{display:flex;gap:10px;align-items:flex-start;background:#f6f3ff;border-radius:14px;padding:12px}
  .step .badge{flex:none;width:34px;height:34px;border-radius:50%;color:#fff;font-weight:800;
    display:flex;align-items:center;justify-content:center;font-size:13px;
    background:linear-gradient(120deg,var(--purple),var(--blue))}
  .step .body{flex:1}
  .step .st{font-size:13px;font-weight:800;color:var(--purple);margin-bottom:3px}
  .step .sd{font-size:15px;line-height:1.6;font-weight:600}

  /* 练习 */
  .qcard{background:#fff;border-radius:24px;padding:20px 18px;box-shadow:0 8px 22px rgba(76,201,240,.22);margin:6px 0;display:none}
  .qcard.show{display:block}
  .qno{font-size:13px;color:#aaa;font-weight:700}
  .qtext{font-size:18px;font-weight:800;line-height:1.6;margin:8px 0 4px}
  .qask{font-size:14px;color:var(--purple);font-weight:800;margin:6px 0 2px}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:12px}
  .opt{border:2px solid #d9ccff;background:#faf7ff;border-radius:16px;padding:14px;
    font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-align:left;transition:.15s}
  .opt:active{transform:scale(.98)}
  .opt .k{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;
    border-radius:50%;background:var(--purple);color:#fff;font-size:14px;margin-right:10px}
  .opt.right{border-color:var(--green);background:#eafff6;color:#1a9e76}
  .opt.wrong{border-color:#ff6b6b;background:#fff0f0;color:#e5484d}
  .opt.done{cursor:default}
  .feedback{font-size:14px;font-weight:800;margin-top:10px;min-height:20px;text-align:center}
  .feedback.ok{color:var(--green)}
  .feedback.no{color:#e5484d}
  .why{font-size:13px;color:#888;margin-top:6px;line-height:1.6;text-align:center;background:#f6faff;border-radius:12px;padding:10px}

  .progress{height:14px;background:#e9e3ff;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--blue));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}

  .ctrls{display:flex;gap:10px;margin-top:14px}
  .ctrls button{flex:1;border:none;border-radius:16px;padding:14px;font-size:15px;
    font-family:inherit;cursor:pointer;color:#fff;font-weight:800;transition:transform .12s}
  .ctrls button:active{transform:scale(.96)}
  .c-next{background:var(--purple)}
  .c-restart{background:var(--orange)}

  .result{background:#fff;border-radius:24px;padding:24px;text-align:center;box-shadow:0 8px 22px rgba(178,146,255,.22);margin:6px 0;display:none}
  .result.show{display:block}
  .result .stars{font-size:40px;letter-spacing:6px;margin:8px 0}
  .result .score{font-size:30px;font-weight:800;color:var(--purple)}
  .result .msg{font-size:14px;color:#888;margin:8px 0 4px;line-height:1.6}

  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);
    border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
</style>
</head>
<body>



<header>
  <h1>🧩 数学解题引导</h1>
  <div class="date" id="dateStr">今天</div>
</header>

<div class="tabs">
  <button id="tabWorked" class="on" onclick="switchTab('worked')">📖 例题精讲</button>
  <button id="tabPractice" onclick="switchTab('practice')">✍️ 我来试试</button>
</div>

<section id="workedSec">
  <h2>📖 点开例题，一步步看思路</h2>
  <div id="workedList"></div>
  <div class="tip">每道题拆成 4 步：读题 → 分析 → 列式 → 验算。<br>看懂了再去做「我来试试」。</div>
</section>

<section id="practiceSec" style="display:none">
  <h2>✍️ 第一步先算什么？</h2>
  <div class="qcard show" id="qcard">
    <div class="qno" id="qno">题目 1 / 6</div>
    <div class="qtext" id="qtext">题干</div>
    <div class="qask">👉 这道题第一步应该先算什么？</div>
    <div class="opts" id="opts"></div>
    <div class="feedback" id="feedback"></div>
    <div class="why" id="why" hidden></div>
    <div id="hwSlot"></div>
  </div>
  <div class="ctrls" id="ctrls" hidden>
    <button class="c-next" onclick="next()">➡️ 下一题</button>
    <button class="c-restart" onclick="restart()">🔄 再来一轮</button>
  </div>
  <div class="result" id="result">
    <div class="stars" id="rStars">⭐⭐⭐</div>
    <div class="score" id="rScore">6 / 6</div>
    <div class="msg" id="rMsg">全对！思路小达人 🏆</div>
    <button class="c-restart" style="border:none;color:#fff;padding:12px 28px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:800" onclick="restart()">🔄 再练一次</button>
  </div>
  <div class="progress"><i id="progBar"></i></div>
  <div class="prog-txt" id="progTxt">进度 0%</div>
  <div class="tip">先想清楚第一步，再选答案。<br>数据按小朋友分别保存，不会上传。</div>
</section>

<div class="confetti" id="confettiBox" hidden></div>

<script>
/* ============ 门禁 + 双账户隔离 ============ */
(function(){
  try{
    var s = Portal.getSession();
    var child = (s && s.child) ? s.child : 'user';
    window.__CHILD = child;
  }catch(e){ window.__CHILD='user'; }
})();
var KEY = 'solveguide_' + (window.__CHILD || 'user');

/* ============ 例题精讲：四步脚手架 ============ */
var WORKED = [
  {id:'w1',emoji:'🍬',q:'小明有 12 颗糖，给了弟弟 5 颗，又买了 8 颗，现在有几颗？',
    steps:[
      {t:'读题',d:'原来 12 颗；给了弟弟 5 颗（减少）；又买了 8 颗（增加）。问"现在有几颗"。'},
      {t:'分析',d:'先算给完后剩多少：12 − 5；再加上新买的 8 颗。'},
      {t:'列式',d:'12 − 5 = 7，7 + 8 = 15（颗）'},
      {t:'验算',d:'15 − 8 = 7，7 + 5 = 12，和"原来 12 颗"对得上 ✓'}
    ]},
  {id:'w2',emoji:'📦',q:'一盒铅笔有 6 支，买 4 盒，又送 3 支，共几支？',
    steps:[
      {t:'读题',d:'每盒 6 支，买了 4 盒；又送 3 支。问"共几支"。'},
      {t:'分析',d:'先算 4 盒有多少支：6 × 4；再加上送的 3 支。'},
      {t:'列式',d:'6 × 4 = 24，24 + 3 = 27（支）'},
      {t:'验算',d:'27 − 3 = 24，24 ÷ 4 = 6，每盒 6 支对得上 ✓'}
    ]},
  {id:'w3',emoji:'🍊',q:'妈妈买 2 袋橘子，每袋 10 个，吃掉 7 个，剩几个？',
    steps:[
      {t:'读题',d:'2 袋，每袋 10 个；吃掉 7 个。问"剩几个"。'},
      {t:'分析',d:'先算一共多少个：2 × 10；再减去吃掉的 7 个。'},
      {t:'列式',d:'2 × 10 = 20，20 − 7 = 13（个）'},
      {t:'验算',d:'13 + 7 = 20，20 ÷ 2 = 10，每袋 10 个对得上 ✓'}
    ]},
  {id:'w4',emoji:'📚',q:'一本书 48 页，每天看 6 页，几天看完？',
    steps:[
      {t:'读题',d:'共 48 页；每天看 6 页。问"几天看完"。'},
      {t:'分析',d:'把 48 页按每 6 页分一份，看能分几份，用除法。'},
      {t:'列式',d:'48 ÷ 6 = 8（天）'},
      {t:'验算',d:'8 × 6 = 48，总页数对得上 ✓'}
    ]},
  {id:'w5',emoji:'🎒',q:'书包 45 元，文具盒比书包便宜 28 元，买这两样共多少元？',
    steps:[
      {t:'读题',d:'书包 45 元；文具盒比书包便宜 28 元（文具盒更便宜）。问"两样共多少元"。'},
      {t:'分析',d:'先算文具盒多少钱：45 − 28；再加上书包的 45 元。'},
      {t:'列式',d:'文具盒 45 − 28 = 17（元），共 45 + 17 = 62（元）'},
      {t:'验算',d:'62 − 45 = 17，17 + 28 = 45，文具盒比书包便宜 28 对得上 ✓'}
    ]},
  {id:'w6',emoji:'🚌',q:'停车场原 24 辆车，开走 9 辆，又来 11 辆，现在几辆？',
    steps:[
      {t:'读题',d:'原来 24 辆；开走 9 辆（减少）；又来 11 辆（增加）。问"现在几辆"。'},
      {t:'分析',d:'先算开走后剩多少：24 − 9；再加上新来的 11 辆。'},
      {t:'列式',d:'24 − 9 = 15，15 + 11 = 26（辆）'},
      {t:'验算',d:'26 − 11 = 15，15 + 9 = 24，原来 24 辆对得上 ✓'}
    ]},
  {id:'w7',emoji:'🏟️',q:'操场长 40 米，宽比长短 15 米，周长多少米？',
    steps:[
      {t:'读题',d:'长 40 米；宽比长短 15 米；求周长。问"周长多少米"。'},
      {t:'分析',d:'先算宽：40 − 15 = 25；周长 = (长 + 宽) × 2。'},
      {t:'列式',d:'宽 40 − 15 = 25（米），周长 (40 + 25) × 2 = 130（米）'},
      {t:'验算',d:'130 ÷ 2 = 65，65 − 40 = 25，25 + 15 = 40，长对得上 ✓'}
    ]},
  {id:'w8',emoji:'🥚',q:'妈妈买 2 打鸡蛋（一打 12 个），打碎 3 个，还剩几个？',
    steps:[
      {t:'读题',d:'2 打，一打 12 个；打碎 3 个。问"还剩几个"。'},
      {t:'分析',d:'先算一共多少个：2 × 12；再减去打碎的 3 个。'},
      {t:'列式',d:'2 × 12 = 24，24 − 3 = 21（个）'},
      {t:'验算',d:'21 + 3 = 24，24 ÷ 2 = 12，一打 12 个对得上 ✓'}
    ]}
  ,{id:'w9',emoji:'🍎',q:'果园有 5 行苹果树，每行 9 棵，又种 15 棵，共多少棵？',
    steps:[
      {t:'读题',d:'5 行，每行 9 棵；又种 15 棵。问"共多少棵"。'},
      {t:'分析',d:'先算原来有多少棵：5 × 9；再加上新种的 15 棵。'},
      {t:'列式',d:'5 × 9 = 45，45 + 15 = 60（棵）'},
      {t:'验算',d:'60 − 15 = 45，45 ÷ 5 = 9，每行 9 棵对得上 ✓'}
    ]}
  ,{id:'w10',emoji:'🧃',q:'一包糖 48 颗，吃掉 9 颗，剩下的平均分给 5 人，每人几颗？',
    steps:[
      {t:'读题',d:'共 48 颗；吃掉 9 颗；剩下的分给 5 人。问"每人几颗"。'},
      {t:'分析',d:'先算剩多少颗：48 − 9；再平均分：÷ 5。'},
      {t:'列式',d:'48 − 9 = 39，39 ÷ 5 = 7（颗）…… 余 4'},
      {t:'验算',d:'7 × 5 = 35，35 + 4 = 39，39 + 9 = 48，原来的 48 颗对得上 ✓'}
    ]}
  ,{id:'w11',emoji:'🚲',q:'小明每天骑 200 米上学，骑了 4 天，又骑 100 米去公园，共骑多少米？',
    steps:[
      {t:'读题',d:'每天 200 米；骑了 4 天；又多骑 100 米。问"共多少米"。'},
      {t:'分析',d:'先算 4 天骑多少：200 × 4；再加上 100 米。'},
      {t:'列式',d:'200 × 4 = 800，800 + 100 = 900（米）'},
      {t:'验算',d:'900 − 100 = 800，800 ÷ 4 = 200，每天 200 米对得上 ✓'}
    ]}
  ,{id:'w12',emoji:'📦',q:'买 3 个本子花了 15 元，再买 2 个同样的本子要多少元？',
    steps:[
      {t:'读题',d:'3 个本子 15 元；再买 2 个同样的。问"再花多少元"。'},
      {t:'分析',d:'先算一个本子多少钱：15 ÷ 3；再算 2 个：× 2。'},
      {t:'列式',d:'15 ÷ 3 = 5（元），5 × 2 = 10（元）'},
      {t:'验算',d:'10 ÷ 2 = 5，5 × 3 = 15，和原来 15 元对得上 ✓'}
    ]}
];

/* ============ 引导练习：选"第一步" ============ */
var PRACTICE = [
  {q:'小红有 3 袋糖，每袋 6 颗，给了弟弟 7 颗，自己剩几颗？',
    opts:['先算一共有几颗：3 × 6','先算给完剩几颗：6 − 7','先算弟弟有几颗：3 + 7','先算每袋几颗：3 ÷ 6'],
    ans:0,why:'应该先算总共：3 × 6 = 18，再减 7 得 11。'},
  {q:'买 4 支铅笔（每支 2 元）和 2 块橡皮（每块 3 元），共多少元？',
    opts:['先算铅笔多少钱：4 × 2','先算一共几件：4 + 2','先把单价相加：2 + 3','先算橡皮比铅笔贵多少：3 − 2'],
    ans:0,why:'两种文具单价不同，先分别算再相加：铅笔 4×2=8，橡皮 2×3=6，共 14。先算铅笔是合理第一步。'},
  {q:'一根绳长 60 厘米，剪掉 23 厘米，剩下的每 7 厘米分一段，可分几段？',
    opts:['先算剩下多长：60 − 23','先算能剪几段：60 ÷ 7','先算剪掉后每段：23 ÷ 7','先算总长：60 + 23'],
    ans:0,why:'先算剩下的：60 − 23 = 37，再 37 ÷ 7 = 5 段余 2。'},
  {q:'小明每天写 3 页字，写了 7 天，又多写 5 页，共写几页？',
    opts:['先算 7 天写多少：3 × 7','先算每天共写：3 + 5','先算多写的：7 + 5','先算一共几天：3 + 7'],
    ans:0,why:'先算 7 天：3 × 7 = 21，再加多写的 5 页 = 26。'},
  {q:'仓库有 90 箱货，上午运走 35 箱，下午运走 28 箱，还剩几箱？',
    opts:['先算上午剩多少：90 − 35','先算共运走：35 + 28','先算下午运：90 − 28','先算还剩：90 − 35 − 28'],
    ans:0,why:'先算上午运走后剩：90 − 35 = 55，再减下午 28 = 27。也可以先算共运走 35+28 再减。'},
  {q:'一张桌子坐 4 人，7 张桌子坐满，来了 3 位老师，共多少人？',
    opts:['先算同学有几人：7 × 4','先算一共几张桌：7 + 3','先算老师加桌：4 + 3','先算每桌老师：3 ÷ 7'],
    ans:0,why:'先算 7 张桌坐的同学：7 × 4 = 28，再加老师 3 人 = 31。'}
  ,{q:'果园有 5 行树每行 9 棵，又种 15 棵，求共几棵第一步？',
    opts:['先算原来几棵：5 × 9','先算加完后：9 + 15','先算每行：5 ÷ 9','先算一共几行：5 + 15'],
    ans:0,why:'先算原有 5×9=45，再加 15 = 60。先算原有是合理第一步。'}
  ,{q:'一包糖 48 颗，吃掉 9 颗，剩下的平均分 5 人，每人几颗第一步？',
    opts:['先算剩多少：48 − 9','先算每人：48 ÷ 5','先算吃掉后：9 ÷ 5','先算总数：48 + 9'],
    ans:0,why:'先算剩下的 48−9=39，再 39÷5=7 余 4。'}
  ,{q:'小明每天写 8 个毛笔字，写 5 天，再写 10 个，共几个第一步？',
    opts:['先算 5 天写多少：8 × 5','先算每天共：8 + 10','先算一共几天：5 + 10','先算多写的：5 + 8'],
    ans:0,why:'先算 5 天 8×5=40，再加 10 = 50。'}
  ,{q:'操场一圈 200 米，跑 3 圈再加 50 米，共几米第一步？',
    opts:['先算 3 圈：200 × 3','先算加完：200 + 50','先算每圈：3 ÷ 200','先算圈数：3 + 50'],
    ans:0,why:'先算 3 圈 200×3=600，再加 50 = 650。'}
];

/* ============ 撒花 ============ */
function celebrate(){
  var box=document.getElementById('confettiBox');
  var emo=['🎉','⭐','🌟','✨','🏆','💡'];
  for(var i=0;i<28;i++){
    var s=document.createElement('span');
    s.className='confetti';s.textContent=emo[(Math.random()*emo.length)|0];
    s.style.left=(Math.random()*100)+'vw';
    s.style.animationDuration=(1.6+Math.random()*1.4)+'s';
    s.style.fontSize=(18+Math.random()*16)+'px';
    box.appendChild(s);
    (function(el){setTimeout(function(){el.remove();},3000);})(s);
  }
}

/* ============ 渲染例题 ============ */
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function renderWorked(){
  var html='';
  WORKED.forEach(function(w){
    var stepsHtml = w.steps.map(function(st,i){
      return '<div class="step"><div class="badge">'+(i+1)+'</div><div class="body"><div class="st">'+st.t+'</div><div class="sd">'+esc(st.d)+'</div></div></div>';
    }).join('');
    html += '<div class="ex" onclick="toggleEx(this)"><div class="top"><div class="emoji">'+w.emoji+'</div><div class="q">'+esc(w.q)+'</div><div class="arrow">▸</div></div><div class="steps">'+stepsHtml+'</div></div>';
  });
  document.getElementById('workedList').innerHTML = html;
}
function toggleEx(el){ el.classList.toggle('open'); }

/* ============ 渲染练习 ============ */
var cur=0, score=0, done=false;
function renderPractice(){
  if(cur>=PRACTICE.length){ showResult(); return; }
  var p=PRACTICE[cur];
  document.getElementById('qno').textContent='题目 '+(cur+1)+' / '+PRACTICE.length;
  document.getElementById('qtext').textContent=p.q;
  var optsHtml='';
  p.opts.forEach(function(o,i){
    optsHtml += '<button class="opt" onclick="choose('+i+',this)"><span class="k">'+(String.fromCharCode(65+i))+'</span>'+esc(o)+'</button>';
  });
  document.getElementById('opts').innerHTML=optsHtml;
  document.getElementById('feedback').textContent='';
  document.getElementById('feedback').className='feedback';
  document.getElementById('why').hidden=true;
  document.getElementById('ctrls').hidden=true;
  document.getElementById('qcard').classList.add('show');
  updateProgress();
  var slot=document.getElementById('hwSlot'); slot.innerHTML='';
  if(window.Handwrite){
    var hw=Handwrite.create({revealText:p.opts[p.ans], placeholder:'✍️ 写写你的思路（第一步先算…）', onReveal:function(){ hwReveal(p); }});
    slot.appendChild(hw.el);
  }
}
function hwReveal(p){
  var why=document.getElementById('why');
  why.textContent='💡 第一步：'+p.opts[p.ans]+'。'+p.why;
  why.hidden=false;
  document.getElementById('ctrls').hidden=false;
}
function choose(i,btn){
  if(done) return;
  var p=PRACTICE[cur];
  var btns=document.getElementById('opts').children;
  for(var k=0;k<btns.length;k++) btns[k].classList.add('done');
  btns[p.ans].classList.add('right');
  var fb=document.getElementById('feedback');
  if(i===p.ans){ score++; fb.textContent='✅ 答对啦！'; fb.className='feedback ok'; }
  else { btn.classList.add('wrong'); fb.textContent='❌ 再想想~'; fb.className='feedback no'; }
  var why=document.getElementById('why');
  why.textContent='💡 '+p.why; why.hidden=false;
  document.getElementById('ctrls').hidden=false;
}
function next(){
  cur++;
  if(cur>=PRACTICE.length){ showResult(); }
  else { renderPractice(); }
}
function showResult(){
  document.getElementById('qcard').classList.remove('show');
  document.getElementById('ctrls').hidden=true;
  var r=document.getElementById('result'); r.classList.add('show');
  var pct = Math.round(score/PRACTICE.length*100);
  document.getElementById('rScore').textContent=score+' / '+PRACTICE.length;
  var stars = pct>=80 ? '⭐⭐⭐' : (pct>=50 ? '⭐⭐' : '⭐');
  document.getElementById('rStars').textContent=stars;
  document.getElementById('rMsg').textContent = pct>=80 ? '全对！思路小达人 🏆' : (pct>=50 ? '不错，再多练几道就更稳啦 💪' : '慢慢来，先看懂例题再试 📖');
  if(pct>=80) celebrate();
}
function updateProgress(){
  var pct=Math.round(cur/PRACTICE.length*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent='进度 '+pct+'%';
}
function restart(){
  cur=0; score=0; done=false;
  document.getElementById('result').classList.remove('show');
  renderPractice();
}

/* ============ 切换 Tab ============ */
function switchTab(which){
  var w=document.getElementById('tabWorked'), p=document.getElementById('tabPractice');
  var ws=document.getElementById('workedSec'), ps=document.getElementById('practiceSec');
  if(which==='worked'){ w.classList.add('on'); p.classList.remove('on'); ws.style.display='block'; ps.style.display='none'; }
  else { p.classList.add('on'); w.classList.remove('on'); ps.style.display='block'; ws.style.display='none'; }
}

/* ============ 初始化 ============ */
(function(){
  try{
    var d=new Date();
    var wk=['日','一','二','三','四','五','六'][d.getDay()];
    document.getElementById('dateStr').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 周'+wk;
  }catch(e){}
  renderWorked();
  renderPractice();
})();
</script>
