<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.github.com https:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'">
<meta charset="utf-8">
<title>英语儿歌听唱 · 幼儿</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover, maximum-scale=1, user-scalable=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#caffbf">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f7fb; --card:#ffffff; --ink:#1f2a44; --sub:#7b87a3;
    --line:#e6ecf5; --green:#06d6a0; --blue:#4cc9f0; --gold:#ffd166;
    --radius:18px; --shadow:0 8px 24px rgba(31,42,68,.08);
  }
  html,body{min-height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#eafbf2 0%,#eaf6ff 55%,#fff6ec 100%);
    color:var(--ink);padding:0 0 40px;-webkit-tap-highlight-color:transparent;
  }
  .top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;
    padding:14px 16px;background:rgba(255,255,255,.82);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line)}
  .top .brand{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
  .top .back{margin-left:auto;border:none;background:linear-gradient(135deg,#06d6a0,#4cc9f0);color:#fff;
    border-radius:14px;padding:11px 18px;font-size:16px;font-weight:900;cursor:pointer;font-family:inherit;
    box-shadow:0 4px 12px rgba(6,214,160,.4)}
  .top .back:active{transform:scale(.95)}
  main{max-width:560px;margin:0 auto;padding:22px 16px}
  .hero{text-align:center;margin:8px 0 16px}
  .hero .big{font-size:50px;line-height:1}
  .hero h1{font-size:21px;margin-top:8px}
  .hero p{color:var(--sub);font-size:13px;margin-top:6px;line-height:1.6}
  .sec-title{font-size:15px;font-weight:800;margin:18px 4px 12px;display:flex;align-items:center;gap:6px}
  /* 歌单 */
  .songs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .song{background:var(--card);border-radius:var(--radius);padding:16px 12px;box-shadow:var(--shadow);
    border:2px solid var(--line);text-align:center;cursor:pointer;transition:.15s}
  .song:active{transform:scale(.97)}
  .song.active{border-color:var(--green);background:#f0fdf8;box-shadow:0 6px 16px rgba(6,214,160,.2)}
  .song .se{font-size:40px;line-height:1}
  .song .sn{font-size:14px;font-weight:800;margin-top:8px;line-height:1.3}
  /* 歌词 */
  .lyrics{margin-top:16px;display:none}
  .lyrics.show{display:block}
  .guidebar{display:flex;gap:10px;margin:14px 0}
  .guidebar button{flex:1;border:none;border-radius:14px;padding:13px;font-size:15px;font-weight:800;
    font-family:inherit;cursor:pointer;color:#fff}
  .guidebar .g{background:linear-gradient(135deg,#06d6a0,#4cc9f0);box-shadow:0 6px 16px rgba(76,201,240,.35)}
  .guidebar .reset{background:#fff;color:#7b87a3;border:2px solid var(--line)}
  .guidebar button:active{transform:scale(.97)}
  .line{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:14px 14px;
    box-shadow:var(--shadow);border:1px solid var(--line);margin-bottom:10px;transition:.15s}
  .line.cur{border-color:var(--green);background:#f0fdf8;transform:scale(1.01)}
  .line .ln{font-size:13px;color:var(--sub);font-weight:800;flex:0 0 auto;width:18px}
  .line .lmain{flex:1;min-width:0}
  .line .len{font-size:19px;font-weight:800;line-height:1.35}
  .line .lzh{font-size:13px;color:var(--sub);margin-top:3px}
  .line .lact{font-size:12px;color:#e8590c;margin-top:4px;background:#fff4e6;border-radius:8px;padding:4px 8px;display:inline-block}
  .line .spk{flex:0 0 auto;border:none;background:#eafaf3;border-radius:50%;width:46px;height:46px;font-size:22px;
    cursor:pointer;color:var(--green)}
  .line .spk:active{transform:scale(.92)}
  .foot{text-align:center;color:var(--sub);font-size:12px;margin-top:24px;line-height:1.7}
  .banner{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(120deg,#06d6a0,#4cc9f0);color:#fff;padding:14px 22px;border-radius:18px;
    font-size:15px;font-weight:700;box-shadow:0 10px 28px rgba(76,201,240,.5);z-index:95;opacity:0;
    transition:.4s;max-width:92vw;text-align:center;pointer-events:none}
  .banner.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><span>🎵</span> 英语儿歌听唱</div>
  <button class="back" onclick="location.href='门户.html'">↩ 返回</button>
</header>

<main>
  <div class="hero">
    <div class="big">🎶👶</div>
    <h1>和宝贝一起唱儿歌</h1>
    <p>点歌词听标准发音，跟着唱 + 做动作，零压力练英语语感～</p>
  </div>

  <div class="sec-title"><span>🎵</span> 选一首儿歌</div>
  <div class="songs" id="songs"></div>

  <div class="lyrics" id="lyrics">
    <div class="guidebar">
      <button class="g" onclick="startGuide()">▶️ 一句句跟唱</button>
      <button class="reset" onclick="resetSong()">↺ 重选</button>
    </div>
    <div id="lines"></div>
  </div>

  <div class="foot">英语儿歌听唱 · 适合幼儿（中班）<br>数据在本地，不上传；点 🔊 听标准发音</div>
</main>

<div class="banner" id="banner"></div>

<script src="speech.js"></script>
<script>
/* ===== 儿歌数据（经典英文儿歌，双语 + 动作提示，适合中班幼儿） ===== */
var SONGS = [
  { title:'Twinkle Twinkle Little Star', emoji:'⭐', lines:[
    {en:'Twinkle, twinkle, little star', zh:'一闪一闪小星星', act:'双手手指抖动像星星 ✨'},
    {en:'How I wonder what you are', zh:'我想知道你是什么', act:'歪头做思考状 🤔'},
    {en:'Up above the world so high', zh:'高高挂在天空上', act:'手指指上方 ☝️'},
    {en:'Like a diamond in the sky', zh:'像颗钻石在夜空', act:'双手比划菱形 💎'}
  ]},
  { title:'Old MacDonald Had a Farm', emoji:'🚜', lines:[
    {en:'Old MacDonald had a farm', zh:'老麦克唐纳有个农场', act:'模仿农夫锄地 🌾'},
    {en:'Ee-i-ee-i-o', zh:'咿哎咿哎哦', act:'拍手打节奏 👏'},
    {en:'And on that farm he had a cow', zh:'农场里有头奶牛', act:'双手比牛角 🐮'},
    {en:'With a moo moo here', zh:'这里哞哞叫', act:'学牛叫 moo~ 🐮'}
  ]},
  { title:'The Wheels on the Bus', emoji:'🚌', lines:[
    {en:'The wheels on the bus go round and round', zh:'公交车轮子转呀转', act:'双手画圈 🔄'},
    {en:'Round and round, round and round', zh:'转呀转，转呀转', act:'转圈圈 🔄'},
    {en:'The wipers on the bus go swish', zh:'雨刷刷刷刷', act:'手左右摆 🤚'},
    {en:'Swish swish swish', zh:'刷刷刷', act:'继续摆手 🤚'}
  ]},
  { title:"If You're Happy and You Know It", emoji:'👏', lines:[
    {en:"If you're happy and you know it, clap your hands", zh:'如果你开心就拍拍手', act:'拍手 👏'},
    {en:'Clap your hands', zh:'拍拍手', act:'拍手 👏'},
    {en:"If you're happy and you know it, stamp your feet", zh:'如果你开心就跺跺脚', act:'跺脚 👣'},
    {en:'Stamp your feet', zh:'跺跺脚', act:'跺脚 👣'}
  ]},
  { title:'Head, Shoulders, Knees and Toes', emoji:'💃', lines:[
    {en:'Head, shoulders, knees and toes', zh:'头 肩膀 膝盖 脚趾', act:'依次指对应部位 👶'},
    {en:'Knees and toes', zh:'膝盖 脚趾', act:'指膝盖和脚趾'},
    {en:'Head and shoulders', zh:'头 和 肩膀', act:'指头和肩膀'},
    {en:'Eyes and ears and mouth and nose', zh:'眼睛 耳朵 嘴 鼻', act:'指五官 😊'}
  ]},
  { title:'Row, Row, Row Your Boat', emoji:'🚣', lines:[
    {en:'Row, row, row your boat', zh:'划呀划你的小船', act:'双手做划桨 🚣'},
    {en:'Gently down the stream', zh:'轻轻顺流而下', act:'手往前推 🌊'},
    {en:'Merrily, merrily, merrily', zh:'快乐地 快乐地', act:'开心笑 😊'},
    {en:'Life is but a dream', zh:'生活像一场梦', act:'双手托腮 😴'}
  ]}
];

var CUR = -1;     // 当前选中歌下标
var GUIDE = -1;   // 跟唱模式当前句

function speakLine(i){
  if(CUR<0 || i<0) return;
  var en = SONGS[CUR].lines[i].en;
  if(window.Speech && Speech.speak) Speech.speak(en, 0.8);
}
function showBanner(t){ var b=document.getElementById('banner'); b.textContent=t; b.classList.add('show'); clearTimeout(b._t); b._t=setTimeout(function(){ b.classList.remove('show'); },2600); }

function renderSongs(){
  document.getElementById('songs').innerHTML = SONGS.map(function(s,i){
    return '<div class="song'+(i===CUR?' active':'')+'" onclick="selectSong('+i+')">'+
      '<div class="se">'+s.emoji+'</div><div class="sn">'+s.title+'</div></div>';
  }).join('');
}
function selectSong(i){
  CUR=i; GUIDE=-1;
  renderSongs();
  document.getElementById('lyrics').classList.add('show');
  var html='';
  SONGS[i].lines.forEach(function(l,idx){
    html+='<div class="line" id="line-'+idx+'">'+
      '<div class="ln">'+(idx+1)+'</div>'+
      '<div class="lmain"><div class="len">'+l.en+'</div>'+
      '<div class="lzh">'+l.zh+'</div>'+
      '<div class="lact">👉 '+l.act+'</div></div>'+
      '<button class="spk" onclick="speakLine('+idx+')">🔊</button></div>';
  });
  document.getElementById('lines').innerHTML=html;
  if(window.Gloss) Gloss.wrapOriginalWords(document.getElementById('lines'));
  if(window.Speech && Speech.speak) Speech.speak(SONGS[i].lines[0].en, 0.8); // 选歌先听第一句
}
function startGuide(){
  if(CUR<0){ showBanner('请先选一首儿歌 🎵'); return; }
  GUIDE=0; highlight(); speakLine(0);
}
function highlight(){
  for(var k=0;k<SONGS[CUR].lines.length;k++){
    var el=document.getElementById('line-'+k);
    if(el) el.classList.toggle('cur', k===GUIDE);
  }
}
function nextLine(){
  if(CUR<0) return;
  if(GUIDE < SONGS[CUR].lines.length-1){ GUIDE++; highlight(); speakLine(GUIDE); }
  else { showBanner('🎉 唱完啦！真棒～'); GUIDE=-1; highlight(); }
}
function resetSong(){
  document.getElementById('lyrics').classList.remove('show');
  CUR=-1; GUIDE=-1; renderSongs();
}
// 跟唱模式下，点当前高亮句也可推进
document.addEventListener('click', function(e){
  if(GUIDE>=0 && e.target && e.target.id && e.target.id.indexOf('line-')===0){
    var idx=parseInt(e.target.id.split('-')[1],10);
    if(idx===GUIDE) nextLine();
  }
});

renderSongs();
</script>
<script>
if('serviceWorker' in navigator){var _h=location.hostname;if(_h!=='localhost'&&_h!=='127.0.0.1'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}}
</script>
<script src="sync.js"></script>
</body>
</html>
