<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.github.com https:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'">

<script src="accounts.js"></script>
<script src="speech.js"></script>
<script src="study-time.js"></script>
<script src="util.js"></script>
<script src="words.js"></script>
<script src="phonics-data.js"></script>
<script src="gloss.js"></script>
<script src="resume.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>单词训练 · 认读/拼写/听写/拼读</title>
<style>
  :root{
    --bg1:#eaf4ff; --bg2:#ffeef6; --bg3:#fff7e6;
    --card:#ffffff; --ink:#2b2f44; --sub:#7b8198;
    --blue:#5b8def; --pink:#ff7eb3; --purple:#9b6dff; --green:#34c77b; --orange:#ff9f43;
    --shadow:0 18px 40px rgba(60,80,140,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",-apple-system,system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    background-attachment:fixed; padding:22px 14px 40px;
  }
  .wt-wrap{max-width:1180px;margin:0 auto;}
  .wt-head{text-align:center;margin-bottom:18px;}
  .wt-head h1{font-size:26px;font-weight:900;margin:0 0 6px;letter-spacing:1px;}
  .wt-head p{margin:0;color:var(--sub);font-size:14px;}
  .wt-tabs{display:flex;gap:8px;background:#fff;border-radius:18px;padding:8px;box-shadow:var(--shadow);margin-bottom:14px;flex-wrap:wrap;}
  .wt-tabs .wt-t{flex:1;min-width:72px;text-align:center;padding:11px 4px;border-radius:12px;font-weight:800;font-size:15px;color:var(--sub);cursor:pointer;transition:.15s;background:transparent;border:none;font-family:inherit;}
  .wt-tabs .wt-t.on{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;box-shadow:0 6px 16px rgba(91,141,239,.35);}
  .wt-pane{display:none;}
  .wt-pane.on{display:block;}
  .wt-tip{margin-top:16px;text-align:center;color:var(--sub);font-size:12.5px;background:rgba(255,255,255,.6);border-radius:14px;padding:12px 14px;line-height:1.6;}
  [hidden]{display:none !important;}

  /* ============ 认读模块 ============ */
  .m-read .r-bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
  .m-read .r-chip{border:0;background:#fff;color:var(--sub);font-weight:700;padding:8px 13px;border-radius:99px;cursor:pointer;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.06);}
  .m-read .r-chip.on{background:linear-gradient(135deg,var(--blue),#7ea7ff);color:#fff;}
  .m-read .r-chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none;}
  .m-read .r-chips::-webkit-scrollbar{display:none;}
  .m-read .r-stage{position:sticky;top:14px;}
  .m-read .r-flip{perspective:1600px;}
  .m-read .r-inner{position:relative;width:100%;height:560px;transition:transform .7s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d;}
  .m-read .r-flip.flipped .r-inner{transform:rotateY(180deg);}
  .m-read .r-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:32px;padding:44px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .m-read .r-front{background:linear-gradient(160deg,#ffffff,#f4f8ff);}
  .m-read .r-back{background:linear-gradient(160deg,#fff6fb,#f3efff);transform:rotateY(180deg);}
  .m-read .r-cat{display:inline-block;align-self:flex-start;font-size:14px;font-weight:800;padding:7px 16px;border-radius:99px;color:#fff;background:var(--blue);}
  .m-read .r-word{font-size:80px;font-weight:900;letter-spacing:.5px;margin:26px 0 10px;line-height:1.04;word-break:break-word;}
  .m-read .r-ipa{font-size:32px;color:var(--blue);font-weight:700;margin-top:4px;}
  .m-read .r-cn{font-size:30px;color:var(--ink);margin-top:12px;font-weight:700;}
  .m-read .r-ex{margin-top:auto;font-size:17px;color:var(--sub);background:#f1f4fb;border-radius:14px;padding:16px 18px;line-height:1.5;}
  .m-read .r-ex b{color:var(--ink);}
  .m-read .r-speak-row{display:flex;gap:12px;margin-top:18px;}
  .m-read .r-speak{flex:1;border:0;border-radius:22px;padding:20px;font-size:20px;font-weight:800;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 10px 22px rgba(91,141,239,.35);background:linear-gradient(135deg,var(--blue),#7ea7ff);}
  .m-read .r-speak.slow{background:linear-gradient(135deg,var(--orange),#ffc078);box-shadow:0 10px 22px rgba(255,159,67,.3);}
  .m-read .r-speak:active{transform:translateY(2px);}
  .m-read .r-nav{display:flex;gap:10px;margin-top:14px;}
  .m-read .r-nav button{flex:1;border:0;border-radius:18px;padding:16px;font-size:17px;font-weight:800;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 6px 14px rgba(0,0,0,.06);}
  .m-read .r-nav button:active{transform:scale(.97);}
  .m-read .r-mastered{background:linear-gradient(135deg,var(--green),#7ee2a8);color:#fff;box-shadow:0 8px 18px rgba(52,199,123,.3);}
  .m-read .r-mastered.done{background:#dfeee7;color:var(--green);box-shadow:none;}
  .m-read .r-panel{background:rgba(255,255,255,.7);backdrop-filter:blur(8px);border-radius:22px;padding:14px;box-shadow:var(--shadow);}
  .m-read .r-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;max-height:560px;overflow-y:auto;padding:2px;}
  .m-read .r-cell{border:0;border-radius:14px;padding:12px 8px;text-align:center;cursor:pointer;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.05);position:relative;transition:transform .15s;}
  .m-read .r-cell:active{transform:scale(.95);}
  .m-read .r-cell .cw{font-size:16px;font-weight:800;}
  .m-read .r-cell .ci{font-size:11px;color:var(--sub);margin-top:2px;}
  .m-read .r-cell.on{outline:3px solid var(--blue);outline-offset:-1px;}
  .m-read .r-cell.done{background:linear-gradient(135deg,var(--green),#7ee2a8);}
  .m-read .r-cell.done .cw,.m-read .r-cell.done .ci{color:#fff;}
  .m-read .r-cell .chk{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--green);font-weight:900;font-size:14px;display:none;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.15);}
  .m-read .r-cell.done .chk{display:flex;}
  .m-read .r-toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:rgba(43,47,68,.92);color:#fff;padding:12px 22px;border-radius:99px;font-weight:700;opacity:0;transition:.3s;pointer-events:none;z-index:50;}
  .m-read .r-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .m-read .r-prog{height:10px;background:#e9edf6;border-radius:99px;overflow:hidden;margin:8px 0 14px;}
  .m-read .r-prog > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),#7ee2a8);transition:width .4s;}
  .m-read .r-main{display:grid;grid-template-columns:1.3fr .7fr;gap:20px;align-items:start;}
  .m-read .r-tracker{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 2px;}
  .m-read .r-sq{width:18px;height:14px;border-radius:4px;background:#e6eaf3;transition:.3s;box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
  .m-read .r-sq.done{background:linear-gradient(135deg,var(--green),#7ee2a8);box-shadow:none;}
  @media(max-width:880px){ .m-read .r-main{grid-template-columns:1fr;} .m-read .r-inner{height:480px;} .m-read .r-word{font-size:58px;} .m-read .r-face{padding:28px;} }

  /* ============ 拼写模块 ============ */
  .m-spell .sp-topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .m-spell .sp-title{font-size:19px;font-weight:800;letter-spacing:.5px}
  .m-spell .sp-title small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
  .m-spell .sp-voice{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--sub)}
  .m-spell select.voice-sel{font-size:12px;padding:4px 6px;border:1px solid var(--line,#e3e9f2);border-radius:8px;background:#fff;color:var(--ink)}
  .m-spell .sp-stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .m-spell .sp-chip{font-size:12px;background:#eef3fb;border:1px solid #e3e9f2;border-radius:999px;padding:3px 10px;color:#7b8198}
  .m-spell .sp-chip b{color:var(--ink)}
  .m-spell .sp-grades{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .m-spell .sp-gbtn{font-size:13px;padding:6px 12px;border-radius:999px;border:1px solid #e3e9f2;background:#fff;color:#7b8198;cursor:pointer;transition:.15s}
  .m-spell .sp-gbtn.on{background:var(--blue,#2f6fed);border-color:var(--blue,#2f6fed);color:#fff;font-weight:700}
  .m-spell .sp-gbtn.review{margin-left:auto}
  .m-spell .sp-gbtn.review .dot{display:inline-block;min-width:16px;padding:0 4px;margin-left:3px;border-radius:999px;background:#e8553e;color:#fff;font-size:11px}
  .m-spell .sp-scene{width:100%;max-width:460px;height:clamp(470px,72vh,560px);perspective:1400px;margin:0 auto 10px}
  .m-spell .sp-card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.2,.7,.3,1)}
  .m-spell .sp-card.flipped{transform:rotateY(180deg)}
  .m-spell .sp-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid #e3e9f2;border-radius:18px;box-shadow:0 10px 30px rgba(40,70,130,.10);padding:16px;display:flex;flex-direction:column;overflow:auto}
  .m-spell .sp-back{transform:rotateY(180deg)}
  .m-spell .sp-ipa-wrap{text-align:center;margin:6px 0 2px}
  .m-spell .sp-ipa{font-size:34px;font-weight:800;letter-spacing:1px;color:var(--blue,#2f6fed);cursor:pointer;display:inline-block}
  .m-spell .sp-cat{text-align:center;font-size:12px;color:#7b8198;margin-bottom:8px}
  .m-spell .sp-slots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:8px 0 12px}
  .m-spell .sp-slot{width:38px;height:46px;border-radius:10px;border:2px solid #e3e9f2;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;text-transform:lowercase;color:var(--ink);transition:.12s}
  .m-spell .sp-slot.sel{border-color:var(--blue,#2f6fed);box-shadow:0 0 0 3px rgba(47,111,237,.18)}
  .m-spell .sp-slot.locked{border-color:#f5a623;color:#f5a623;background:#fff8ec}
  .m-spell .sp-slot.sep{border:none;background:none;width:14px;font-size:26px;color:#7b8198}
  .m-spell .sp-keyboard{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:auto}
  .m-spell .sp-kb{font-size:17px;font-weight:600;padding:11px 0;border-radius:10px;border:1px solid #e3e9f2;background:#fff;color:var(--ink);cursor:pointer;user-select:none;transition:.1s}
  .m-spell .sp-kb:active{background:#eef3fb}
  .m-spell .sp-kb.del{grid-column:span 2;background:#eef3fb;color:#7b8198}
  .m-spell .sp-kb.clear{grid-column:span 2;background:#eef3fb;color:#7b8198}
  .m-spell .sp-row{display:flex;gap:8px;margin-top:12px}
  .m-spell .sp-btn{flex:1;font-size:15px;font-weight:700;padding:12px 0;border-radius:12px;border:none;cursor:pointer;transition:.12s}
  .m-spell .sp-btn:active{transform:translateY(1px)}
  .m-spell .sp-btn.hint{background:#f5a623;color:#fff}
  .m-spell .sp-btn.listen{background:#eef3fb;color:var(--blue,#2f6fed);border:1px solid #e3e9f2}
  .m-spell .sp-btn.submit{background:var(--blue,#2f6fed);color:#fff}
  .m-spell .sp-btn.ghost{background:#fff;border:1px solid #e3e9f2;color:#7b8198}
  .m-spell .sp-btn[disabled]{opacity:.45;cursor:not-allowed}
  .m-spell .sp-controls{display:flex;gap:8px;width:100%;max-width:460px;margin:0 auto 8px}
  .m-spell .sp-feedback{min-height:22px;text-align:center;font-size:14px;font-weight:700;margin:2px auto 8px;width:100%;max-width:460px}
  .m-spell .sp-feedback.ok{color:#1fae6b} .m-spell .sp-feedback.no{color:#e8553e}
  .m-spell .sp-progress{font-size:12px;color:#7b8198;text-align:center;width:100%;max-width:460px;margin:0 auto 6px}
  .m-spell .sp-b-word{font-size:40px;font-weight:800;text-align:center;margin-top:6px}
  .m-spell .sp-b-ipa{text-align:center;font-size:22px;color:var(--blue,#2f6fed);margin:4px 0}
  .m-spell .sp-b-pos-wrap{text-align:center}
  .m-spell .sp-b-pos{display:inline-block;background:#eef3fb;color:#1f54c0;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700}
  .m-spell .sp-b-cn{text-align:center;font-size:20px;font-weight:700;margin:8px 0}
  .m-spell .sp-b-ex{background:#eef3fb;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
  .m-spell .sp-b-ex .en{font-weight:700} .m-spell .sp-b-ex .cn{color:#7b8198;font-size:13px;margin-top:2px}
  .m-spell .sp-b-actions{display:flex;gap:10px;margin-top:auto;padding-top:10px}
  .m-spell .sp-btn.master{background:#1fae6b;color:#fff}
  .m-spell .sp-btn.rev{background:#f5a623;color:#fff}
  .m-spell .sp-mask{position:fixed;inset:0;background:rgba(20,30,50,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
  .m-spell .sp-mask.show{display:flex}
  .m-spell .sp-sheet{background:#fff;width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:16px;max-height:82vh;overflow:auto}
  .m-spell .sp-sheet h3{margin:0 0 4px;font-size:17px}
  .m-spell .sp-sheet .sub{font-size:12px;color:#7b8198;margin-bottom:10px}
  .m-spell .sp-rlist{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
  .m-spell .sp-ritem{display:flex;align-items:center;gap:10px;border:1px solid #e3e9f2;border-radius:12px;padding:8px 10px}
  .m-spell .sp-ritem .w{font-weight:800;font-size:16px;min-width:84px}
  .m-spell .sp-ritem .m{font-size:12px;color:#7b8198;flex:1}
  .m-spell .sp-ritem .tag{font-size:11px;padding:2px 8px;border-radius:999px;background:#eef3fb;color:#7b8198}
  .m-spell .sp-ritem .tag.bad{background:#fdecea;color:#e8553e}
  .m-spell .sp-ritem .x{color:#7b8198;cursor:pointer;font-size:18px;padding:0 4px}
  .m-spell .sp-sheet .acts{display:flex;gap:10px}
  .m-spell .sp-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink,#23303f);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:80}
  .m-spell .sp-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(min-width:560px){ .m-spell .sp-mask{align-items:center} .m-spell .sp-sheet{border-radius:18px} }

  /* ============ 听写模块 ============ */
  .m-dict .dict-topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
  .m-dict .dict-title{font-size:19px;font-weight:800;letter-spacing:.5px}
  .m-dict .dict-title small{display:block;font-size:11px;font-weight:500;color:var(--sub)}
  .m-dict .dict-voice{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);flex-wrap:wrap;justify-content:flex-end}
  .m-dict .dict-accent{font-size:13px;padding:5px 10px;border-radius:999px;border:1px solid #e3e9f2;background:#fff;color:var(--ink);cursor:pointer}
  .m-dict .dict-stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .m-dict .dict-chip{font-size:12px;background:#efe8fb;border:1px solid #e3e9f2;border-radius:999px;padding:3px 10px;color:#7b8198}
  .m-dict .dict-chip b{color:var(--ink)}
  .m-dict .dict-card{width:100%;max-width:460px;margin:0 auto;background:#fff;border:1px solid #e3e9f2;border-radius:18px;box-shadow:0 10px 30px rgba(80,40,130,.10);padding:18px;margin-bottom:10px}
  .m-dict .dict-sec-t{font-size:16px;font-weight:800;margin-bottom:4px}
  .m-dict .dict-sec-s{font-size:12px;color:#7b8198;margin-bottom:14px}
  .m-dict .dict-field{margin-bottom:16px}
  .m-dict .dict-field .lab{font-size:13px;font-weight:700;margin-bottom:8px;display:block}
  .m-dict .dict-grades{display:flex;gap:6px;flex-wrap:wrap}
  .m-dict .dict-gbtn{font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid #e3e9f2;background:#fff;color:#7b8198;cursor:pointer;transition:.15s}
  .m-dict .dict-gbtn.on{background:var(--purple,#8338ec);border-color:var(--purple,#8338ec);color:#fff}
  .m-dict .dict-counts{display:flex;gap:8px}
  .m-dict .dict-cbtn{flex:1;font-size:14px;font-weight:700;padding:11px 0;border-radius:12px;border:1px solid #e3e9f2;background:#fff;color:#7b8198;cursor:pointer;transition:.15s}
  .m-dict .dict-cbtn.on{background:var(--purple,#8338ec);border-color:var(--purple,#8338ec);color:#fff}
  .m-dict .dict-last{background:#efe8fb;border:1px solid #e3e9f2;border-radius:12px;padding:10px 12px;font-size:13px;color:#7b8198;margin-bottom:14px}
  .m-dict .dict-last b{color:var(--ink)}
  .m-dict .dict-btn{flex:1;font-size:16px;font-weight:800;padding:14px 0;border-radius:14px;border:none;cursor:pointer;transition:.12s;font-family:inherit}
  .m-dict .dict-btn:active{transform:translateY(1px)}
  .m-dict .dict-btn.start{background:var(--purple,#8338ec);color:#fff}
  .m-dict .dict-btn.ghost{background:#fff;border:1px solid #e3e9f2;color:#7b8198}
  .m-dict .dict-btn.listen{background:#efe8fb;color:var(--purple,#8338ec);border:1px solid #e3e9f2}
  .m-dict .dict-btn.submit{background:var(--purple,#8338ec);color:#fff}
  .m-dict .dict-btn[disabled]{opacity:.45;cursor:not-allowed}
  .m-dict .dict-row{display:flex;gap:10px}
  .m-dict .dict-progress{font-size:13px;color:#7b8198;text-align:center;width:100%;max-width:460px;margin:0 auto 6px}
  .m-dict .dict-listen-big{width:100%;max-width:460px;margin:10px auto 4px;display:flex;justify-content:center}
  .m-dict .dict-bigplay{background:#efe8fb;color:var(--purple,#8338ec);border:1px solid #e3e9f2;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:800;cursor:pointer}
  .m-dict .dict-answer{width:100%;max-width:460px;margin:14px auto 6px}
  .m-dict .dict-answer input{width:100%;font-size:24px;font-weight:700;text-align:center;padding:14px 12px;border:2px solid #e3e9f2;border-radius:14px;color:var(--ink);font-family:inherit;text-transform:lowercase;transition:.12s}
  .m-dict .dict-answer input:focus{outline:none;border-color:var(--purple,#8338ec)}
  .m-dict .dict-answer input:disabled{background:#efe8fb;color:#7b8198}
  .m-dict .dict-feedback{min-height:24px;text-align:center;font-size:15px;font-weight:800;margin:8px auto;width:100%;max-width:460px}
  .m-dict .dict-feedback.ok{color:#1fae6b} .m-dict .dict-feedback.no{color:#e8553e}
  .m-dict .dict-reveal{width:100%;max-width:460px;margin:4px auto 8px;background:#efe8fb;border:1px solid #e3e9f2;border-radius:14px;padding:12px;text-align:center;font-size:14px;display:none}
  .m-dict .dict-reveal.show{display:block}
  .m-dict .dict-reveal .w{font-size:22px;font-weight:800;color:var(--purple,#8338ec)}
  .m-dict .dict-reveal .i{color:var(--blue,#2f6fed);font-size:16px;font-weight:700}
  .m-dict .dict-reveal .c{color:var(--ink)}
  .m-dict .dict-prow{display:flex;gap:10px;width:100%;max-width:460px;margin:6px auto 0}

<body>
<div class="wt-wrap">
  <div class="wt-head">
    <h1>🔤 单词训练</h1>
    <p id="wt-who">一个入口，认读 / 拼写 / 听写 / 拼读 全搞定</p>
  </div>

  <div class="wt-tabs" id="wt-tabs">
    <button class="wt-t on" data-m="read">🔤 认读</button>
    <button class="wt-t" data-m="spell">✍️ 拼写</button>
    <button class="wt-t" data-m="dict">🎧 听写</button>

  <div class="wt-tip">四个模块共用同一套词库与发音引擎，进度各自独立保存。<br>登录一次即可在四个标签间切换；右上角可切换账户。</div>
</div>

<script>
/* 全局发音代理：供拼读/认读等页面内联 onclick="speak(...)" 调用 */
window.speak = function (t, r) { if (window.Speech) Speech.speak(t, r); };

/* 逐字翻译：读取容器 data-en 懒构建词对词翻译，点击切换显隐 */
window.toggleGloss = function (id) {
  var el = document.getElementById(id); if (!el || !window.Gloss) return;
  if (el.getAttribute('data-filled') !== '1') {
    el.innerHTML = Gloss.buildPGlossHTML(el.getAttribute('data-en') || '');
    el.setAttribute('data-filled', '1');
  }
  el.classList.toggle('on');
};

/* ===================================================================
 * 认读模块（重写精简版，基于 WORD_BANK）
 * =================================================================== */
var ReadMod = (function () {
  var APP = 'wordtrain';
  var ME = null, root = null;
  var $ = function (id) { return document.getElementById('read-' + id); };
  var WORDS = (typeof WORD_BANK !== 'undefined') ? WORD_BANK : [];
  var GRADE_NAMES = {0:'幼儿园',1:'一年级',2:'二年级',3:'三年级',4:'四年级',5:'五年级',6:'六年级'};
  var gradeFilter = 'all', catFilter = 'all', list = [], idx = 0, cur = null, flipped = false;
  var masteredSet = new Set();

  function totalCount(){ return WORDS.length; }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }
  function cats(){ var s={}; WORDS.forEach(function(w){ if(w.cat) s[w.cat]=1; }); return Object.keys(s); }

  function loadMastered(){ try{ var a=Accounts.get(APP, ME, 'read', []); if(Array.isArray(a)) a.forEach(function(k){masteredSet.add(k);}); }catch(e){} }
  function saveMastered(){ try{ Accounts.set(APP, ME, 'read', Array.from(masteredSet)); }catch(e){} }
  function isMastered(w){ return masteredSet.has(w); }

  function buildList(){
    var arr = WORDS.filter(function(w){
      if(gradeFilter!=='all' && w.g!==gradeFilter) return false;
      if(catFilter!=='all' && w.cat!==catFilter) return false;
      return true;
    });
    if(!arr.length) arr = WORDS.slice();
    list = shuffle(arr.slice());
    idx = resumeReadIdx();
  }
  // 断点续学：优先回到上次正在学的那个词；否则跳到第一个还没"认识"的词
  function resumeReadIdx(){
    var w = (window.Resume ? Resume.get(APP, ME, 'read_w') : null);
    if(w){ for(var i=0;i<list.length;i++){ if(list[i].w===w) return i; } }
    for(var j=0;j<list.length;j++){ if(!isMastered(list[j].w)) return j; }
    return 0;
  }
  function renderChips(){
    var box=$('chips'); box.innerHTML='';
    var mk=function(label,val,on){ var b=document.createElement('button'); b.className='r-chip'+(on?' on':''); b.textContent=label; b.onclick=function(){ if(val===gradeFilter) return; gradeFilter=val; buildList(); renderChips(); loadCard(); }; box.appendChild(b); };
    mk('全部年级','all',gradeFilter==='all');
    for(var g=0;g<=6;g++) mk(GRADE_NAMES[g],g,gradeFilter===g);
    var cb=$('catchips'); cb.innerHTML='';
    var mkc=function(label,val,on){ var b=document.createElement('button'); b.className='r-chip'+(on?' on':''); b.textContent=label; b.onclick=function(){ if(val===catFilter) return; catFilter=val; buildList(); renderChips(); loadCard(); }; cb.appendChild(b); };
    mkc('全部分类','all',catFilter==='all');
    cats().forEach(function(c){ mkc(c,c,catFilter===c); });
  }
  function renderProgress(){
    var total=totalCount(), m=0; WORDS.forEach(function(w){ if(isMastered(w.w)) m++; });
    $('progtxt').textContent='已认识 '+m+' / '+total+' 词';
    renderTracker();
  }
  function renderTracker(){
    var box=$('tracker'); if(!box) return; box.innerHTML='';
    var shown=list.slice(0,120);
    shown.forEach(function(w){
      var d=document.createElement('div'); d.className='r-sq'+(isMastered(w.w)?' done':''); box.appendChild(d);
    });
  }
  function toast(t){ var el=$('toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){el.classList.remove('show');},1600); }
  function loadCard(){
    if(!list.length) return;
    cur=list[idx]; flipped=false;
    if(window.Resume) Resume.set(APP, ME, 'read_w', cur.w);
    $('flip').classList.remove('flipped');
    $('word').textContent=cur.w;
    $('ipa').textContent=cur.ipa||'';
    $('cat').textContent=(cur.cat||'单词')+(cur.g?(' · '+GRADE_NAMES[cur.g]):'')+(cur.pos?(' · '+cur.pos):'');
    $('cn').textContent=cur.cn||'';
    $('ex').innerHTML=(cur.ex?('<div class="en">'+cur.ex+'</div>'):'')+(cur.exc?('<div class="cn">'+cur.exc+'</div>'):'');
    var rg=document.getElementById('read-exGloss'); if(rg){ rg.setAttribute('data-en', cur.ex||''); rg.removeAttribute('data-filled'); rg.classList.remove('on'); }
    var done=isMastered(cur.w);
    var mb=$('mastered'); mb.classList.toggle('done',done); mb.textContent=done?'✅ 已认识':'○ 标记认识';
    $('pos').textContent='第 '+(idx+1)+' / '+list.length+' 词';
  }
  function speakWord(){ if(cur && window.Speech) Speech.speak(cur.w,0.9); }
  function speakSlow(){ if(cur && window.Speech) Speech.speak(cur.w,0.6); }
  function flip(){ flipped=!flipped; $('flip').classList.toggle('flipped',flipped); }
  function toggleMastered(){ if(!cur) return; if(masteredSet.has(cur.w)) masteredSet.delete(cur.w); else masteredSet.add(cur.w); saveMastered(); renderProgress(); loadCard(); toast(masteredSet.has(cur.w)?'已标记为认识 ✅':'已取消'); }
  function next(){ if(idx<list.length-1){ idx++; loadCard(); } else toast('本轮结束，换批词 🎉'); }
  function prev(){ if(idx>0){ idx--; loadCard(); } }
  function mount(user, r){
    root=r; ME=user;
    if(window.StudyTime) try{ StudyTime.track(ME,'wordtrain-read'); }catch(e){}
    r.innerHTML = '<div class="m-read">'
      + '<div class="r-bar"><span class="r-chip" style="cursor:default">📚 年级 / 分类</span></div>'
      + '<div class="r-chips" id="read-chips"></div>'
      + '<div class="r-chips" id="read-catchips"></div>'
      + '<div class="r-tracker" id="read-tracker"></div><div id="read-progtxt" style="font-size:13px;color:var(--sub);text-align:center;margin:2px 0 14px"></div>'
      + '<div class="r-main">'
      +   '<div class="r-stage"><div class="r-flip" id="read-flip"><div class="r-inner">'
      +     '<div class="r-face r-front">'
      +       '<span class="r-cat" id="read-cat"></span>'
      +       '<div class="r-word" id="read-word"></div>'
      +       '<div class="r-ipa" id="read-ipa"></div>'
      +       '<div class="r-cn" id="read-cn"></div>'
      +       '<div class="r-ex" id="read-ex"></div>'
      +       '<div class="r-speak-row" style="margin-top:10px">'
      +         '<button class="r-speak" style="background:#ff7a59;box-shadow:0 6px 14px rgba(255,122,89,.3)" onclick="toggleGloss(\'read-exGloss\')">🔤 逐字翻译</button>'
      +       '</div>'
      +       '<div class="pgloss" id="read-exGloss" style="margin:0 0 6px"></div>'
      +       '<div class="r-speak-row">'
      +         '<button class="r-speak" onclick="__read.speakWord()">🔊 听发音</button>'
      +         '<button class="r-speak slow" onclick="__read.speakSlow()">🐢 慢速</button>'
      +       '</div>'
      +       '<div class="r-nav">'
      +         '<button onclick="__read.prev()">← 上一个</button>'
      +         '<button onclick="__read.flip()">🔄 翻转看中文</button>'
      +         '<button onclick="__read.next()">下一个 →</button>'
      +       '</div>'
      +       '<button class="r-nav r-mastered" id="read-mastered" onclick="__read.toggleMastered()" style="margin-top:10px"></button>'
      +       '<div id="read-pos" style="text-align:center;font-size:12px;color:var(--sub);margin-top:8px"></div>'
      +     '</div>'
      +     '<div class="r-face r-back">'
      +       '<span class="r-cat">中文 / 例句</span>'
      +       '<div class="r-word" id="read-word2"></div>'
      +       '<div class="r-cn" id="read-cn2"></div>'
      +       '<div class="r-ex" id="read-ex2"></div>'
      +     '</div>'
      +   '</div></div></div>'
      +   '<div class="r-panel"><div class="r-grid" id="read-grid"></div></div>'
      + '</div>'
      + '<div class="r-toast" id="read-toast"></div>';
    // 背面上也填内容
    loadMastered();
    renderChips();
    buildList();
    loadCard();
    renderProgress();
    // 背面同步
    var syncBack=function(){ $('word2').textContent=cur?cur.w:''; $('cn2').textContent=cur?cur.cn:''; $('ex2').innerHTML=cur?((cur.ex?('<div class="en">'+cur.ex+'</div>'):'')+(cur.exc?('<div class="cn">'+cur.exc+'</div>'):'')):''; };
    var _loadCard=loadCard;
    loadCard=function(){ _loadCard(); syncBack(); renderGrid(); renderTracker(); };
    loadCard();
    renderGrid();
  }
  function renderGrid(){
    var box=$('grid'); box.innerHTML='';
    list.forEach(function(w,i){
      var d=document.createElement('div'); d.className='r-cell'+(i===idx?' on':'')+(isMastered(w.w)?' done':'');
      d.innerHTML='<div class="cw">'+w.w+'</div><div class="ci">'+(w.cn||'')+'</div><div class="chk">✓</div>';
      d.onclick=function(){ idx=i; loadCard(); renderGrid(); };
      box.appendChild(d);
    });
  }
  window.__read = { speakWord:speakWord, speakSlow:speakSlow, flip:flip, toggleMastered:toggleMastered, next:next, prev:prev };
  return { mount: mount };
})();

/* ===================================================================
 * 拼写模块（移植自 单词拼写学习卡.html）
 * =================================================================== */
var SpellMod = (function () {
  var APP = 'spell';
  var ME = null, root = null;
  var $ = function (id) { return document.getElementById('spell-' + id); };
  var WORDS = (typeof WORD_BANK !== 'undefined') ? WORD_BANK : [];
  var GRADE_NAMES = {0:'幼儿园',1:'一年级',2:'二年级',3:'三年级',4:'四年级',5:'五年级',6:'六年级'};
  var _voices=[], engVoice=null, prefVoice='';
  var gradeFilter='all', mode='study', list=[], idx=0, cur=null, slots=[], sel=0, hintCount=0, solved=false;
  var stats={practiced:0,correct:0,wrong:0}, review=[];

  function loadVoices(){
    _voices = speechSynthesis.getVoices();
    var en = _voices.filter(function(v){ return /^en/i.test(v.lang||''); });
    /* 2026-08-25：与 speech.js 同口径——顶级音色加分、老旧机械音（David/Zira Desktop）降权 */
    var score = function(v){ var s=0; var n=(v.name||'')+' '+(v.lang||'');
      if(/en-(US|GB|UK|AU|CA)/i.test(n)) s+=5;
      if(/Google/i.test(n)) s+=10;
      if(/Natural|Neural/i.test(n)) s+=9;
      if(/Online/i.test(n)) s+=3;
      if(/Samantha|Karen|Daniel|Moira|Serena|Tessa|Fiona|Ava|Allison/i.test(n)) s+=7;
      if(/Enhanced|Premium/i.test(n)) s+=5;
      if(/Desktop/i.test(n)) s-=8;
      if(/David|Zira|Hazel/i.test(n) && !/Natural|Neural/i.test(n)) s-=6;
      return s; };
    en.sort(function(a,b){return score(b)-score(a);});
    engVoice = en[0]||null;
    if(prefVoice){ var p=_voices.find(function(v){return v.voiceURI===prefVoice;}); if(p) engVoice=p; }
    renderVoiceSel();
  }
  function speak(text,rate){
    if(!('speechSynthesis' in window)) return;
    try{
      if(!engVoice && _voices.length) loadVoices();
      var u=new SpeechSynthesisUtterance(text);
      u.lang='en-US'; u.rate=rate||0.85;
      if(engVoice) u.voice=engVoice;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){}
  }
  function renderVoiceSel(){
    var sel=$('voiceSel'); if(!sel) return;
    var en=_voices.filter(function(v){return /^en/i.test(v.lang||'');});
    sel.innerHTML='';
    var def=document.createElement('option'); def.value=''; def.textContent='默认音色'; sel.appendChild(def);
    en.forEach(function(v){ var o=document.createElement('option'); o.value=v.voiceURI; o.textContent=(v.name||v.lang)+' ('+v.lang+')'; sel.appendChild(o); });
    sel.value=prefVoice;
  }
  function onVoiceChange(){ prefVoice=$('voiceSel').value; Accounts.set(APP, ME, 'voice', prefVoice); if(prefVoice){ var p=_voices.find(function(v){return v.voiceURI===prefVoice;}); if(p) engVoice=p; } speak(cur?cur.w:'hello',0.9); }
  function loadStats(){ return Accounts.get(APP, ME, 'stats', {practiced:0,correct:0,wrong:0}); }
  function saveStats(){ Accounts.set(APP, ME, 'stats', stats); }
  function loadReview(){ return Accounts.get(APP, ME, 'review', []); }
  function saveReview(){ Accounts.set(APP, ME, 'review', review); }
  function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function buildList(){
    var arr = WORDS.filter(function(w){ return gradeFilter==='all' || w.g===gradeFilter; });
    if(!arr.length) arr = WORDS.slice();
    list = shuffle(arr.slice());
    idx = resumeSpellIdx();
  }
  // 断点续学：回到上次正在拼的那个词（列表是打乱的，用单词本身定位）
  function resumeSpellIdx(){
    var w = (window.Resume ? Resume.get(APP, ME, 'spell_w') : null);
    if(w){ for(var i=0;i<list.length;i++){ if(list[i].w===w) return i; } }
    return 0;
  }
  function gradeCount(g){ return WORDS.filter(function(w){ return gradeFilter==='all'? true : w.g===gradeFilter; }).length; }
  function wordToSlots(w){ return w.split('').map(function(c){ if(c===' '||c==='-') return {ch:c,sep:true,locked:true}; return {ch:'',sep:false,locked:false}; }); }
  function typeableCount(){ return slots.filter(function(s){return !s.sep;}).length; }
  function assemble(){ return slots.map(function(s){return s.ch;}).join(''); }
  function renderGrades(){
    var box=$('grades'); box.innerHTML='';

      +'<div class="dict-last" id="dict-lastBox">暂无上次成绩记录。</div>'
      +'<button class="dict-btn dict-start" onclick="__dict.startPractice()">▶ 开始练习</button></section>'
      +'<section class="dict-card" id="dict-practice" hidden><div class="dict-progress" id="dict-progress">—</div><div class="dict-listen-big"><button class="dict-bigplay" onclick="__dict.playWord()">🔊 再听一次</button></div>'
      +'<div class="dict-answer"><input id="dict-ans" type="text" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="听发音，写出单词…"></div>'
      +'<div class="dict-feedback" id="dict-feedback"></div><div class="dict-reveal" id="dict-reveal"></div>'
      +'<div class="dict-prow"><button class="dict-btn dict-ghost" onclick="__dict.quitToSetup()">✕ 退出</button><button class="dict-btn dict-submit" id="dict-btnSubmit" onclick="__dict.submit()">✓ 提交</button></div>'
      +'<div class="dict-prow" id="dict-nextRow" hidden><button class="dict-btn dict-start" id="dict-btnNext" onclick="__dict.nextQuestion()">下一题 →</button></div></section>'
      +'<section class="dict-card" id="dict-result" hidden><div class="dict-sec-t">练习完成 🎉</div><div class="dict-score-big" id="dict-scoreBig">0%</div><div class="dict-score-sub" id="dict-scoreSub"></div>'

/* ===================================================================
 * 拼读模块（移植自 自然拼读串记卡.html）
 * =================================================================== */
var PhonMod = (function(){
  var APP='phonics'; var ME=null, root=null;
  var $ = function(id){ return document.getElementById('phon-'+id); };
  var PH = (window.PHONICS && window.PHONICS.length)?window.PHONICS:[];
  var curIdx=0, coreOnly=false, masteredSet=new Set();
  function totalWords(){ var n=0; PH.forEach(function(g){ g.families.forEach(function(f){ n+=f.words.length; }); }); return n; }
  function coreWords(){ var n=0; PH.forEach(function(g){ g.families.forEach(function(f){ f.words.forEach(function(w){ if(w.core) n++; }); }); }); return n; }
  function loadMastered(){ try{ var a=Accounts.get(APP,ME,'mastered',[]); if(Array.isArray(a)) a.forEach(function(k){ masteredSet.add(k); }); }catch(e){} }
  function saveMastered(){ try{ Accounts.set(APP,ME,'mastered',Array.from(masteredSet)); }catch(e){} }
  function isMastered(key){ return masteredSet.has(key); }
  function updateStats(){
    var total=totalWords(), core=coreWords(); var m=0;
    PH.forEach(function(g){ g.families.forEach(function(f){ f.words.forEach(function(w){ if(isMastered(g.id+'|'+w.w)) m++; }); }); });
    $('stM').textContent=m; $('stT').textContent=total; $('stC').textContent=coreMasteredCount(); $('stCT').textContent=core;
    var pct=total?Math.round(m/total*100):0; $('pgBar').style.width=pct+'%';
  }
  function coreMasteredCount(){ var n=0; PH.forEach(function(g){ g.families.forEach(function(f){ f.words.forEach(function(w){ if(w.core && isMastered(g.id+'|'+w.w)) n++; }); }); }); return n; }
  function renderTabs(){
    var h=''; PH.forEach(function(g,i){ var cls=(g.kind==='长元音'?'long':'short')+(i===curIdx?' on':''); h+='<div class="pn-tab '+cls+'" onclick="__phon.selectVowel('+i+')"><div class="L">'+g.letter+'</div><div class="S">'+g.sound+'</div></div>'; }); $('tabs').innerHTML=h;
  }
  function selectVowel(i){ curIdx=i; renderTabs(); renderFamilies(); }
  function renderFamilies(){
    var g=PH[curIdx]; var box=$('families'); var html='';
    g.families.forEach(function(f){
      var words=f.words.filter(function(w){ return !coreOnly||w.core; });
      if(!words.length) return;
      html+='<div class="pn-fam"><div class="pn-fam-h"><span class="pn-rime">'+f.rime+'</span><span class="pn-fam-hint">'+g.letter+' + '+f.rime.slice(1)+'</span></div><div class="pn-words">';
      words.forEach(function(w){
        var key=g.id+'|'+w.w; var on=isMastered(key)?' on':''; var core=w.core?'<span class="core">核心</span>':'';
        html+='<div class="pn-wchip'+on+'" onclick="__phon.speak(\''+w.w+'\')"><span class="ws">🔊</span><span class="ww">'+w.w+'</span><span class="wipa">'+w.ipa+'</span><span class="wcn">'+w.cn+'</span>'+core+'<span class="wmark" onclick="event.stopPropagation();__phon.toggleMastered(\''+key+'\')"></span></div>';
      });
      html+='</div></div>';
    });
    if(!html) html='<div class="pn-empty">该音素下没有核心词 🤔</div>';
    box.innerHTML=html;
  }
  function toggleMastered(key){ if(masteredSet.has(key)) masteredSet.delete(key); else masteredSet.add(key); saveMastered(); renderFamilies(); updateStats(); }
  function toggleCore(){ coreOnly=!coreOnly; $('btnCore').classList.toggle('on',coreOnly); renderFamilies(); }
  function playSeq(arr){ if(!arr.length) return; speak(arr[0],0.8); if(arr.length>1) setTimeout(function(){ playSeq(arr.slice(1)); },720); }
  function speakAll(){ var g=PH[curIdx], arr=[]; g.families.forEach(function(f){ f.words.forEach(function(w){ if(!coreOnly||w.core) arr.push(w.w); }); }); playSeq(arr); }
  function mount(user, r){
    root=r; ME=user;
    if(window.StudyTime) try{ StudyTime.track(ME,'phonics'); }catch(e){}
    r.innerHTML='<div class="m-phon">'
      +'<div class="pn-topbar"><div class="pn-title">自然拼读串记卡<small>元音音素 · 词族串记 · 点词跟读</small></div><div class="pn-voice"><span>🔊</span><select id="phon-voiceSel"><option>加载中…</option></select></div></div>'
      +'<div class="pn-stats"><span class="pn-chip">已掌握 <b id="phon-stM">0</b>/<b id="phon-stT">0</b></span><span class="pn-chip">核心词 <b id="phon-stC">0</b>/<b id="phon-stCT">0</b></span></div>'
      +'<div class="pn-progress"><div class="bar" id="phon-pgBar"></div></div>'
      +'<div class="pn-legend"><span><i class="s"></i>短元音</span><span><i class="l"></i>长元音（magic e）</span></div>'
      +'<div class="pn-tabs" id="phon-tabs"></div>'
      +'<div class="pn-toolbar"><button class="pn-tbtn" id="phon-btnAll" onclick="__phon.speakAll()">🔊 全族朗读</button><button class="pn-tbtn" id="phon-btnCore" onclick="__phon.toggleCore()">只看核心词</button></div>'
      +'<main id="phon-families"></main><div class="pn-tip">点单词听发音，点右侧 ○ 标记为「已会」（绿色）。进度自动按账户保存。</div></div>';
    loadMastered(); renderTabs(); renderFamilies(); updateStats(); $('btnCore').classList.toggle('on',coreOnly);
  }
  window.__phon={ selectVowel:selectVowel, speak:function(w){ if(window.Speech) Speech.speak(w,0.85); }, toggleMastered:toggleMastered, toggleCore:toggleCore, speakAll:speakAll };
  return { mount: mount };
})();

/* ===================== 宿主：单登录 + 标签切换 ===================== */
(function(){
  var APP='wordtrain';
  var ME=null, currentMode='read';
  var MODS={ read:ReadMod, spell:SpellMod, dict:DictMod, phon:PhonMod };
  var mounted={};
  function activate(m){
    currentMode=m;
    ['read','spell','dict','phon'].forEach(function(k){
      var p=document.getElementById('pane-'+k); if(!p) return;
      if(k===m){ p.classList.add('on'); if(!mounted[k]){ mounted[k]=true; MODS[k].mount(ME, p); } }
      else p.classList.remove('on');
    });
    [].forEach.call(document.querySelectorAll('.wt-t'), function(b){ b.classList.toggle('on', b.getAttribute('data-m')===m); });
  }
  document.getElementById('wt-tabs').addEventListener('click', function(e){ var b=e.target.closest('.wt-t'); if(!b) return; activate(b.getAttribute('data-m')); });
  Accounts.gate(APP, { onLogin:function(user){
    ME=user; var u=Accounts.byId(user);
    document.getElementById('wt-who').textContent='当前：'+u.emoji+' '+u.name+' · 在四个标签间切换无需重复登录';
    Accounts.mountSwitch(APP);
    var sw=document.getElementById('accSwitch');
    if(sw){ sw.onclick=function(){
      ['read','spell','dict','phon'].forEach(function(k){ var p=document.getElementById('pane-'+k); if(p) p.innerHTML=''; });
      mounted={}; Accounts.current=null;
      var s=document.getElementById('accSwitch'); if(s&&s.parentNode) s.parentNode.removeChild(s);
      Accounts.gate(APP, { onLogin:function(u2){ ME=u2; var u3=Accounts.byId(u2); document.getElementById('wt-who').textContent='当前：'+u3.emoji+' '+u3.name+' · 在四个标签间切换无需重复登录'; Accounts.mountSwitch(APP); activate(currentMode); } });
    }; }
    activate('read');
  } });
})();
</script>
