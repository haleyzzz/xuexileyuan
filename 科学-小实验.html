<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>🔬 科学小实验</title>
<style>
  :root{
    --green:#06d6a0; --blue:#4cc9f0; --purple:#b292ff; --yellow:#ffd166;
    --orange:#ff9f1c; --pink:#ff8fab; --ink:#3d3a4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#eafff7,#eef4ff);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);
    border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  header{background:linear-gradient(120deg,var(--green),var(--purple));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(6,214,160,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--green)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}

  .exps{display:flex;flex-direction:column;gap:12px}
  .exp{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);
    overflow:hidden;border:3px solid transparent;transition:border-color .2s}
  .exp.done{border-color:var(--green)}
  .efront{padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer}
  .efront .eemoji{font-size:38px;flex-shrink:0}
  .efront .etxt{flex:1}
  .efront .ename{font-size:16px;font-weight:800}
  .efront .emats{font-size:12px;color:#aaa;margin-top:3px;line-height:1.5}
  .efront .earrow{font-size:22px;color:var(--purple);flex-shrink:0}
  .eback{padding:4px 16px 16px}
  .eback .row{margin:10px 0}
  .eback .row b{display:inline-block;font-size:13px;color:#fff;background:var(--blue);
    border-radius:999px;padding:2px 10px;margin-bottom:4px}
  .eback .row .v{font-size:14px;color:#555;line-height:1.6}
  .eback .why .v{color:var(--purple)}
  .ebtns{display:flex;gap:10px;margin-top:8px}
  .ebtns button{flex:1;border:none;border-radius:14px;padding:10px;font-size:14px;
    font-family:inherit;cursor:pointer;font-weight:700;color:#fff}
  .b-back{background:var(--blue)}
  .b-flip{background:var(--purple)}
  .emark{width:100%;border:none;border-top:1px solid #f0f0f0;background:#fff;
    padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#bbb}
  .exp.done .emark{color:var(--green);background:#eafff6}
  .mark-ic{display:inline-block;width:20px}

  .progress{height:14px;background:#e0f5ee;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}
  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;
    text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--green);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
</style>
</head>
<body>



<header>
  <h1>🔬 科学小实验</h1>
  <div class="date" id="dateStr">今天</div>
</header>

<div class="stats">
  <div class="stat"><div class="num" id="doneNum">0</div><div class="lbl">✅ 做过</div></div>
  <div class="stat"><div class="num" id="totalNum">0</div><div class="lbl">📦 实验总数</div></div>
  <div class="stat"><div class="num" id="pctNum">0%</div><div class="lbl">📈 完成度</div></div>
</div>

<h2>🧪 动手做实验</h2>
<div class="exps" id="exps"></div>

<div class="progress"><i id="progBar"></i></div>
<div class="prog-txt" id="progTxt">完成 0 / 0 个</div>

<button class="reset" onclick="resetAll()">↺ 重置所有标记</button>
<div class="tip">每个实验都用家里现成的材料，在爸妈陪同下做最安全 🛡️<br>数据按小朋友分别保存，不会上传。</div>

<div class="celebrate" id="celeb">
  <div class="box2">
    <h3>🎉 小小科学家！</h3>
    <p>52 个实验全做过啦，你已经是真正的科学探险家！</p>
    <button onclick="closeCeleb()">继续探索 💪</button>
  </div>
</div>

<script>
var EXPERIMENTS=[
  {id:'milk',emoji:'🌈',name:'彩虹牛奶',mats:['牛奶','食用色素','洗洁精','盘子','棉签'],
    steps:'盘里倒一层薄薄的牛奶，滴几滴不同颜色的色素，棉签蘸一点洗洁精轻点牛奶中心。',
    pheno:'色素像烟花一样向四周炸开，画出彩色花纹。',
    why:'洗洁精破坏了牛奶表面的张力，带着色素快速扩散开来。'},
  {id:'volcano',emoji:'🌋',name:'苏打火山',mats:['小苏打','白醋','杯子','盘子','色素'],
    steps:'杯里放一勺小苏打，滴几滴色素，缓缓倒入白醋。',
    pheno:'冒出大量泡泡，顺着杯壁溢出来像火山喷发。',
    why:'小苏打（碳酸氢钠）和醋（酸）反应，生成二氧化碳气体。'},
  {id:'needle',emoji:'🪡',name:'浮针不沉',mats:['一碗水','一根针','纸巾'],
    steps:'把针轻轻放在纸巾上，连纸一起平放到水面，等纸巾慢慢沉下去。',
    pheno:'纸巾沉了，针却稳稳浮在水面上。',
    why:'水的表面张力像一张看不见的薄膜，托住了又轻又平的针。'},
  {id:'egg',emoji:'🥚',name:'盐水浮蛋',mats:['清水','盐','生鸡蛋','杯子'],
    steps:'杯里装清水放入鸡蛋（会沉底），一勺一勺加盐搅拌，直到鸡蛋浮起。',
    pheno:'盐水越来越浓，鸡蛋慢慢浮到了水面。',
    why:'加盐后水的密度变大，超过鸡蛋密度就能把它托起来。'},
  {id:'balloon',emoji:'🧲',name:'气球吸纸',mats:['气球','碎纸片'],
    steps:'气球在头发上快速摩擦几十下，靠近桌上的碎纸片。',
    pheno:'碎纸片被气球吸了起来。',
    why:'摩擦使气球带上静电，能吸引轻小的纸屑。'},
  {id:'coin',emoji:'💡',name:'硬币消失',mats:['玻璃杯','水','硬币'],
    steps:'硬币放桌上，杯子倒扣压住它，从杯口缓缓倒满水，斜着从侧面看。',
    pheno:'从某个角度看，硬币好像“消失”了。',
    why:'光从水进入空气时发生折射，角度够大时全部反射，就看不见硬币了。'},
  {id:'hot',emoji:'🌡️',name:'热水往上飘',mats:['冷热水各一杯','色素','硬纸片'],
    steps:'热水杯加色素倒扣在冷水杯上，抽掉中间的硬纸片。',
    pheno:'带颜色的热水向上穿过冷水升起。',
    why:'热水密度小、冷水密度大，所以热水会浮在冷水上面。'},
  {id:'seed',emoji:'🌱',name:'种子发芽',mats:['绿豆或黄豆','湿纸巾','密封袋'],
    steps:'种子放湿纸巾上卷起来，装进密封袋，放温暖窗台，每天观察。',
    pheno:'几天后冒出白根和小芽。',
    why:'种子吸足水分、温度合适就会萌发长大。'},
  {id:'lemon',emoji:'🫧',name:'柠檬气泡',mats:['柠檬','小苏打','小勺'],
    steps:'柠檬切半挖个小坑，放一小勺小苏打，挤柠檬汁进去。',
    pheno:'坑里冒出许多小气泡。',
    why:'柠檬酸遇到小苏打，反应放出了二氧化碳。'},
  {id:'ice',emoji:'🧊',name:'提冰的线',mats:['冰块','细线','盐','杯子'],
    steps:'线横搭在冰块上，在线和冰接触的地方撒点盐，等十几秒轻轻提线。',
    pheno:'线像被冻住一样，能把冰块提起来。',
    why:'盐让冰局部融化，水再结冰时就把线粘住了。'},
  {id:'steth',emoji:'🔔',name:'纸杯听诊器',mats:['气球','纸筒','胶带'],
    steps:'气球剪开绷紧贴在纸筒一端当鼓膜，另一端贴耳朵听自己胸口。',
    pheno:'心跳“咚咚”声被放大了。',
    why:'心跳的振动通过固体（纸筒）传导，比空气传得更清楚。'},
  {id:'layer',emoji:'🌊',name:'彩虹分层',mats:['白糖','水','色素（红黄蓝）','几个杯子'],
    steps:'调出由稀到浓的糖水各加一种颜色，用勺子背慢慢一层层叠放。',
    pheno:'不同颜色分层不混，像一道彩虹。',
    why:'糖水浓度不同密度就不同，浓的沉在下面、稀的浮在上面。'},

  /* ===== 补充实验 ===== */
  {id:'paper',emoji:'🧻',name:'纸片托水',mats:['玻璃杯','水','硬纸片'],
    steps:'杯子装满水，盖一张硬纸片，用手压住迅速倒扣。',
    pheno:'松开手，纸片托着水不掉下来。',
    why:'大气压从下面托住纸片，比杯里水压更强。'},
  {id:'chopstick',emoji:'🥢',name:'筷子折了',mats:['筷子','水','玻璃杯'],
    steps:'杯里装半杯水，斜着把筷子插进去，从侧面看。',
    pheno:'筷子像在水面处折断了。',
    why:'光从水进入空气发生折射，看起来位置偏了。'},
  {id:'balloon2',emoji:'🎈',name:'气球分开',mats:['两个气球','绳子'],
    steps:'吹两个气球绑好，相距几厘米，同时向中间吹气。',
    pheno:'两个气球反而向两边分开。',
    why:'中间气流快压强小，外侧空气把它们推开（伯努利原理）。'},
  {id:'egg2',emoji:'🥚',name:'醋泡鸡蛋',mats:['生鸡蛋','白醋','杯子'],
    steps:'鸡蛋放进杯子，倒满白醋没过鸡蛋，放一晚。',
    pheno:'蛋壳冒泡变软，能轻轻捏扁。',
    why:'醋和蛋壳的碳酸钙反应，把硬壳溶解掉了。'},
  {id:'arrow',emoji:'➡️',name:'箭头反向',mats:['玻璃杯','水','画箭头的纸'],
    steps:'纸上画个向右的箭头，杯装水后把纸放杯后看。',
    pheno:'箭头看起来朝左了。',
    why:'水杯像凸透镜，水让光的折射把像颠倒了。'},
  {id:'sugar',emoji:'🍬',name:'糖不见了',mats:['温水','白糖','勺子'],
    steps:'温水里加一勺白糖，搅拌一会儿。',
    pheno:'糖慢慢消失，水变甜了。',
    why:'糖溶解在水里，变成看不见的微小颗粒分散开。'},
  {id:'magnet',emoji:'🧲',name:'磁铁寻宝',mats:['磁铁','混合的米和小铁钉'],
    steps:'把磁铁伸进米和铁钉混合物里搅一搅。',
    pheno:'铁钉被吸到磁铁上，米粒留下。',
    why:'磁铁只吸引铁等铁磁物质，不吸米。'},
  {id:'shadow',emoji:'🖐️',name:'手影戏',mats:['手电筒','白墙'],
    steps:'关灯，手电照向白墙，用手摆出小动物形状。',
    pheno:'墙上出现小狗、兔子等影子。',
    why:'光被手挡住，墙上没照到的地方就成了影子。'},
  {id:'heat',emoji:'🥄',name:'勺子传热',mats:['金属勺','热水','黄油'],
    steps:'勺柄抹一点黄油，把勺头浸进热水里等一会儿。',
    pheno:'黄油慢慢融化往勺柄流。',
    why:'金属导热快，把热从勺头传到勺柄。'},
  {id:'float',emoji:'⛵',name:'橡皮泥船',mats:['橡皮泥','水','碗'],
    steps:'把橡皮泥捏成碗状小船，轻轻放水面。',
    pheno:'捏成块的橡皮泥会沉，捏成船却能浮。',
    why:'船形排开更多水，浮力变大就浮起来了。'},
  {id:'capillary',emoji:'🧻',name:'纸巾爬水',mats:['纸巾','水','色素','两个杯子'],
    steps:'一杯装彩色水，纸巾一头浸水里，另一头搭到空杯。',
    pheno:'彩色水沿纸巾爬到空杯里。',
    why:'毛细现象：水顺着纸巾纤维的细小缝隙往上爬。'},
  {id:'bubble',emoji:'🫧',name:'自制泡泡',mats:['洗洁精','水','甘油','吸管'],
    steps:'洗洁精加水加一点甘油调匀，用吸管蘸着吹。',
    pheno:'吹出又大又不易破的泡泡。',
    why:'甘油让水膜更韧，洗洁精降低表面张力形成泡泡。'}
  ,{id:'paperwipe',emoji:'📄',name:'不会湿的纸',mats:['纸团','杯子','水盆'],steps:'纸团塞杯底，杯口朝下竖直压入水中再取出。',pheno:'纸团是干的。',why:'杯内空气把水挡住，纸碰不到水。'}
  ,{id:'minivolcano',emoji:'🌋',name:'迷你火山',mats:['小苏打','醋','色素','小瓶'],steps:'瓶里放小苏打，倒色素水，再加醋。',pheno:'冒出许多气泡像岩浆涌出。',why:'小苏打和醋反应产生二氧化碳气体。'}
  ,{id:'floatneedle',emoji:'📍',name:'漂浮的针',mats:['水','针','叉子'],steps:'用叉子托住针轻轻放在水面，慢慢抽走叉子。',pheno:'针竟然浮在水面上不沉。',why:'水的表面张力像一层膜，能托住很轻的针。'}
  ,{id:'balloonstatic',emoji:'🎈',name:'气球吸纸',mats:['气球','碎纸屑'],steps:'气球在头发上摩擦几下，靠近碎纸屑。',pheno:'纸屑被吸到气球上。',why:'摩擦起电，带电的气球吸引轻小的纸屑。'}
  ,{id:'waterlens',emoji:'💧',name:'水滴放大镜',mats:['水','透明塑料膜','报纸'],steps:'膜上滴一滴水，放在字上从上方看。',pheno:'字变大了。',why:'圆圆的水珠像凸透镜，会把光会聚放大。'}
  ,{id:'saltcry2',emoji:'🧂',name:'盐的结晶',mats:['盐','热水','棉线'],steps:'盐溶于热水至饱和，线悬挂其中晾干。',pheno:'线上结出一颗颗盐粒。',why:'水蒸发后，溶解的盐重新结晶析出。'}
  ,{id:'pepper2',emoji:'🌶️',name:'胡椒快跑',mats:['碗水','胡椒粉','洗洁精'],steps:'水面撒一层胡椒粉，中间滴一滴洗洁精。',pheno:'胡椒粉迅速向四周散开。',why:'洗洁精破坏了水的表面张力，胡椒被拉着散开。'}
  ,{id:'eggdiff',emoji:'🥚',name:'生熟鸡蛋',mats:['生鸡蛋','熟鸡蛋'],steps:'两个蛋同时在桌上转，看哪个转得稳。',pheno:'熟蛋转得稳又久，生蛋晃。',why:'熟蛋内部凝固成一个整体，生蛋内部是液体。'}
  ,{id:'sprout2',emoji:'🌱',name:'种子发芽',mats:['绿豆','湿纸巾','密封袋'],steps:'湿纸巾包住豆子放进袋，放温暖处几天。',pheno:'豆子长出白嫩的小芽。',why:'有水、空气和适宜温度，种子就会萌发。'}
  ,{id:'thermo2',emoji:'🌡️',name:'自制温度计',mats:['小瓶','水','吸管','色素'],steps:'瓶里装色水插吸管塞紧，手捂瓶身。',pheno:'吸管里的水柱往上升。',why:'水受热膨胀，体积变大就沿吸管上升。'}
  ,{id:'magnetpaper',emoji:'🧲',name:'隔纸控铁',mats:['磁铁','铁钉','纸'],steps:'纸下放铁钉，磁铁在纸上方移动。',pheno:'铁钉跟着磁铁走。',why:'磁力能穿过纸吸引铁。'}
  ,{id:'iodine2',emoji:'🧪',name:'会变色的碘',mats:['碘酒','淀粉','维C片'],steps:'碘酒滴淀粉变蓝，再撒维C粉。',pheno:'蓝色慢慢退去。',why:'维C能把碘还原，蓝色就消失了。'}
  ,{id:'ricedance',emoji:'🍚',name:'跳舞的米',mats:['碗水','米粒','洗洁精'],steps:'水面撒几粒米，中间滴洗洁精。',pheno:'米粒乱蹦像跳舞。',why:'表面张力变化推动轻小的米粒。'}

function render(){
  var html='';
  EXPERIMENTS.forEach(function(e,i){
    var done=isDone(e.id);
    html+='<div class="exp'+(done?' done':'')+'" id="exp-'+i+'">'+
      '<div class="efront" onclick="flip('+i+')">'+
        '<span class="eemoji">'+e.emoji+'</span>'+
        '<div class="etxt"><div class="ename">'+e.name+'</div>'+
        '<div class="emats">🧰 '+e.mats.join(' · ')+'</div></div>'+
        '<span class="earrow">👉</span>'+
      '</div>'+
      '<div class="eback" id="back-'+i+'" hidden>'+
        '<div class="row"><b>步骤</b><div class="v">'+e.steps+'</div></div>'+
        '<div class="row"><b>现象</b><div class="v">'+e.pheno+'</div></div>'+
        '<div class="row why"><b>原理</b><div class="v">'+e.why+'</div></div>'+
        '<div class="ebtns"><button class="b-back" onclick="flip('+i+')">⬅️ 收起</button>'+
        '<button class="b-flip" onclick="nextExp('+i+')">下一个 ➡️</button></div>'+
      '</div>'+
      '<button class="emark" onclick="mark('+i+')">'+
        '<span class="mark-ic">'+(done?'✅':'⬜')+'</span>'+(done?' 已做过':' 标记做过')+'</button>'+
    '</div>';
  });
  document.getElementById('exps').innerHTML=html;
  updateStats();
}
function flip(i){
  var b=document.getElementById('back-'+i);
  if(b.hidden){ b.hidden=false; document.getElementById('exp-'+i).querySelector('.efront .earrow').textContent='👆'; }
  else { b.hidden=true; document.getElementById('exp-'+i).querySelector('.efront .earrow').textContent='👉'; }
}
function nextExp(i){
  flip(i);
  var n=(i+1)%EXPERIMENTS.length;
  setTimeout(function(){ flip(n); document.getElementById('exp-'+n).scrollIntoView({behavior:'smooth',block:'center'}); },120);
}
function mark(i){
  var e=EXPERIMENTS[i];
  var store=getStore();
  if(store[e.id]){ delete store[e.id]; } else { store[e.id]=Date.now(); }
  setStore(store);
  render();
  if(Object.keys(getStore()).length===EXPERIMENTS.length){ celebrate(); }
}
function updateStats(){
  var done=Object.keys(getStore()).length, total=EXPERIMENTS.length, pct=total?Math.round(done/total*100):0;
  document.getElementById('doneNum').textContent=done;
  document.getElementById('totalNum').textContent=total;
  document.getElementById('pctNum').textContent=pct+'%';
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent='完成 '+done+' / '+total+' 个';
}
function resetAll(){ if(confirm('确定清空所有“做过”标记？')){ setStore({}); render(); } }
function celebrate(){
  var emo=['🎉','✨','🌟','🔬','💡','🌈','⭐','🧪'];
  for(var k=0;k<26;k++){
    (function(){
      var c=document.createElement('div'); c.className='confetti';
      c.textContent=emo[Math.floor(Math.random()*emo.length)];
      c.style.left=Math.random()*100+'vw';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ c.remove(); },4200);
    })();
  }
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

(function(){
  var s=Portal.getSession();
  CHILD=(s&&s.child)?s.child:'user';
  KEY='sci-exp-'+CHILD;
  var d=new Date();
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('dateStr').textContent=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+wk;
  render();
})();
</script>
</body>
</html>
