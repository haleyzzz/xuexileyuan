<style>

  .q{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);padding:14px;margin-bottom:12px;border:3px solid transparent;transition:border-color .2s}

  .opt.ok{background:var(--green);color:#fff}
  .opt.no{background:#ff6b6b;color:#fff}
  .opt.dim{opacity:.45;pointer-events:none}
  .why{font-size:13px;color:#888;margin-top:10px;background:#f6fafd;border-radius:10px;padding:9px;line-height:1.6;display:none}
  .why.on{display:block}

  .report .sub{font-size:14px;color:#888;margin-top:4px}
  .report .line{font-size:15px;color:var(--ink);margin-top:10px}
  .report .pass{color:var(--green);font-weight:800}
  .report .fail{color:#ff6b6b;font-weight:800}
  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}

  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--c2);color:#fff;padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
</style>

function speak(t){ try{ if(!('speechSynthesis'in window))return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.9; window.speechSynthesis.speak(u); }catch(e){} }
function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function setScreen(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');}); document.getElementById(id).classList.add('on'); }
var score=0, answered=0, list=[];
function renderChips(){
  var h=''; TOPICS.forEach(function(t){ h+='<button class="chip'+(t[1]===curTopic?' on':'')+'" onclick="pickTopic(\''+t[1]+'\')">'+t[0]+'</button>'; });
  document.getElementById('topicChips').innerHTML=h;
}
function pickTopic(t){ curTopic=t; renderChips(); }
function start(){ score=0; answered=0; list = curTopic? GEOM.filter(function(x){return x.topic===curTopic;}):GEOM.slice(); setScreen('scrQuiz'); renderQuiz(); }
function renderQuiz(){
  var html='';
  list.forEach(function(it,idx){
    html+='<div class="q" id="q'+idx+'"><div class="qt"><span class="qn">'+(idx+1)+'.</span>'+it.q+'<span class="tg">'+it.topic+'</span></div><div class="opts">';
    it.opts.forEach(function(op,oi){ html+='<button class="opt" onclick="choose('+idx+','+oi+')" id="o'+idx+'_'+oi+'">'+op+'</button>'; });
    html+='</div><div class="why" id="w'+idx+'"></div></div>';
  });
  document.getElementById('quizArea').innerHTML=html;
  document.getElementById('finishBtn').style.display='none';
  updateProg();
}
function choose(idx,oi){
  var it=list[idx]; var q=document.getElementById('q'+idx);
  if(q.classList.contains('done-ok')||q.classList.contains('done-no')) return;
  answered++;
  var ok=(oi===it.ans);
  var opts=q.querySelectorAll('.opt');
  opts.forEach(function(b,i){ b.classList.add('dim'); if(i===it.ans) b.classList.add('ok'); });
  if(ok){ q.classList.add('done-ok'); score++; } else { q.classList.add('done-no'); opts[oi].classList.add('no'); }
  var w=document.getElementById('w'+idx); w.textContent='💡 '+it.why; w.classList.add('on');
  updateProg();
  if(answered>=list.length) document.getElementById('finishBtn').style.display='block';
}
function updateProg(){
  document.getElementById('progBar').style.width=(answered/list.length*100)+'%';
  document.getElementById('progTxt').textContent='已答 '+answered+' / '+list.length;
}
function finish(){
  var pct=Math.round(score/list.length*100);
  document.getElementById('rScore').textContent=score+' / '+list.length;
  document.getElementById('rPct').textContent='正确率 '+pct+'%';
  var stars = pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('rStars').textContent=stars;
  var pass = score/list.length>=0.8;
  document.getElementById('rPass').innerHTML = pass?'<span class="pass">🎊 通关！几何小能手</span>':'<span class="fail">再练练，争取通关 80%</span>';
  if(score>(store.best||0)){ store.best=score; setStore(store); }
  if(pass) showCeleb();
  setScreen('scrReport');
}
function resetBest(){ if(confirm('确定清空最佳对题记录？')){ setStore({best:0}); store={best:0}; document.getElementById('bestNum').textContent='0'; } }
function goMenu(){ setScreen('scrMenu'); }
function showCeleb(){ var c=document.getElementById('celeb'); c.style.display='flex'; }
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }
(function init(){
  var s=Portal.getSession(); CHILD=(s&&s.child)?s.child:'user'; KEY='geom-'+CHILD; store=getStore();
  document.getElementById('dateStr').textContent=new Date().toLocaleDateString('zh-CN');
  document.getElementById('totalNum').textContent=GEOM.length;
  document.getElementById('bestNum').textContent=store.best||0;
  renderChips();
})();
</script>
