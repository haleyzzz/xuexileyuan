<style>
  :root{ --c1:#06d6a0; --c2:#b292ff; --green:#06d6a0; --ink:#3d3a4b; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#eafaf4,#f3efff);color:var(--ink);padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  header{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(6,214,160,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--c2)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  .screen{display:none}
  .screen.on{display:block}
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-size:16px;font-family:inherit;cursor:pointer;font-weight:800;color:#fff;background:var(--c1);margin-top:8px}
  .btn.gh{background:var(--c2)}
  .btn.sec{background:#f3efff;color:var(--c1)}
  .prog-wrap{margin:6px 0 14px}
  .progress{height:14px;background:#d9f3ea;border-radius:10px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center;margin-top:4px}
  .q{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);padding:14px;margin-bottom:12px;border:3px solid transparent;transition:border-color .2s}
  .q.done-ok{border-color:var(--green)}
  .q.done-no{border-color:#ff6b6b}
  .q .qt{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.6}
  .q .qt .qn{color:var(--c1);margin-right:6px}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{border:none;border-radius:12px;padding:11px 14px;font-size:14px;text-align:left;font-family:inherit;cursor:pointer;background:#f3efff;color:var(--ink);transition:.15s}
  .opt:active{transform:scale(.98)}
  .opt.ok{background:var(--green);color:#fff}
  .opt.no{background:#ff6b6b;color:#fff}
  .opt.dim{opacity:.45;pointer-events:none}
  .why{font-size:13px;color:#888;margin-top:10px;background:#f6f8fb;border-radius:10px;padding:9px;line-height:1.6;display:none}
  .why.on{display:block}
  .report{background:#fff;border-radius:24px;box-shadow:0 8px 22px rgba(0,0,0,.08);padding:24px;text-align:center;margin-top:14px}
  .report .stars{font-size:34px;letter-spacing:4px;margin:6px 0}
  .report .score{font-size:30px;font-weight:800;color:var(--c1)}
  .report .sub{font-size:14px;color:#888;margin-top:4px}
  .report .line{font-size:15px;color:var(--ink);margin-top:10px}
  .report .pass{color:var(--green);font-weight:800}
  .report .fail{color:#ff6b6b;font-weight:800}
  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--c2);color:#fff;padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}

  /* 年级筛选 */
  .gg-label{font-size:13px;color:#888;margin:12px 2px 2px}
  .grades{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px}
  .grades button{flex:0 0 auto;border:2px solid #d9f3ea;background:#fff;color:#2bb98a;
    border-radius:14px;padding:6px 12px;font-size:13px;font-weight:800;cursor:pointer;font-family:inherit}
  .grades button.on{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;border-color:transparent}
</style>
</head>

<script>
var QUIZ=[
  {q:'彩虹通常有几种颜色？',opts:['7 种','5 种','3 种','9 种'],ans:0,why:'彩虹一般是红橙黄绿蓝靛紫 7 种颜色。'},
  {q:'绿色植物长大主要靠什么制造养分？',opts:['阳光','声音','月亮','风'],ans:0,why:'植物通过光合作用，利用阳光把水和二氧化碳变成养分。'},
  {q:'我们看到的月亮，它本身会发光吗？',opts:['不会，是反射太阳光','会自己发光','只有晚上才发光','从不出现'],ans:0,why:'月亮不发光，我们见到的是它反射的太阳光。'},
  {q:'蜜蜂在花丛中飞来飞去，主要帮植物做什么？',opts:['传播花粉','捉害虫','浇水','松土'],ans:0,why:'蜜蜂采蜜时把花粉带到别的花上，帮助植物结果。'},
  {q:'常压下，水在多少摄氏度会结成冰？',opts:['0℃','100℃','50℃','10℃'],ans:0,why:'水在 0℃ 结冰，100℃ 沸腾。'},
  {q:'北极熊主要生活在地球的哪个区域？',opts:['北极','南极','沙漠','热带草原'],ans:0,why:'北极熊生活在北极附近的冰原上。'},
  {q:'人呼吸时，空气主要进出哪个器官？',opts:['肺','胃','肝脏','肾脏'],ans:0,why:'肺是呼吸器官，负责吸入氧气、排出二氧化碳。'},
  {q:'下面哪种动物是卵生的（从蛋里孵化）？',opts:['鸡','猫','狗','牛'],ans:0,why:'鸡是鸟类，从蛋里孵出来；猫狗牛是胎生。'},
  {q:'打雷闪电时，为什么先看到闪电后听到雷声？',opts:['光比声音跑得快','雷声被云挡住','闪电没有声音','眼睛比耳朵快'],ans:0,why:'光速远快于声速，所以先见闪电后闻雷声。'},
  {q:'地球上面积最大的海洋是？',opts:['太平洋','大西洋','印度洋','北冰洋'],ans:0,why:'太平洋是世界上最大、最深的海洋。'},
  {q:'在阳光下，人的影子是怎么形成的？',opts:['光被身体挡住','身体自己发光','空气变暗','水反射光'],ans:0,why:'光沿直线传播，被身体挡住的地方照不到，就形成了影子。'},
  {q:'废电池属于哪一类垃圾？',opts:['有害垃圾','厨余垃圾','可回收物','其他垃圾'],ans:0,why:'电池含重金属，会污染土壤和水，要放进有害垃圾。'}

  /* 高年级补充题 */
  ,{q:'声音不能在下面哪种地方传播？',opts:['真空','空气','水','木头'],ans:0,why:'太空是真空，没有空气等介质，声音无法传播。',g:4}
  ,{q:'下面哪种动物属于昆虫？',opts:['蚂蚁','蜘蛛','蚯蚓','蜗牛'],ans:0,why:'昆虫有头胸腹三节、六条腿，蚂蚁是；蜘蛛八条腿不是昆虫。',g:4}
  ,{q:'白天和黑夜的交替，主要是地球在做什么？',opts:['自转','公转','平移','静止'],ans:0,why:'地球绕地轴自转，约 24 小时转一圈，产生昼夜交替。',g:5}
  ,{q:'食物链一般从哪里开始？',opts:['绿色植物','食肉动物','真菌','石头'],ans:0,why:'植物能自己制造养分，是食物链的起点（生产者）。',g:5}
  ,{q:'要让小灯泡亮起来，下面哪样不能少？',opts:['闭合的回路','只要一节电池','只要一个开关','只要一个灯泡'],ans:0,why:'电需要形成闭合回路才能流动，灯泡才会亮。',g:6}
  ,{q:'水烧开变成水蒸气，这属于什么变化？',opts:['物理变化','化学变化','生物变化','没有变化'],ans:0,why:'水变成水蒸气只是状态改变，没有新物质生成，是物理变化。',g:6}

  /* ===== 补充题 ===== */
  ,{q:'为什么树叶到秋天会变黄或变红？',opts:['叶绿素减少','温度变高','被虫吃掉','缺水'],ans:0,why:'秋天光照变短变冷，叶绿素分解，叶黄素、花青素显现出来。',g:3}
  ,{q:'蜗牛爬过的地方为什么留下亮亮的线？',opts:['分泌黏液','在出汗','在喝水','在尿尿'],ans:0,why:'蜗牛身体会分泌黏液，减少摩擦也留下亮痕。',g:2}
  ,{q:'夏天冰棍为什么会冒“白气”？',opts:['水汽遇冷凝结','冰在燃烧','太甜了','有电'],ans:0,why:'周围的水蒸气遇冷结成小水滴，看起来像白雾。',g:3}
  ,{q:'被蚊子叮了为什么会起包发痒？',opts:['它注入唾液','咬破皮','带电','有毒气'],ans:0,why:'蚊子唾液含抗凝血物质，身体过敏就起包。',g:2}
  ,{q:'罐头食品为什么能放很久？',opts:['高温杀菌又密封','加了糖','冻住了','晒过太阳'],ans:0,why:'密封前高温杀灭细菌并隔绝空气，细菌进不去。',g:4}
  ,{q:'大海为什么是咸的？',opts:['河流把盐带入海','鱼吐盐','盐从天上掉','本来就咸'],ans:0,why:'河水把陆地上的盐分带入海洋，水蒸发盐留了下来。',g:4}
  ,{q:'为什么用镜子能看到自己？',opts:['光被反射回来','镜子会发光','镜子是透明的','眼睛变快'],ans:0,why:'镜子表面光滑，光线按规律反射回我们的眼睛。',g:3}
  ,{q:'冬天嘴里为什么会“冒白烟”？',opts:['热气遇冷凝结','在抽烟','太冷了','有雾气'],ans:0,why:'呼出的热气遇到冷空气，凝结成小水滴。',g:2}
  ,{q:'磁铁为什么能吸住铁？',opts:['有磁性','带电','有胶','是热的'],ans:0,why:'磁铁周围有磁场，对铁等铁磁物质有吸引力。',g:3}
  ,{q:'煮熟的鸡蛋为什么能立起来（春分立蛋）？',opts:['重心稳手又稳','有魔法','温度高','有磁性'],ans:0,why:'重心落在支撑面内就能立住，和节气本身无关。',g:4}
  ,{q:'含羞草为什么一碰就合拢？',opts:['叶枕失水','怕痒','有电','枯萎了'],ans:0,why:'触碰使叶枕细胞失水，叶片就闭合起来。',g:3}
  ,{q:'高山上为什么煮不熟饭？',opts:['气压低水不到100℃就沸','缺氧','风太大','锅太小'],ans:0,why:'海拔高气压低，水低于100℃就沸腾，温度不够。',g:5}
  ,{q:'彩虹为什么总在雨后放晴时出现？',opts:['空中小水滴折射阳光','有风','云很厚','在打雷'],ans:0,why:'阳光经过空中水滴折射、反射，散成七种颜色。',g:3}
  ,{q:'铁为什么会生锈？',opts:['与水和氧气反应','晒太阳','被虫咬','静电'],ans:0,why:'铁在潮湿空气中和氧气反应，生成橙红色的氧化铁。',g:4}
  ,{q:'我们为什么能听见声音？',opts:['物体振动传声','空气发光','耳朵大','有风'],ans:0,why:'发声体振动，通过空气等介质把声音传到耳朵里。',g:2}
  ,{q:'仙人掌的叶子为什么变成刺？',opts:['减少水分蒸发','为了防御','为了好看','为了吸热'],ans:0,why:'针刺叶面积小，能减少水分散失，适应干旱。',g:4}
  ,{q:'一年为什么有春、夏、秋、冬四季？',opts:['地轴倾斜又公转','地球变大','月亮影响','太阳在移动'],ans:0,why:'地球公转时地轴倾斜，南北半球受光多少不同。',g:5}
  ,{q:'海拔越高为什么越冷？',opts:['空气稀薄保温差','风大','离太阳远','没有云'],ans:0,why:'高空气压低、空气稀薄，保存热量的能力弱。',g:5}
  ,{q:'为什么饭后要漱口？',opts:['保护牙齿','更好吃','好玩','省时间'],ans:0,why:'食物残渣会滋生细菌、腐蚀牙齿，漱口能冲走它们。',g:1}
  ,{q:'小朋友为什么要多晒太阳？',opts:['帮身体制造维生素D','只是变黑','因为热','为了睡觉'],ans:0,why:'阳光照皮肤能合成维生素D，帮助钙吸收、骨骼结实。',g:1}
  ,{q:'我们为什么每天都要睡觉？',opts:['让大脑和身体休息','因为天黑','太无聊','因为冷'],ans:0,why:'睡眠时身体修复组织、整理记忆，不睡第二天气力不足。',g:2}
  ,{q:'肚子饿了为什么会咕咕叫？',opts:['胃在空转收缩','生气了','口渴','怕冷'],ans:0,why:'空腹时胃仍收缩，挤压里面少量空气和液体发出咕噜声。',g:2}
  ,{q:'游泳久了手脚皮肤为什么发皱？',opts:['皮肤浸水膨胀','累了','受凉','缺氧'],ans:0,why:'手指脚趾皮肤浸水变软起皱，可能有助于湿滑时抓握。',g:3}
  ,{q:'切洋葱为什么会流泪？',opts:['洋葱放出刺激气体','它很辣','切得太快','伤心'],ans:0,why:'洋葱破损释放酶，生成刺激物冲到眼睛，眼睛用泪冲走它。',g:3}
  ,{q:'汽水瓶一打开为什么冒泡泡？',opts:['二氧化碳跑出来','被摇过','因为热','因为甜'],ans:0,why:'瓶中压入了二氧化碳，开盖减压后气体变成小泡逸出。',g:3}
  ,{q:'遥控器为什么装电池就能用？',opts:['电池提供电能','它有光','线很长','按键神奇'],ans:0,why:'电池把化学能变成电能，驱动遥控器里的电路工作。',g:4}
  ,{q:'保鲜膜为什么能让菜放久一点？',opts:['隔开空气和细菌','它透明','好看','凉快'],ans:0,why:'保鲜膜减少食物和空气接触，减慢氧化和细菌繁殖。',g:4}
  ,{q:'灯塔的光为什么一闪一闪？',opts:['灯室在旋转','灯泡坏了','有风','云挡住'],ans:0,why:'灯塔里灯室转动，光只在转到你这侧时看得见，像在眨眼。',g:4}
  ,{q:'盐碱地的庄稼为什么长不好？',opts:['土太咸伤根','太干','太热','风大'],ans:0,why:'土壤盐分过高，植物根难吸水，还会被盐伤害。',g:5}
  ,{q:'天上的星星为什么有的亮有的暗？',opts:['远近和本身光度不同','年龄不同','颜色不同','季节不同'],ans:0,why:'离我们近、本身发光强的星看起来更亮。',g:5}

(function(){ var QG=[1,3,1,2,2,1,2,1,3,4,2,3]; QUIZ.forEach(function(q,i){ if(QG[i]!=null) q.g=QG[i]; }); })();
var CHILD='user', store={};
var gradeSel=0, VIEW=[];
var TOTAL=0, score=0, answered=0, PASS_LINE=0.8;
function bestKey(){ return 'science-quiz-'+CHILD+(gradeSel?('-g'+gradeSel):''); }
function getView(){ return gradeSel? QUIZ.filter(function(x){return x.g===gradeSel;}) : QUIZ; }
function getStore(){ try{ return JSON.parse(localStorage.getItem(bestKey()))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(bestKey(), JSON.stringify(o)); }catch(e){} }
function start(){ score=0; answered=0; VIEW=getView(); TOTAL=VIEW.length; setScreen('scrQuiz'); renderQuiz();
  document.querySelector('#celeb p').textContent = VIEW.length+' 个为什么都搞懂啦，世界真奇妙！'; }
function goMenu(){ setScreen('scrMenu'); }
function setScreen(id){ ['scrMenu','scrQuiz','scrReport'].forEach(function(s){ document.getElementById(s).classList.toggle('on', s===id); }); }
function renderQuiz(){
  var html='';
  VIEW.forEach(function(q,gi){
    html+='<div class="q" id="q-'+gi+'">'+
      '<div class="qt"><span class="qn">Q'+(gi+1)+'.</span>'+q.q+'</div><div class="opts">';
    q.opts.forEach(function(o,oi){ html+='<button class="opt" id="opt-'+gi+'-'+oi+'" onclick="answer('+gi+','+oi+')">'+o+'</button>'; });
    html+='</div><div class="why" id="why-'+gi+'"></div></div>';
  });
  document.getElementById('quizArea').innerHTML=html;
  updateProg();
  document.getElementById('finishBtn').style.display='none';
}
function answer(gi,oi){
  var q=VIEW[gi];
  var qEl=document.getElementById('q-'+gi);
  if(qEl.classList.contains('done-ok')||qEl.classList.contains('done-no')) return;
  answered++;
  var ok=(oi===q.ans);
  if(ok) score++;
  q.opts.forEach(function(o,bi){
    var b=document.getElementById('opt-'+gi+'-'+bi);
    b.classList.add('dim');
    if(bi===q.ans) b.classList.add('ok');
    if(bi===oi && !ok) b.classList.add('no');
  });
  qEl.classList.add(ok?'done-ok':'done-no');
  var w=document.getElementById('why-'+gi);
  w.textContent='解析：'+q.why; w.classList.add('on');
  updateProg();
  if(answered>=TOTAL){ document.getElementById('finishBtn').style.display='block'; }
}
function updateProg(){
  var pct=Math.round(answered/TOTAL*100);
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent='已答 '+answered+' / '+TOTAL;
}
function finish(){
  setScreen('scrReport');
  var pct=TOTAL?Math.round(score/TOTAL*100):0;
  var stars=pct>=90?3:pct>=PASS_LINE*100?2:pct>=60?1:0;
  document.getElementById('rStars').textContent=stars>0?'⭐'.repeat(stars):'—';
  document.getElementById('rScore').textContent=score+' / '+TOTAL;
  document.getElementById('rPct').textContent='正确率 '+pct+'%';
  var pass=pct>=PASS_LINE*100;
  document.getElementById('rPass').innerHTML=pass?'<span class="pass">🎊 通关成功！达到 '+PASS_LINE*100+'% 过关线</span>':'<span class="fail">💪 还差一点，再练一遍就通关啦</span>';
  store=getStore();
  if(score>(store.best||0)){ store.best=score; setStore(store); }
  document.getElementById('bestNum').textContent=store.best||0;
  if(pass) celebrate();
}
function resetBest(){ if(confirm('确定清空最佳对题记录？')){ setStore({best:0}); document.getElementById('bestNum').textContent='0'; } }
function celebrate(){
  var emo=['🎉','✨','🔬','🌟','⭐','💡','🌈','🪐'];
  for(var k=0;k<26;k++){ (function(){ var c=document.createElement('div'); c.className='confetti'; c.textContent=emo[Math.floor(Math.random()*emo.length)]; c.style.left=Math.random()*100+'vw'; c.style.animationDuration=(2+Math.random()*2)+'s'; document.body.appendChild(c); setTimeout(function(){ c.remove(); },4200); })(); }
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }
function renderGrades(){
  var n=getView().length;
  var html='<button class="'+(gradeSel===0?'on':'')+'" onclick="setGrade(0)">全部</button>';
  for(var g=1;g<=6;g++){ html+='<button class="'+(gradeSel===g?'on':'')+'" onclick="setGrade('+g+')">'+g+'年级</button>'; }
  document.getElementById('grades').innerHTML=html;
  document.getElementById('totalNum').textContent=n;
  document.getElementById('menuTip').innerHTML='共 '+n+' 个有趣的小知识，选对 80% 就通关！做完看解析，长见识～'+(gradeSel?('（当前：'+gradeSel+'年级）'):'（全部年级）');
}
function setGrade(g){ gradeSel=g; renderGrades(); }
