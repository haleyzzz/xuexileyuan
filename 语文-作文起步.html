<style>
  :root{ --c1:#9b5de5; --c2:#ff8fab; --green:#06d6a0; --ink:#3d2a4b; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#f3edff,#fff0f6);color:var(--ink);padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}

  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}

  .tabs{display:flex;gap:8px;margin:10px 0 6px}

  .tabs .tab.on{background:var(--c1);color:#fff}

  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:10px;line-height:1.6}

  .card:active{transform:scale(.98)}
  .card .ce{font-size:30px}
  .card .ct{font-size:16px;font-weight:800}
  .card .cd{font-size:12px;color:#999;margin-top:2px}
  .card .cdone{margin-left:auto;font-size:12px;color:var(--green);font-weight:700}
  .detail{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);padding:14px;margin-bottom:12px}

  .hintbox b{color:var(--c1)}
  .gw{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .gw span{background:#fff0f6;color:var(--c2);border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700}
  textarea{width:100%;min-height:120px;border:2px solid #ecdcff;border-radius:12px;padding:10px;font-size:15px;font-family:inherit;color:var(--ink);line-height:1.7;outline:none;resize:vertical}

  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100}

  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--c2);color:#fff;padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
</style>

  {"id":"e7","emoji":"🌳","title":"植树","scene":"春天来了，小刚和小红扛着小树苗来到山坡上。他们挖坑、放苗、填土、浇水，小树在风里点点头。","who":"小刚、小红","where":"山坡","what":"种小树","gw":["亲手","挖坑","填土","茁壮成长"],"model":"春天，我们种下一棵小树。挖坑、放苗、填土、浇水，小树轻轻摇晃，好像在说谢谢。爱护树木，绿色更美。"},

  {"id":"e10","emoji":"❄️","title":"堆雪人","scene":"下雪了，地上白茫茫一片。小刚滚了一个大雪球做身子，小雪球做脑袋，再插上胡萝卜鼻子，雪人笑眯眯的。","who":"小刚","where":"院子里","what":"堆雪人","gw":["白茫茫","滚雪球","胡萝卜","笑眯眯"],"model":"下雪啦！我滚出大雪球当身子，小雪球当脑袋，插上胡萝卜鼻子。雪人笑眯眯地看着我，冬天真有趣。"},

  {"id":"e16","emoji":"🚌","title":"让座","scene":"公交车上，一位老奶奶站着。小花立刻站起来，把座位让给她。全车人都朝她笑。","who":"小花、老奶奶","where":"公交车","what":"给老人让座","gw":["立刻","尊敬","站起来","表扬"],"model":"公交车上老奶奶站着，我马上起身让座。老奶奶连声谢谢，我心里甜甜的。尊敬老人是好事。"},
  {"id":"e17","emoji":"🐰","title":"小白兔种萝卜","scene":"小白兔种下萝卜籽，天天浇水。秋天到了，它拔出又大又红的萝卜，高兴极了。","who":"小白兔","where":"菜园","what":"种萝卜","gw":["勤劳","浇水","收获","又大又红"],"model":"小白兔种下萝卜籽，每天浇水。秋天它拔出又大又红的萝卜，真高兴。勤劳才有好收成。"},

function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }

function renderList(){
  var arr=CUR();

  document.getElementById('listTitle').textContent=title;
  document.getElementById('listTip').textContent=tip;
  var html='';
  arr.forEach(function(e,idx){
    var done = store.works && store.works[e.id];
    html+='<div class="card" onclick="openEssay('+idx+')"><div class="ce">'+e.emoji+'</div><div><div class="ct">'+e.title+'</div><div class="cd">点我开始写作</div></div>'+(done?'<div class="cdone">✓ 已写</div>':'')+'</div>';
  });
  document.getElementById('listArea').innerHTML=html;
  var n=0; if(store.works){ arr.forEach(function(e){ if(store.works[e.id]) n++; }); }
  document.getElementById('doneNum').textContent=n;
  document.getElementById('totalNum').textContent=arr.length;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function openEssay(idx){
  curIdx=idx; var e=CUR()[idx];
  var saved = (store.works&&store.works[e.id])?store.works[e.id]:'';
  var html='<h3>'+e.emoji+' '+e.title+'</h3>';
  if(MODE==='pic'){
    html+='<div class="scene" id="sceneTxt">'+e.scene+'</div>';
    html+='<div class="row"><button class="spk" onclick="speak(document.getElementById(\'sceneTxt\').innerText)">🔊 朗读情境</button></div>';
    html+='<div class="hintbox"><b>谁：</b>'+e.who+'　<b>在哪里：</b>'+e.where+'　<b>做什么：</b>'+e.what+'</div>';
    html+='<div style="font-size:13px;color:#999;margin:10px 0 2px;font-weight:700">🌟 好词好句</div><div class="gw">';
    e.gw.forEach(function(w){ html+='<span>'+w+'</span>'; });
    html+='</div>';
  } else {
    html+='<div class="scene" id="sceneTxt">'+e.prompt+'</div>';
    html+='<div class="row"><button class="spk" onclick="speak(document.getElementById(\'sceneTxt\').innerText)">🔊 朗读题目要求</button></div>';
    html+='<div class="hintbox"><b>📌 写作小锦囊：</b><br>'+e.hint.map(function(h){return '· '+h;}).join('<br>')+'</div>';
    html+='<div style="font-size:13px;color:#999;margin:10px 0 2px;font-weight:700">🌟 好开头（参考）</div><div class="gw">';
    e.openings.forEach(function(o){ html+='<span>'+o+'</span>'; });
    html+='</div>';
  }
  html+='<div style="font-size:13px;color:#999;margin:8px 0 4px;font-weight:700">✍️ 我的作文（可打字，也可在下面手写）</div>';
  html+='<textarea id="myText" placeholder="动笔写一写吧～">'+esc(saved)+'</textarea>';
  html+='<div id="hwSlot"></div>';
  html+='<button class="btn sec" style="margin-top:8px" onclick="showModel()">👀 看范文对照</button>';
  html+='<div class="model" id="modelBox">'+e.model+'</div>';
  document.getElementById('detailBox').innerHTML=html;
  if(window.Handwrite){
    curHW=Handwrite.create({placeholder:'✍️ 在这里用手写你的作文'});
    var slot=document.getElementById('hwSlot'); if(slot) slot.appendChild(curHW.el);
  } else { curHW=null; }
  setScreen('scrWrite');
}
function showModel(){ document.getElementById('modelBox').classList.toggle('on'); }
function saveWork(){
  if(curIdx<0) return;
  var e=CUR()[curIdx]; var txt=document.getElementById('myText').value;
  if(!store.works) store.works={};
  store.works[e.id]=txt;
  if(window.Handwrite && curHW && !curHW.isEmpty()){
    if(!store.imgs) store.imgs={};
    store.imgs[e.id]=curHW.toDataURL();
  }
  setStore(store);
  var n=0; CUR().forEach(function(x){ if(store.works[x.id]) n++; });
  document.getElementById('doneNum').textContent=n;
  var c=document.getElementById('celeb'); c.style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }
function goList(){ renderList(); setScreen('scrList'); }
function resetAll(){ if(confirm('确定清空所有写话？')){ store={works:{}}; setStore(store); renderList(); } }
(function init(){
  var s=Portal.getSession(); CHILD=(s&&s.child)?s.child:'user'; KEY='essay-'+CHILD; store=getStore();
  if(!store.works) store.works={};
  document.getElementById('dateStr').textContent=new Date().toLocaleDateString('zh-CN');
  renderList();
})();
</script>
<script src="handwrite.js"></script>
</body>
</html>
