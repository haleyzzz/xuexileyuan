<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; font-src 'self' data:; connect-src 'self' https://api.github.com https:; worker-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>离线啦 · 三升四暑假打卡</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",Segoe UI,Roboto,sans-serif;
    background:linear-gradient(160deg,#eaf1ff,#f7f0ff);color:#1f2a44;min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;}
  .emoji{font-size:72px;line-height:1;margin-bottom:8px;}
  h1{font-size:22px;margin:6px 0 10px;}
  p{font-size:15px;color:#6b7794;line-height:1.7;max-width:340px;margin:4px 0;}
  .btn{margin-top:22px;border:none;border-radius:14px;padding:13px 26px;font-size:16px;font-weight:700;
    cursor:pointer;background:linear-gradient(135deg,#4f7cff,#7c5cff);color:#fff;
    box-shadow:0 10px 24px rgba(79,124,255,.3);transition:.15s;}
  .btn:active{transform:scale(.96);}
  .tip{font-size:12px;color:#9aa6c2;margin-top:18px;}
</style>
</head>
<body>
  <div class="emoji">📡➰</div>
  <h1>暂时没有网络啦</h1>
  <p>这个页面还没被缓存下来，连不上网就打不开了。</p>
  <p>已经打开过的页面（打卡、单词卡、短文卡等）可以离线继续使用。</p>
  <button class="btn" onclick="goHome()">🏠 回到主页</button>
  <div class="tip">小提示：常用页面先打开一次，下次没网也能用～</div>

<script>
  function goHome(){
    // 优先回门户；若门户也未缓存，则尝试根路径
    var targets = ['门户.html','index.html','./'];
    tryHome(targets, 0);
  }
  function tryHome(list, i){
    if(i >= list.length){ location.href = './'; return; }
    var url = list[i];
    fetch(url, {cache:'force-cache'}).then(function(r){
      if(r && r.ok){ location.href = url; }
      else { tryHome(list, i+1); }
    }).catch(function(){ tryHome(list, i+1); });
  }
  // 页面加载即尝试自动回主页（有缓存就跳）
  window.addEventListener('load', function(){
    try{ goHome(); }catch(e){}
  });
</script>
</body>
</html>
