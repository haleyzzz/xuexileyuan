<style>
  :root{ --c1:#e07a5f; --c2:#f2a65a; --green:#06d6a0; --ink:#3d3a4b; }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#fff3ec,#fdf0e6);color:var(--ink);padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  header{background:linear-gradient(120deg,var(--c1),var(--c2));color:#fff;border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(224,122,95,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--c1)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  .screen{display:none}
  .screen.on{display:block}
  .btn{display:block;width:100%;border:none;border-radius:16px;padding:14px;font-size:16px;font-family:inherit;cursor:pointer;font-weight:800;color:#fff;background:var(--c1);margin-top:8px}
  .btn.gh{background:var(--c2)}
  .btn.sec{background:#fff3ec;color:var(--c1)}
  .prog-wrap{margin:6px 0 14px}
  .progress{height:14px;background:#ffe6da;border-radius:10px;overflow:hidden}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c1),var(--c2));border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center;margin-top:4px}
  .q{background:#fff;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.06);padding:14px;margin-bottom:12px;border:3px solid transparent;transition:border-color .2s}
  .q.done-ok{border-color:var(--green)}
  .q.done-no{border-color:#ff6b6b}
  .q .qt{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.6}
  .q .qt .qn{color:var(--c1);margin-right:6px}
  .q .qt .spk{border:none;background:#fff3ec;color:var(--c1);border-radius:10px;padding:2px 9px;font-size:13px;cursor:pointer;font-family:inherit;margin-left:6px}
  .q .sentence{font-size:17px;font-weight:800;color:var(--ink);background:#fff8f3;border-radius:12px;padding:10px 12px;margin-bottom:10px;line-height:1.7}
  .opts{display:flex;flex-direction:column;gap:8px}
  .opt{border:none;border-radius:12px;padding:11px 14px;font-size:14px;text-align:left;font-family:inherit;cursor:pointer;background:#fff3ec;color:var(--ink);transition:.15s}
  .opt:active{transform:scale(.98)}
  .opt.ok{background:var(--green);color:#fff}
  .opt.no{background:#ff6b6b;color:#fff}
  .opt.dim{opacity:.45;pointer-events:none}
  .why{font-size:13px;color:#888;margin-top:10px;background:#f6f8fb;border-radius:10px;padding:9px;line-height:1.6;display:none}
  .why.on{display:block}
  .report{background:#fff;border-radius:24px;box-shadow:0 8px 22px rgba(0,0,0,.08);padding:24px;text-align:center;margin-top:14px}
  .report .stars{font-size:34px;letter-spacing:4px;margin:6px 0}
  .report .score{font-size:30px;font-weight:800;color:var(--c1)}
  .report .sub{font-size:14px;color:#888;margin-top:4px}
  .report .line{font-size:15px;color:var(--ink);margin-top:10px}
  .report .pass{color:var(--green);font-weight:800}
  .report .fail{color:#ff6b6b;font-weight:800}
  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--c2);color:#fff;padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
</style>
<script>
/* iOS 朗读稳定性补丁：保留 utterance 全局引用防 GC 静音 + 朗读前 resume()（与 speech.js 同逻辑，本页未引 speech.js 故内联） */
(function(){ if(window.__ttsPatched) return; window.__ttsPatched=true;
  if(!window.speechSynthesis) return;
  var _sp=window.speechSynthesis.speak.bind(window.speechSynthesis);

})();
</script>

  {"word":"菜园里种了西红柿、黄瓜、苹果和茄子。","q":"😷 这句话有毛病，请选出改正确的版本：","opts":["菜园里种了西红柿、黄瓜和茄子。","菜园里种了西红柿、黄瓜、苹果、茄子。","菜园里种了黄瓜、苹果和茄子。","菜园里种了西红柿、苹果和茄子。"],"ans":0,"why":"苹果是水果不是蔬菜，归类不当应去掉。"},

  {"word":"因为今天下雨，所以要去公园。","q":"😷 这句话有毛病，请选出改正确的版本：","opts":["因为今天下雨，所以不去公园。","因为今天下雨，所以去公园。","今天下雨，去公园。","下雨了，要去公园。"],"ans":0,"why":"关联词和意思矛盾，下雨应『不去』公园。"},
  {"word":"我断定他可能生病了。","q":"😷 这句话有毛病，请选出改正确的版本：","opts":["我猜想他可能生病了。","我断定他一定生病了。","我断定可能他病了。","我可能断定他生病。"],"ans":0,"why":"『断定』（肯定）和『可能』（不确定）矛盾，改『断定』为『猜想』。"},
  {"word":"操场上飘着五颜六色的红旗。","q":"😷 这句话有毛病，请选出改正确的版本：","opts":["操场上飘着红旗。","操场上飘着五颜六色的旗。","操场上飘着五颜六色的红。","操场上飘着颜色红的旗。"],"ans":0,"why":"『五颜六色』和『红』矛盾，红旗只有一种颜色。"},

function speak(t){ try{ if(!('speechSynthesis'in window))return; window.speechSynthesis.cancel(); var u=new SpeechSynthesisUtterance(t); u.lang='zh-CN'; u.rate=.9; window.speechSynthesis.speak(u); }catch(e){} }
function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function setScreen(id){ document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('on');}); document.getElementById(id).classList.add('on'); }
var score=0, answered=0;
function start(mode){
  currentMode=mode; currentArr=(mode==='bug')?QUIZ_BUG:QUIZ_PUNC;
  score=0; answered=0;
  document.getElementById('totalNum').textContent=currentArr.length;
  document.getElementById('bestNum').textContent=store['best_'+mode]||0;
  setScreen('scrQuiz'); renderQuiz();
}
function renderQuiz(){
  var html='';
  currentArr.forEach(function(it,idx){
    html+='<div class="q" id="q'+idx+'"><div class="qt"><span class="qn">'+(idx+1)+'.</span>'+it.q+'<button class="spk" onclick="speak(\''+it.word+'\')">🔊</button></div>';
    html+='<div class="sentence">'+it.word+'</div>';
    html+='<div class="opts">';
    it.opts.forEach(function(op,oi){ html+='<button class="opt" onclick="choose('+idx+','+oi+')" id="o'+idx+'_'+oi+'">'+op+'</button>'; });
    html+='</div><div class="why" id="w'+idx+'"></div><div id="hw'+idx+'" class="hw-slot"></div></div>';
  });
  document.getElementById('quizArea').innerHTML=html;
  document.getElementById('finishBtn').style.display='none';
  updateProg();
  if(window.Handwrite){
    currentArr.forEach(function(it, idx){
      var hw=Handwrite.create({revealText: it.opts[it.ans], placeholder:'✍️ 在这里用手写答案'});
      document.getElementById('hw'+idx).appendChild(hw.el);
      var rb=hw.el.querySelector('.hw-tools .hw-btn:last-child');
      if(rb) rb.addEventListener('click', function(){ markHW(it, idx, currentArr.length); });
    });
  }
}
function choose(idx,oi){
  var it=currentArr[idx]; var q=document.getElementById('q'+idx);
  if(q.classList.contains('done-ok')||q.classList.contains('done-no')) return;
  answered++;
  var ok = (oi===it.ans);
  var opts=q.querySelectorAll('.opt');
  opts.forEach(function(b,i){ b.classList.add('dim'); if(i===it.ans) b.classList.add('ok'); });
  if(ok){ q.classList.add('done-ok'); score++; } else { q.classList.add('done-no'); opts[oi].classList.add('no'); }
  var w=document.getElementById('w'+idx); w.textContent='💡 '+it.why; w.classList.add('on');
  updateProg();
  if(answered>=currentArr.length) document.getElementById('finishBtn').style.display='block';
}
function markHW(it, idx, total){
  var q=document.getElementById('q'+idx);
  if(q.classList.contains('done-ok')||q.classList.contains('done-no')||q.classList.contains('done-hw')) return;
  answered++;
  q.classList.add('done-hw');
  var w=document.getElementById('w'+idx);
  if(w){ w.innerHTML='💡 '+it.why; w.classList.add('on'); }
  updateProg();
  if(answered>=total) document.getElementById('finishBtn').style.display='block';
}
function updateProg(){
  document.getElementById('progBar').style.width=(answered/currentArr.length*100)+'%';
  document.getElementById('progTxt').textContent='已答 '+answered+' / '+currentArr.length;
}
function finish(){
  var pct=Math.round(score/currentArr.length*100);
  document.getElementById('rScore').textContent=score+' / '+currentArr.length;
  document.getElementById('rPct').textContent='正确率 '+pct+'%';
  var stars = pct>=90?'⭐⭐⭐':pct>=70?'⭐⭐':'⭐';
  document.getElementById('rStars').textContent=stars;
  var pass = score/currentArr.length>=0.8;
  document.getElementById('rPass').innerHTML = pass?'<span class="pass">🎊 通关！语句小医生</span>':'<span class="fail">再练练，争取通关 80%</span>';
  if(score>(store['best_'+currentMode]||0)){ store['best_'+currentMode]=score; setStore(store); }
  if(pass) showCeleb();
  setScreen('scrReport');
}
function resetBest(){ if(confirm('确定清空最佳记录？')){ store={}; setStore({}); document.getElementById('bestNum').textContent='0'; } }
function goMenu(){ setScreen('scrMenu'); }
function showCeleb(){ var c=document.getElementById('celeb'); c.style.display='flex'; }
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }
(function init(){
  var s=Portal.getSession(); CHILD=(s&&s.child)?s.child:'user'; KEY='sentence-fix-'+CHILD; store=getStore();
  document.getElementById('dateStr').textContent=new Date().toLocaleDateString('zh-CN');
  document.getElementById('totalNum').textContent=QUIZ_BUG.length;
})();
</script>
