<style>
:root{ --c1:#3a86ff; --c2:#4895ef; --bg:#eef4ff; --card:#fff; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(180deg,#dce9ff,#eef4ff); color:#1f2a44; padding:14px; padding-bottom:30px;}
.head{text-align:center; margin:6px 0 14px;}
.head h1{font-size:22px; margin:0 0 4px; color:var(--c1);}
.head p{margin:0; color:#7a89a8; font-size:13px;}
.note{display:none; background:#fff4e0; color:#9a6a00; border:1px solid #ffd591; border-radius:12px;
  padding:9px 12px; font-size:13px; margin:0 0 12px; line-height:1.5;}
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px; -webkit-overflow-scrolling:touch;}
.chip{flex:0 0 auto; border:1.5px solid #cdddff; background:#fff; color:#3a5a9a; border-radius:20px;
  padding:7px 14px; font-size:13px; cursor:pointer; font-weight:600; transition:.15s;}
.chip.on{background:var(--c2); color:#fff; border-color:var(--c2);}
.list{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media(max-width:520px){ .list{grid-template-columns:1fr;} }
.card{background:var(--card); border-radius:16px; padding:12px; box-shadow:0 4px 14px rgba(58,134,255,.10);
  display:flex; flex-direction:column; gap:6px;}
.card .en{font-size:16px; font-weight:700; color:#1f2a44; line-height:1.35;}
.card .zh{font-size:12px; color:#7a89a8;}
.card .tip{font-size:11px; color:#b06a00; background:#fff6e6; border-radius:8px; padding:4px 7px;}
.card .row{display:flex; gap:8px; align-items:center; margin-top:2px;}
.btn{border:none; border-radius:12px; padding:9px 0; font-size:14px; font-weight:700; cursor:pointer;
  font-family:inherit; flex:1; color:#fff;}
.btn.listen{background:#52b788;}
.btn.rec{background:var(--c2);}
.btn.rec.on{background:#e63946;}
.best{font-size:12px; color:#3a86ff; font-weight:700;}
/* panel */
.panel{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:90; padding:16px;}
.panel .box{background:#fff; border-radius:22px; padding:22px; max-width:440px; width:100%; animation:pop .35s;}
@keyframes pop{from{transform:scale(.9);opacity:0;}to{transform:scale(1);opacity:1;}}
.panel .g{font-size:12px; color:#9aa7c2; font-weight:700;}
.panel .en{font-size:22px; font-weight:800; color:#1f2a44; line-height:1.4; margin:6px 0;}
.panel .zh{font-size:14px; color:#5a6b8c; margin-bottom:8px;}
.panel .tip{font-size:12px; color:#b06a00; background:#fff6e6; border-radius:8px; padding:6px 9px; margin-bottom:12px; line-height:1.5;}
.panel .acts{display:flex; gap:10px; margin-bottom:12px;}
.panel .acts .btn{padding:12px 0;}
.status{font-size:13px; color:#7a89a8; min-height:18px; text-align:center; margin-bottom:6px;}
.said{background:#f2f6ff; border-radius:12px; padding:10px 12px; font-size:14px; line-height:1.5; min-height:20px; margin-bottom:8px;}
.said b{color:#1f2a44;}
.score{display:none; text-align:center; margin-bottom:10px;}
.score .pct{font-size:30px; font-weight:800; color:var(--c1);}
.score .stars{font-size:22px; letter-spacing:3px;}
.self{display:none; text-align:center; margin-bottom:10px;}
.self .lab{font-size:13px; color:#7a89a8; margin-bottom:6px;}
.self .st{font-size:26px; cursor:pointer; margin:0 3px; filter:grayscale(1); opacity:.5; transition:.15s;}
.self .st.on{filter:none; opacity:1;}
.closex{width:100%; border:none; background:#eef2fb; color:#5a6b8c; border-radius:12px; padding:11px 0;
  font-size:14px; font-weight:700; cursor:pointer; font-family:inherit;}
.celebrate{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; align-items:center; justify-content:center; z-index:100;}
.celebrate .box2{background:#fff; border-radius:24px; padding:28px 34px; text-align:center; animation:pop .4s; max-width:320px;}
.celebrate h3{font-size:24px; margin-bottom:8px;}
.celebrate p{color:#888; font-size:14px; line-height:1.6;}
.celebrate button{margin-top:16px; border:none; background:var(--c2); color:#fff; padding:11px 26px; border-radius:14px; font-size:15px; font-family:inherit; cursor:pointer; font-weight:700;}
.tabs{display:flex; gap:10px; margin:0 0 10px;}
.tab{flex:1; border:1.5px solid #cdddff; background:#fff; color:#3a5a9a; border-radius:14px; padding:11px 0; font-size:15px; font-weight:800; cursor:pointer; font-family:inherit; transition:.15s;}
.tab.on{background:var(--c1); color:#fff; border-color:var(--c1);}
.back{display:block; width:100%; border:1.5px solid #cdddff; background:#fff; color:#3a86ff; border-radius:12px; padding:10px 0; font-size:14px; font-weight:700; cursor:pointer; font-family:inherit; margin-bottom:10px;}
.prow{background:#fff; border-radius:16px; padding:12px; box-shadow:0 4px 14px rgba(58,134,255,.10); margin-bottom:10px;}
.prow .pen{font-size:15px; font-weight:700; line-height:1.4; margin-bottom:6px;}
.prow .pact{display:flex; gap:8px; align-items:center;}
.prow .pact .btn{flex:1;}
.prow .best{margin-left:auto;}
</style>
</head>

<div class="head"><h1>🎤 英语口语跟读</h1><p>听示范 · 开口读 · 智能评分</p></div>
<div class="note" id="srNote">提示：当前浏览器不支持语音识别，已切换为「跟读后自评」模式，照样能练口语哦～</div>
<div class="tabs" id="tabs">
  <button class="tab on" data-m="sent" onclick="setMode('sent')">🔤 句子跟读</button>
  <button class="tab" data-m="para" onclick="setMode('para')">📄 短文跟读</button>
</div>
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>

<div class="panel" id="panel">
  <div class="box">
    <div class="g" id="pG"></div>
    <div class="en" id="pEn"></div>
    <div class="zh" id="pZh"></div>
    <div class="tip" id="pTip"></div>
    <div class="pgloss" id="pGloss"></div>
    <div class="acts">
      <button class="btn listen" onclick="listen()">🔊 听示范</button>
      <button class="btn rec" style="background:#ff7a59" onclick="toggleGloss('pGloss')">🔤逐字</button>
      <button class="btn rec" id="recBtn" onclick="startRec()">🎤 开始跟读</button>
    </div>
    <div class="status" id="status"></div>
    <div class="said" id="said"></div>
    <div class="score" id="scoreBox">
      <div class="pct" id="pct">0%</div>
      <div class="stars" id="stars"></div>
    </div>
    <div class="self" id="selfBox">
      <div class="lab">跟读后，给自己打个分吧：</div>
      <span class="st" data-v="1" onclick="selfRate(1)">⭐</span>
      <span class="st" data-v="2" onclick="selfRate(2)">⭐</span>
      <span class="st" data-v="3" onclick="selfRate(3)">⭐</span>
      <span class="st" data-v="4" onclick="selfRate(4)">⭐</span>
      <span class="st" data-v="5" onclick="selfRate(5)">⭐</span>
    </div>
    <button class="closex" onclick="closePanel()">关闭</button>
  </div>
</div>

var MODE='sent', curParaIdx=null;
var gradeFilter='all';
var curId=null;
var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
var rec=null, recognizing=false;

function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){ return {}; } }
function saveStore(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

function init(){
  var s=(window.Portal&&Portal.getSession)?Portal.getSession():null;
  CHILD=(s&&s.child)?s.child:'user'; KEY='oral-'+CHILD; store=getStore();
  if(!SR){ document.getElementById('srNote').style.display='block'; }
  renderChips(); updateTabs(); renderList();
  resumeOral();
}
// 断点续学：打开页面时，自动定位到上次在练的那一句/那一篇
function resumeOral(){
  if(!window.Resume) return;
  var lm = Resume.get('oral', CHILD, 'last_mode');
  if(lm==='para'){ MODE='para'; renderChips(); updateTabs(); }
  if(MODE==='para'){
    var pi = Resume.get('oral', CHILD, 'last_para');
    if(pi!=null && PARAS[pi]){ curParaIdx=pi; renderList(); }
    var ls = Resume.get('oral', CHILD, 'last_para_sent');
    if(ls!=null && curParaIdx!=null){ var pid=PARAS[curParaIdx].id; setTimeout(function(){ var el=document.getElementById('gloss-para-'+pid+'-'+ls); if(el){ el.scrollIntoView({block:'center'}); el.style.outline='2px solid #ffb86b'; setTimeout(function(){ el.style.outline=''; },2600); } },80); }
  } else {
    var id = Resume.get('oral', CHILD, 'last_id');
    if(id){ var el2=document.getElementById('gloss-'+id); if(el2){ setTimeout(function(){ el2.scrollIntoView({block:'center'}); el2.style.outline='2px solid #ffb86b'; setTimeout(function(){ el2.style.outline=''; },2600); },80); } }
  }
}
function renderChips(){
  var box=document.getElementById('chips'); box.innerHTML='';
  var opts=[['all','全部']].concat([1,2,3,4,5,6].map(function(g){return [String(g),g+'年级'];}));
  opts.forEach(function(o){
    var c=document.createElement('div'); c.className='chip'+(gradeFilter===o[0]?' on':'');
    c.textContent=o[1]; c.onclick=function(){ gradeFilter=o[0]; curParaIdx=null; renderChips(); renderList(); };
    box.appendChild(c);
  });
}
function renderList(){
  if(MODE==='para'){
    if(curParaIdx!==null){ renderParaDetail(); return; }
    renderParaList(); return;
  }
  var box=document.getElementById('list'); box.innerHTML='';
  SENTENCES.filter(function(s){return gradeFilter==='all'||String(s.g)===gradeFilter;})
  .forEach(function(s){
    var best=store[s.id]?('最佳 '+store[s.id]+'%'):'未练习';
    var d=document.createElement('div'); d.className='card';
    d.innerHTML='<div class="en">'+(s.dialog?'🗣️ ':'')+esc(s.en)+'</div><div class="zh">'+esc(s.zh)+'</div>'+
      '<div class="tip">💡 '+esc(s.tip)+'</div>'+
      '<div class="row"><button class="btn listen" style="background:#52b788" onclick="sentListen(\''+s.id+'\')">🔊 听</button>'+
      '<button class="btn listen" onclick="openPanel(\''+s.id+'\')">去练习</button>'+
      '<button class="btn rec" style="background:#ff7a59" onclick="toggleGloss(\'gloss-'+s.id+'\')">🔤逐字</button>'+
      '<span class="best">'+best+'</span></div>'+
      '<div class="pgloss" id="gloss-'+s.id+'" data-en="'+esc(s.en)+'"></div>';
    box.appendChild(d);
  });
}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
// 逐字翻译：显示该句英文的词对词中文（依赖 gloss.js 的 Gloss.buildPGlossHTML）
function toggleGloss(id){
  var el=document.getElementById(id); if(!el || !window.Gloss) return;
  if(el.getAttribute('data-filled')!=='1'){
    el.innerHTML=Gloss.buildPGlossHTML(el.getAttribute('data-en')||'');
    el.setAttribute('data-filled','1');
  }
  el.classList.toggle('on');
}

function findItem(id){
  if(id && id.indexOf('para-')===0){
    var parts=id.split('-'); // para-<pid>-<i>
    var p=PARAS.find(function(x){return x.id===parts[1];});
    var i=parseInt(parts[2],10);
    if(p&&p.sents[i]) return {en:p.sents[i].en, zh:'', tip:p.sents[i].tip||'', g:p.g};
    return null;
  }
  return SENTENCES.find(function(x){return x.id===id;})||null;
}

function openPanel(id){
  var s=findItem(id); if(!s) return;
  curId=id;
  // 断点续学：记住上次练的是哪句/哪篇
  if(window.Resume){
    Resume.set('oral', CHILD, 'last_id', id);
    Resume.set('oral', CHILD, 'last_mode', MODE);
    if(id && id.indexOf('para-')===0){
      var _pp=id.split('-'); var _p=PARAS.find(function(x){return x.id===_pp[1];});
      if(_p){ Resume.set('oral', CHILD, 'last_para', PARAS.indexOf(_p)); Resume.set('oral', CHILD, 'last_para_sent', parseInt(_pp[2],10)); }
    }
  }
  document.getElementById('pG').textContent=s.g+'年级';
  document.getElementById('pEn').textContent=s.en;
  document.getElementById('pZh').textContent=s.zh||'';
  document.getElementById('pTip').textContent='💡 '+(s.tip||'');
  var pg=document.getElementById('pGloss'); if(pg){ pg.setAttribute('data-en', s.en); pg.removeAttribute('data-filled'); pg.classList.remove('on'); }
  document.getElementById('said').innerHTML='';
  document.getElementById('status').textContent='';
  document.getElementById('scoreBox').style.display='none';
  document.getElementById('selfBox').style.display = SR ? 'none' : 'block';
  resetSelfStars();
  document.getElementById('panel').style.display='flex';
}
function closePanel(){ document.getElementById('panel').style.display='none'; if(recognizing) stopRec(); renderList(); }

function listen(){
  var s=findItem(curId);
  if(window.Speech&&Speech.speak) Speech.speak((s.en||'').replace(/[AB]:\s*/g,''), 0.9);
}
// 句子列表「🔊 听」：无需进面板，点一下即朗读该句
function sentListen(id){
  var s=findItem(id);
  if(s&&window.Speech&&Speech.speak) Speech.speak((s.en||'').replace(/[AB]:\s*/g,''), 0.9);
}
function norm(t){ return (t||'').toLowerCase().replace(/[^a-z0-9\s']/g,' ').replace(/\s+/g,' ').trim(); }
function scoreOf(target, said){
  var t=norm(target).split(' ').filter(Boolean);
  var s=norm(said).split(' ').filter(Boolean);
  if(!t.length) return 0;
  var setT={}, setS={};
  t.forEach(function(w){ setT[w]=(setT[w]||0)+1; });
  s.forEach(function(w){ setS[w]=(setS[w]||0)+1; });
  var hit=0;
  Object.keys(setT).forEach(function(w){ hit+=Math.min(setS[w]||0, setT[w]); });
  return Math.round(hit/t.length*100);
}
function starsOf(p){ return p>=90?5 : p>=75?4 : p>=60?3 : p>=40?2 : 1; }

function startRec(){
  if(!SR){ document.getElementById('status').textContent='本浏览器不支持语音识别，请改用下方自评～'; return; }
  if(recognizing){ stopRec(); return; }
  if(!rec){
    rec=new SR(); rec.lang='en-US'; rec.interimResults=false; rec.maxAlternatives=1;
    rec.onresult=function(e){
      var txt=e.results[0][0].transcript;
      showSaid(txt);
      var s=findItem(curId);
      var target=(s.en||'').replace(/[AB]:\s*/g,'');
      var pct=scoreOf(target, txt);
      showScore(pct);
    };
    rec.onerror=function(e){ document.getElementById('status').textContent='识别出错：'+(e.error||'未知')+'，再试一次～'; stopRec(); };
    rec.onend=function(){ stopRec(); };
  }
  try{ rec.start(); recognizing=true;
    document.getElementById('recBtn').classList.add('on'); document.getElementById('recBtn').textContent='⏹ 停止';
    document.getElementById('status').textContent='请跟着读出来…';
  }catch(e){ document.getElementById('status').textContent='无法启动麦克风，请检查权限。'; }
}
function stopRec(){ recognizing=false; if(rec&&rec.stop) try{rec.stop();}catch(e){}
  document.getElementById('recBtn').classList.remove('on'); document.getElementById('recBtn').textContent='🎤 开始跟读'; }
function showSaid(txt){ document.getElementById('said').innerHTML='你说：<b>'+esc(txt)+'</b>'; }
function showScore(pct){
  document.getElementById('status').textContent='';
  document.getElementById('scoreBox').style.display='block';
  document.getElementById('pct').textContent=pct+'%';
  var n=starsOf(pct); var str=''; for(var i=0;i<5;i++) str+= i<n?'⭐':'☆';
  document.getElementById('stars').textContent=str;
  var prev=store[curId]||0; if(pct>prev){ store[curId]=pct; saveStore(); }
  if(pct>=60) setTimeout(celebrate, 350);
  if(curId && curId.indexOf('para-')===0){ var pp=curId.split('-'); checkParaDone(pp[1]); }
}
function checkParaDone(pId){
  var p=PARAS.find(function(x){return x.id===pId;}); if(!p) return;
  var all=p.sents.every(function(_,i){ return store['para-'+pId+'-'+i]!=null; });
  if(all) setTimeout(celebrate, 350);
}
function resetSelfStars(){ var els=document.querySelectorAll('.self .st'); els.forEach(function(e){e.classList.remove('on');}); }
function selfRate(v){
  resetSelfStars();
  var els=document.querySelectorAll('.self .st');
  for(var i=0;i<v;i++) els[i].classList.add('on');
  var prev=store[curId]||0; if(v*20>prev){ store[curId]=v*20; saveStore(); }
  if(v>=4) setTimeout(celebrate, 300);
}
function celebrate(){ document.getElementById('celeb').style.display='flex'; }
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

function setMode(m){ MODE=m; curParaIdx=null; renderChips(); updateTabs(); renderList(); }
function updateTabs(){ var t=document.getElementById('tabs'); if(!t) return; t.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-m')===MODE); }); }
function renderParaList(){
  var box=document.getElementById('list'); box.innerHTML='';
  var items=PARAS.filter(function(p){return gradeFilter==='all'||String(p.g)===gradeFilter;});
  if(!items.length){ box.innerHTML='<div class="tip">该年级暂无短文，换个年级看看～</div>'; return; }
  items.forEach(function(p){
    var all=p.sents.every(function(_,i){return store['para-'+p.id+'-'+i]!=null;});
    var d=document.createElement('div'); d.className='card';
    d.innerHTML='<div class="en">📄 '+esc(p.title)+'</div><div class="zh">'+esc(p.zh)+'</div>'+
      (all?'<div class="best">✓ 已读完</div>':'<div class="zh">'+p.sents.length+' 句 · 点开逐句跟读</div>');
    d.onclick=function(){ curParaIdx=PARAS.indexOf(p); if(window.Resume){ Resume.set('oral', CHILD, 'last_para', curParaIdx); Resume.set('oral', CHILD, 'last_mode', 'para'); } renderList(); };
    box.appendChild(d);
  });
}
function renderParaDetail(){
  var p=PARAS[curParaIdx]; if(!p){ curParaIdx=null; renderList(); return; }
  var box=document.getElementById('list'); box.innerHTML='';
  var h=document.createElement('button'); h.className='back'; h.textContent='← 返回短文列表'; h.onclick=function(){ curParaIdx=null; renderList(); };
  box.appendChild(h);
  var t=document.createElement('div'); t.style.cssText='font-size:18px;font-weight:800;color:#1f2a44;margin:4px 2px 2px;';
  t.textContent='📄 '+p.title+'（'+p.g+'年级）'; box.appendChild(t);
  var z=document.createElement('div'); z.style.cssText='font-size:13px;color:#7a89a8;margin:0 2px 12px;';
  z.textContent='📖 '+p.zh; box.appendChild(z);
  p.sents.forEach(function(s,i){
    var best=store['para-'+p.id+'-'+i];
    var row=document.createElement('div'); row.className='prow';
    row.innerHTML='<div class="pen">'+esc(s.en)+'</div>'+
      '<div class="pact"><button class="btn listen" onclick="paraListen(\''+p.id+'\','+i+')">🔊 听这句</button>'+
      '<button class="btn rec" onclick="openPanel(\'para-'+p.id+'-'+i+'\')">🎤 读这句</button>'+
      '<button class="btn rec" style="background:#ff7a59" onclick="toggleGloss(\'gloss-para-'+p.id+'-'+i+'\')">🔤逐字</button>'+
      (best!=null?'<span class="best">最佳 '+best+'%</span>':'')+'</div>'+
      '<div class="pgloss" id="gloss-para-'+p.id+'-'+i+'" data-en="'+esc(s.en)+'"></div>';
    box.appendChild(row);
  });
}
function paraListen(pId,i){ var p=PARAS.find(function(x){return x.id===pId;}); if(p&&window.Speech&&Speech.speak) Speech.speak(p.sents[i].en,0.9); }

init();
</script>
