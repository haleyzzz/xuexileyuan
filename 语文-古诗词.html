<style>
  :root{
    --pink:#ff8fab; --orange:#ff9f1c; --green:#06d6a0; --blue:#4cc9f0;
    --purple:#b292ff; --ink:#3d3a4b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#fff8ef,#fdeff4);color:var(--ink);
    padding:18px;max-width:560px;margin:0 auto;min-height:100vh;overflow-x:hidden}
  .back{position:fixed;left:14px;top:14px;z-index:30;border:none;background:rgba(255,255,255,.85);
    border-radius:12px;padding:8px 12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--ink)}
  header{background:linear-gradient(120deg,var(--pink),var(--orange));color:#fff;
    border-radius:24px;padding:20px;text-align:center;box-shadow:0 8px 22px rgba(255,143,171,.4)}
  header h1{font-size:22px}
  .date{font-size:14px;opacity:.95;margin-top:4px}
  .stats{display:flex;gap:10px;margin:14px 0}
  .stat{flex:1;background:#fff;border-radius:18px;padding:12px;text-align:center;
    box-shadow:0 4px 12px rgba(0,0,0,.06)}
  .stat .num{font-size:26px;font-weight:800;color:var(--orange)}
  .stat .lbl{font-size:12px;color:#999;margin-top:2px}
  h2{font-size:17px;margin:18px 4px 10px;display:flex;align-items:center;gap:8px}

  .poems{display:flex;flex-direction:column;gap:12px}
  .poem{background:#fff;border-radius:20px;box-shadow:0 4px 12px rgba(0,0,0,.06);
    overflow:hidden;border:3px solid transparent;transition:border-color .2s}
  .poem.done{border-color:var(--pink)}
  .pfront{padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer}
  .pfront .pemoji{font-size:34px;flex-shrink:0}
  .pfront .ptxt{flex:1}
  .pfront .pname{font-size:17px;font-weight:800}
  .pfront .pauth{font-size:13px;color:#aaa;margin-top:3px}
  .pfront .parrow{font-size:22px;color:var(--orange);flex-shrink:0}
  .pback{padding:4px 16px 16px}
  .pback .verse{font-size:18px;font-weight:700;line-height:1.9;text-align:center;color:var(--ink)}
  .pback .trans{font-size:14px;color:#777;line-height:1.7;margin:10px 0;background:#fff6f9;border-radius:12px;padding:10px}
  .pback .pbtns{display:flex;gap:10px;margin-top:6px}
  .pback .pbtns button{flex:1;border:none;border-radius:14px;padding:10px;font-size:14px;
    font-family:inherit;cursor:pointer;font-weight:700;color:#fff}
  .b-read{background:var(--purple)}
  .b-back{background:var(--orange)}
  .pmark{width:100%;border:none;border-top:1px solid #f0f0f0;background:#fff;
    padding:12px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;color:#bbb}
  .poem.done .pmark{color:var(--pink);background:#fff0f5}
  .grade-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;
    background:var(--blue);border-radius:8px;padding:1px 7px;margin-left:8px;vertical-align:middle}
  .grade-filter{display:flex;align-items:center;gap:8px;margin:12px 2px 2px;font-size:13px;color:#888}
  .grade-filter select{border:1px solid #ffd6e2;border-radius:12px;padding:7px 10px;font-size:14px;
    font-family:inherit;color:var(--ink);background:#fff;cursor:pointer;flex:1}
  .mark-ic{display:inline-block;width:20px}

  .progress{height:14px;background:#ffe3ec;border-radius:10px;overflow:hidden;margin:14px 0 4px}
  .progress > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--orange));
    border-radius:10px;transition:width .4s}
  .prog-txt{font-size:13px;color:#888;text-align:center}
  .reset{background:none;border:none;color:#bbb;font-size:12px;cursor:pointer;
    text-decoration:underline;display:block;margin:10px auto 0;font-family:inherit}
  .tip{font-size:12px;color:#aaa;text-align:center;margin-top:14px;line-height:1.6}
  .confetti{position:fixed;top:-40px;font-size:24px;pointer-events:none;z-index:99;
    animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}
  .celebrate{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;
    align-items:center;justify-content:center;z-index:100}
  .celebrate .box2{background:#fff;border-radius:24px;padding:28px 34px;text-align:center;animation:pop .4s;max-width:320px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .celebrate h3{font-size:24px;margin-bottom:8px}
  .celebrate p{color:#888;font-size:14px;line-height:1.6}
  .celebrate button{margin-top:16px;border:none;background:var(--orange);color:#fff;
    padding:11px 26px;border-radius:14px;font-size:15px;font-family:inherit;cursor:pointer;font-weight:700}
</style>
<script>
/* iOS 朗读稳定性补丁：保留 utterance 全局引用防 GC 静音 + 朗读前 resume()（与 speech.js 同逻辑，本页未引 speech.js 故内联） */
(function(){ if(window.__ttsPatched) return; window.__ttsPatched=true;
  if(!window.speechSynthesis) return;
  var _sp=window.speechSynthesis.speak.bind(window.speechSynthesis);
  window.speechSynthesis.speak=function(u){ try{window.speechSynthesis.resume();}catch(e){} window.__ttsUtt=u; return _sp(u); };
})();
</script>

<script>
var POEMS=[
  {"id":"jys","emoji":"🌙","name":"静夜思","auth":"李白·唐","verse":"床前明月光，疑是地上霜。<br>举头望明月，低头思故乡。","trans":"明亮的月光洒在床前，好像地上泛起了一层白霜。我抬起头望着天上的明月，又低下头思念起远方的家乡。"},
  {"id":"cx","emoji":"🐦","name":"春晓","auth":"孟浩然·唐","verse":"春眠不觉晓，处处闻啼鸟。<br>夜来风雨声，花落知多少。","trans":"春日里酣睡不知不觉天已破晓，到处都能听到鸟儿的啼鸣。昨夜风声雨声不断，不知吹落了多少花朵。"},
  {"id":"ye","emoji":"🦢","name":"咏鹅","auth":"骆宾王·唐","verse":"鹅，鹅，鹅，曲项向天歌。<br>白毛浮绿水，红掌拨清波。","trans":"鹅，鹅，鹅，弯着脖子朝天欢叫。洁白的羽毛浮在碧绿的水面，红红的脚掌拨动着清清的水波。"},
  {"id":"mn","emoji":"🌾","name":"悯农","auth":"李绅·唐","verse":"锄禾日当午，汗滴禾下土。<br>谁知盘中餐，粒粒皆辛苦。","trans":"农民在正午烈日下锄禾，汗水滴落在禾苗下的泥土里。谁又知道盘中的饭食，每一粒都包含着农民的辛苦。"},
  {"id":"dgql","emoji":"🏞️","name":"登鹳雀楼","auth":"王之涣·唐","verse":"白日依山尽，黄河入海流。<br>欲穷千里目，更上一层楼。","trans":"夕阳依傍着山峦渐渐沉落，滔滔黄河朝着大海奔流。若想把千里的风光看够，就要登上更高的一层城楼。"},
  {"id":"glyx","emoji":"🌕","name":"古朗月行（节选）","auth":"李白·唐","verse":"小时不识月，呼作白玉盘。","trans":"小时候不认识月亮，把它称作白玉做的大盘子。"},
  {"id":"f","emoji":"🍃","name":"风","auth":"李峤·唐","verse":"解落三秋叶，能开二月花。<br>过江千尺浪，入竹万竿斜。","trans":"能吹落秋天的树叶，能催开春天的鲜花。刮过江面能掀起千尺巨浪，吹进竹林使万竿竹子倾斜。"},
  {"id":"lz","emoji":"🌲","name":"鹿柴","auth":"王维·唐","verse":"空山不见人，但闻人语响。<br>返景入深林，复照青苔上。","trans":"幽静的山中看不见人，只听见人说话的声音。落日的余晖射入深林，又照在青苔之上。"},
  {"id":"clg","emoji":"🐑","name":"敕勒歌","auth":"北朝民歌","verse":"敕勒川，阴山下。<br>天似穹庐，笼盖四野。<br>天苍苍，野茫茫，风吹草低见牛羊。","trans":"敕勒川在阴山脚下。天空像毡帐一样，笼罩着四面的原野。天色青苍，原野茫茫，风吹草动时低下草丛现出牛羊。"},
  {"id":"cj","emoji":"🪁","name":"村居","auth":"高鼎·清","verse":"草长莺飞二月天，拂堤杨柳醉春烟。<br>儿童散学归来早，忙趁东风放纸鸢。","trans":"农历二月青草发芽黄莺飞舞，柳枝拂堤如醉在春烟里。孩子们放学早早回来，忙着趁着东风把风筝放飞上天。"},
  {"id":"jn","emoji":"🪷","name":"江南","auth":"汉乐府","verse":"江南可采莲，莲叶何田田。<br>鱼戏莲叶间。<br>鱼戏莲叶东，鱼戏莲叶西，<br>鱼戏莲叶南，鱼戏莲叶北。","trans":"江南又到了采莲的季节，莲叶浮出水面挨挨挤挤多么茂盛。鱼儿在莲叶间嬉戏，一会儿游到莲叶东，一会儿游到莲叶西，一会儿游到莲叶南，一会儿游到莲叶北。"},
  {"id":"yl","emoji":"🌿","name":"咏柳","auth":"贺知章·唐","verse":"碧玉妆成一树高，万条垂下绿丝绦。<br>不知细叶谁裁出，二月春风似剪刀。","trans":"高高的柳树像是用碧玉装扮而成，万千枝条垂下如同绿色的丝带。不知道这细细的柳叶是谁裁剪出来的，二月的春风就像一把灵巧的剪刀。"},
  {"id":"lzw","emoji":"🍷","name":"凉州词","auth":"王翰·唐","verse":"葡萄美酒夜光杯，欲饮琵琶马上催。<br>醉卧沙场君莫笑，古来征战几人回？","trans":"晶莹的夜光杯里盛满了葡萄美酒，正要举杯痛饮却听到马上琵琶声催人出征。即使醉倒沙场也请你不要笑话，从古至今出外打仗的能有几人返回家乡？"},
  {"id":"cs","emoji":"🏯","name":"出塞","auth":"王昌龄·唐","verse":"秦时明月汉时关，万里长征人未还。<br>但使龙城飞将在，不教胡马度阴山。","trans":"依然是秦汉时的明月和边关，远征万里的将士至今没有归还。要是飞将军李广还守在这里，绝不会让敌人的骑兵越过阴山。"},
  {"id":"fl","emoji":"🌧️","name":"芙蓉楼送辛渐","auth":"王昌龄·唐","verse":"寒雨连江夜入吴，平明送客楚山孤。<br>洛阳亲友如相问，一片冰心在玉壶。","trans":"冷雨连着江面在夜里来到吴地，天亮送别好友只留下楚山孤单。洛阳的亲友如果问起我，就说我的心像玉壶里的冰一样纯洁。"},
  {"id":"sy","emoji":"🚪","name":"送元二使安西","auth":"王维·唐","verse":"渭城朝雨浥轻尘，客舍青青柳色新。<br>劝君更尽一杯酒，西出阳关无故人。","trans":"清晨的细雨湿润了渭城的尘土，客舍旁柳树青翠柳色一新。劝你再喝下这一杯酒吧，向西出了阳关就难再见老朋友了。"},
  {"id":"jj","emoji":"🎑","name":"九月九日忆山东兄弟","auth":"王维·唐","verse":"独在异乡为异客，每逢佳节倍思亲。<br>遥知兄弟登高处，遍插茱萸少一人。","trans":"独自漂泊在他乡做异乡之客，每到佳节就加倍思念亲人。远远想到兄弟们登高望远，人人插戴茱萸却少了我一个人。"},
  {"id":"wl","emoji":"💦","name":"望庐山瀑布","auth":"李白·唐","verse":"日照香炉生紫烟，遥看瀑布挂前川。<br>飞流直下三千尺，疑是银河落九天。","trans":"太阳照着香炉峰升起紫色烟霞，远远望去瀑布像一条白练挂在山前。水流从高处飞奔直泻长达三千尺，让人怀疑是银河从九天倾落下来。"},
  {"id":"zw","emoji":"⛵","name":"赠汪伦","auth":"李白·唐","verse":"李白乘舟将欲行，忽闻岸上踏歌声。<br>桃花潭水深千尺，不及汪伦送我情。","trans":"李白坐上小船正要启程，忽然听到岸上传来踏歌送行的声音。桃花潭的水即使有千尺深，也比不上汪伦送别我的情谊深厚。"},
  {"id":"hh","emoji":"🏯","name":"黄鹤楼送孟浩然之广陵","auth":"李白·唐","verse":"故人西辞黄鹤楼，烟花三月下扬州。<br>孤帆远影碧空尽，唯见长江天际流。","trans":"老朋友在黄鹤楼向我告别，在繁花似锦的三月顺流而下前往扬州。孤船的帆影渐渐远去消失在碧空尽头，只看见长江浩浩荡荡流向天边。"},
  {"id":"zf","emoji":"⛰️","name":"早发白帝城","auth":"李白·唐","verse":"朝辞白帝彩云间，千里江陵一日还。<br>两岸猿声啼不住，轻舟已过万重山。","trans":"清晨告别彩云缭绕的白帝城，相距千里的江陵一天就能到达。两岸猿猴的啼声还在耳边回响，轻快的小船早已驶过万重山峦。"},
  {"id":"wt","emoji":"🌊","name":"望天门山","auth":"李白·唐","verse":"天门中断楚江开，碧水东流至此回。<br>两岸青山相对出，孤帆一片日边来。","trans":"天门山被长江从中间劈开，碧绿的江水东流到这里回旋。两岸青山隔江对峙迎面而出，一片孤帆从太阳那边缓缓驶来。"},
  {"id":"bd","emoji":"🌬️","name":"别董大","auth":"高适·唐","verse":"千里黄云白日曛，北风吹雁雪纷纷。<br>莫愁前路无知己，天下谁人不识君。","trans":"千里黄云遮天蔽日天色昏暗，北风吹送大雁雪花纷纷飘落。不要担心前面没有知心朋友，天下有谁不认识您呢。"},
  {"id":"jj2","emoji":"🐦","name":"绝句（两个黄鹂）","auth":"杜甫·唐","verse":"两个黄鹂鸣翠柳，一行白鹭上青天。<br>窗含西岭千秋雪，门泊东吴万里船。","trans":"两只黄鹂在翠绿的柳枝上欢鸣，一行白鹭飞向蔚蓝的天空。窗口正对着西岭千年不化的积雪，门外停泊着驶往东吴的万里航船。"},
  {"id":"jj3","emoji":"🌸","name":"绝句（迟日江山丽）","auth":"杜甫·唐","verse":"迟日江山丽，春风花草香。<br>泥融飞燕子，沙暖睡鸳鸯。","trans":"春日里江山分外秀丽，春风送来花草的清香。泥土松软燕子飞来飞去衔泥筑巢，沙地温暖鸳鸯静睡成对。"},
  {"id":"jp","emoji":"🌸","name":"江畔独步寻花","auth":"杜甫·唐","verse":"黄四娘家花满蹊，千朵万朵压枝低。<br>留连戏蝶时时舞，自在娇莺恰恰啼。","trans":"黄四娘家的小路上开满鲜花，成千上万朵压得枝条弯下身。嬉戏的蝴蝶恋恋不舍时时飞舞，自由自在的黄莺恰恰啼鸣。"},
  {"id":"fq","emoji":"🌙","name":"枫桥夜泊","auth":"张继·唐","verse":"月落乌啼霜满天，江枫渔火对愁眠。<br>姑苏城外寒山寺，夜半钟声到客船。","trans":"月已落下乌鸦啼叫寒霜满天，江边的枫树渔家的灯火伴着愁人难眠。姑苏城外那座寒山寺，半夜的钟声传到了我的客船。"},
  {"id":"yz","emoji":"💕","name":"游子吟","auth":"孟郊·唐","verse":"慈母手中线，游子身上衣。<br>临行密密缝，意恐迟迟归。<br>谁言寸草心，报得三春晖。","trans":"慈爱的母亲手里拿着针线，为远行的孩子赶制身上的衣衫。临行前缝得针脚细密，心里担心孩子迟迟不回还。谁说儿女像小草那样微弱的孝心，能报答得了春晖般深厚的母爱。"},
  {"id":"jx","emoji":"❄️","name":"江雪","auth":"柳宗元·唐","verse":"千山鸟飞绝，万径人踪灭。<br>孤舟蓑笠翁，独钓寒江雪。","trans":"千座山里鸟儿全都飞尽，万条路上行人踪影皆无。江上孤舟里披蓑戴笠的老翁，独自在漫天风雪的寒江上垂钓。"},
  {"id":"fd","emoji":"🌱","name":"赋得古原草送别","auth":"白居易·唐","verse":"离离原上草，一岁一枯荣。<br>野火烧不尽，春风吹又生。","trans":"原野上茂盛的青草，每年枯萎一次又繁荣一次。野火再猛也烧不完它，春风一吹它又生长出来。"},
  {"id":"cs2","emoji":"🪷","name":"池上","auth":"白居易·唐","verse":"小娃撑小艇，偷采白莲回。<br>不解藏踪迹，浮萍一道开。","trans":"小孩儿撑着小船，偷偷采了白莲回来。他还不懂得掩藏踪迹，小船划过浮萍分出一道水路。"},
  {"id":"yjn","emoji":"🌊","name":"忆江南","auth":"白居易·唐","verse":"江南好，风景旧曾谙。<br>日出江花红胜火，春来江水绿如蓝。<br>能不忆江南？","trans":"江南真美好，那里的风景我从前就很熟悉。太阳升起江边的花朵红得胜过火焰，春天来到江水绿得如同蓝草。叫我怎能不回忆江南？"},
  {"id":"mn2","emoji":"🌾","name":"悯农（其二）","auth":"李绅·唐","verse":"春种一粒粟，秋收万颗子。<br>四海无闲田，农夫犹饿死。","trans":"春天种下一粒种子，秋天收获万颗粮食。天下没有一块荒废的田地，可种田的农民仍然活活饿死。"},
  {"id":"xy","emoji":"🧘","name":"寻隐者不遇","auth":"贾岛·唐","verse":"松下问童子，言师采药去。<br>只在此山中，云深不知处。","trans":"在松树下询问童子，他说师父采药去了。就在这座大山之中，可是云雾深深不知他究竟在何处。"},
  {"id":"ss","emoji":"🍁","name":"山行","auth":"杜牧·唐","verse":"远上寒山石径斜，白云生处有人家。<br>停车坐爱枫林晚，霜叶红于二月花。","trans":"沿着弯斜的石头小路登上远处的寒山，白云缭绕的地方隐约有几户人家。停下车来是因为喜爱傍晚的枫林，经霜的枫叶比二月的春花还要红艳。"},
  {"id":"qm","emoji":"🌧️","name":"清明","auth":"杜牧·唐","verse":"清明时节雨纷纷，路上行人欲断魂。<br>借问酒家何处有，牧童遥指杏花村。","trans":"清明时节细雨纷纷飘洒，路上行人个个失魂落魄。请问哪里有卖酒的店家，牧童远远指向杏花深处的村庄。"},
  {"id":"jnc","emoji":"🌸","name":"江南春","auth":"杜牧·唐","verse":"千里莺啼绿映红，水村山郭酒旗风。<br>南朝四百八十寺，多少楼台烟雨中。","trans":"千里江南黄莺啼鸣绿树红花相映，水乡山城酒旗在风中飘动。南朝留下的四百八十座寺庙，多少楼台亭阁掩映在迷茫烟雨中。"},
  {"id":"feng","emoji":"🐝","name":"蜂","auth":"罗隐·唐","verse":"不论平地与山尖，无限风光尽被占。<br>采得百花成蜜后，为谁辛苦为谁甜？","trans":"无论是在平地还是山顶，凡是风光美好的地方都被蜜蜂占遍。它们采尽百花酿成蜂蜜之后，到底是为谁辛苦为谁带来甜蜜呢？"},
  {"id":"yr","emoji":"🧨","name":"元日","auth":"王安石·宋","verse":"爆竹声中一岁除，春风送暖入屠苏。<br>千门万户曈曈日，总把新桃换旧符。","trans":"在爆竹声中送走旧的一年，春风送来暖意人们畅饮屠苏酒。初升的太阳照亮千家万户，人们总把旧的桃符换成新的门神。"},
  {"id":"yh","emoji":"🌊","name":"饮湖上初晴后雨","auth":"苏轼·宋","verse":"水光潋滟晴方好，山色空蒙雨亦奇。<br>欲把西湖比西子，淡妆浓抹总相宜。","trans":"晴天里湖水波光闪动多么美好，雨中山色迷蒙也显得奇妙。若把西湖比作美人西施，无论淡妆还是浓抹都那么合适。"},
  {"id":"tx","emoji":"⛰️","name":"题西林壁","auth":"苏轼·宋","verse":"横看成岭侧成峰，远近高低各不同。<br>不识庐山真面目，只缘身在此山中。","trans":"横着看是连绵山岭侧面看是座座山峰，从远近高低看各不相同。认不清庐山真正的面貌，只因为自己就在这座山中。"},
  {"id":"xr","emoji":"⚔️","name":"夏日绝句","auth":"李清照·宋","verse":"生当作人杰，死亦为鬼雄。<br>至今思项羽，不肯过江东。","trans":"活着应当做人中豪杰，死了也要做鬼中英雄。直到今天人们还思念项羽，因为他宁死不肯退回江东。"},
  {"id":"xc","emoji":"💧","name":"小池","auth":"杨万里·宋","verse":"泉眼无声惜细流，树阴照水爱晴柔。<br>小荷才露尖尖角，早有蜻蜓立上头。","trans":"泉眼静悄悄舍不得细细的水流，树影映在水面喜爱晴天的温柔。小小的荷叶才露出尖尖的角，早有蜻蜓立在它的上头。"},
  {"id":"xc2","emoji":"🪷","name":"晓出净慈寺送林子方","auth":"杨万里·宋","verse":"毕竟西湖六月中，风光不与四时同。<br>接天莲叶无穷碧，映日荷花别样红。","trans":"到底是六月的西湖，风光与其他季节大不相同。莲叶无边无际仿佛与天相接一片碧绿，朝阳映照下的荷花格外鲜红。"},
  {"id":"cr","emoji":"🌸","name":"春日","auth":"朱熹·宋","verse":"胜日寻芳泗水滨，无边光景一时新。<br>等闲识得东风面，万紫千红总是春。","trans":"良辰佳节来到泗水边踏青赏花，无边风光一下子焕然一新。轻易便能认出春风的面貌，万紫千红的花朵处处都是春天。"},
  {"id":"yy","emoji":"🌸","name":"游园不值","auth":"叶绍翁·宋","verse":"应怜屐齿印苍苔，小扣柴扉久不开。<br>春色满园关不住，一枝红杏出墙来。","trans":"也许是园主爱惜青苔怕被木屐踩坏，我轻轻敲门许久也没人开。满园的春色是关不住的，一枝红杏早已探出墙外。"},
  {"id":"mm","emoji":"⚫","name":"墨梅","auth":"王冕·元","verse":"我家洗砚池头树，朵朵花开淡墨痕。<br>不要人夸好颜色，只留清气满乾坤。","trans":"我家洗砚池边有棵梅树，朵朵花开都带着淡淡的墨痕。不需要别人夸赞颜色好看，只愿把清香之气留在天地之间。"},
  {"id":"sj","emoji":"🐂","name":"所见","auth":"袁枚·清","verse":"牧童骑黄牛，歌声振林樾。<br>意欲捕鸣蝉，忽然闭口立。","trans":"牧童骑在黄牛背上，嘹亮的歌声在林中回荡。忽然想要捕捉树上鸣叫的蝉，立刻闭紧嘴巴站立不动。"},
  {"id":"cgx","emoji":"🌱","name":"长歌行","auth":"汉乐府","verse":"青青园中葵，朝露待日晞。<br>阳春布德泽，万物生光辉。<br>常恐秋节至，焜黄华叶衰。<br>百川东到海，何时复西归？<br>少壮不努力，老大徒伤悲。","trans":"园中葵菜青青，晨露等待阳光晒干。春天散布恩泽，万物焕发光彩。常怕秋天到来花叶枯黄凋零。百川奔腾东入大海，何时才能向西回流？年轻时不努力，年老时只能白白悲伤。"},
  {"id":"hxos","emoji":"🏠","name":"回乡偶书","auth":"贺知章·唐","verse":"少小离家老大回，乡音无改鬓毛衰。<br>儿童相见不相识，笑问客从何处来。","trans":"年少时离开家乡年老才回来，口音没变头发却已斑白。村里的孩子见了我都不认识，笑着问我这客人从哪儿来。"},
  {"id":"wzh","emoji":"🏯","name":"凉州词","auth":"王之涣·唐","verse":"黄河远上白云间，一片孤城万仞山。<br>羌笛何须怨杨柳，春风不度玉门关。","trans":"奔腾的黄河仿佛直上白云之间，一座孤城坐落在万仞高山。羌笛何必吹奏哀怨的折杨柳，春风根本吹不到遥远的玉门关。"},
  {"id":"cyxy","emoji":"🌧️","name":"春夜喜雨","auth":"杜甫·唐","verse":"好雨知时节，当春乃发生。<br>随风潜入夜，润物细无声。<br>野径云俱黑，江船火独明。<br>晓看红湿处，花重锦官城。","trans":"好雨似乎懂得时令，正当春天便降临。随着微风悄悄在夜里飘洒，滋润万物细腻无声。野外小路和云天一片漆黑，只有江船灯火独自明亮。清晨看那被雨水打湿的花丛，锦官城定是繁花沉甸甸。"},
  {"id":"czxj","emoji":"🌿","name":"滁州西涧","auth":"韦应物·唐","verse":"独怜幽草涧边生，上有黄鹂深树鸣。<br>春潮带雨晚来急，野渡无人舟自横。","trans":"我最爱涧边生长的幽幽野草，上面有黄鹂在密林深处啼鸣。春潮裹着夜雨在傍晚来得急猛，荒野渡口无人小船独自横在水面。"},
  {"id":"zc","emoji":"🌸","name":"早春呈水部张十八员外","auth":"韩愈·唐","verse":"天街小雨润如酥，草色遥看近却无。<br>最是一年春好处，绝胜烟柳满皇都。","trans":"京城街道的小雨滋润如酥油，远望草色嫩绿近看却几乎没有。这正是一年春天最好的时节，远远胜过烟柳满城的晚春皇都。"},
  {"id":"ygz","emoji":"🐟","name":"渔歌子","auth":"张志和·唐","verse":"西塞山前白鹭飞，桃花流水鳜鱼肥。<br>青箬笠，绿蓑衣，斜风细雨不须归。","trans":"西塞山前白鹭自由飞翔，桃花盛开春水初涨鳜鱼肥美。头戴青竹笠身披绿蓑衣，斜风细雨中垂钓不想回家。"},
  {"id":"xxl","emoji":"❄️","name":"塞下曲","auth":"卢纶·唐","verse":"月黑雁飞高，单于夜遁逃。<br>欲将轻骑逐，大雪满弓刀。","trans":"夜黑云低大雁高飞，敌军首领趁夜逃跑。将军正要带领轻骑兵追击，大雪纷飞落满弓刀。"},
  {"id":"wdt","emoji":"🌊","name":"望洞庭","auth":"刘禹锡·唐","verse":"湖光秋月两相和，潭面无风镜未磨。<br>遥望洞庭山水翠，白银盘里一青螺。","trans":"洞庭湖的波光与秋月交相辉映，湖面无风像未打磨的铜镜。远望洞庭山水一片葱翠，仿佛白银盘里托着一只青螺。"},
  {"id":"lts","emoji":"🌊","name":"浪淘沙","auth":"刘禹锡·唐","verse":"九曲黄河万里沙，浪淘风簸自天涯。<br>如今直上银河去，同到牵牛织女家。","trans":"弯弯曲曲的黄河卷着万里黄沙，风浪颠簸仿佛来自天边。如今我要沿着黄河直上银河，一起去寻访牛郎织女的家。"},
  {"id":"xech","emoji":"🎣","name":"小儿垂钓","auth":"胡令能·唐","verse":"蓬头稚子学垂纶，侧坐莓苔草映身。<br>路人借问遥招手，怕得鱼惊不应人。","trans":"一个头发蓬乱的小孩学着钓鱼，侧身坐在青苔上野草遮住身影。路人向他问路他远远招手，只怕惊跑鱼儿不敢回应。"},
  {"id":"jsyl","emoji":"🚣","name":"江上渔者","auth":"范仲淹·宋","verse":"江上往来人，但爱鲈鱼美。<br>君看一叶舟，出没风波里。","trans":"江上来来往往的人，只喜爱鲈鱼鲜美。请你看那一叶小渔船，在风浪中出没多么危险。"},
  {"id":"bcgz","emoji":"🌉","name":"泊船瓜洲","auth":"王安石·宋","verse":"京口瓜洲一水间，钟山只隔数重山。<br>春风又绿江南岸，明月何时照我还。","trans":"京口和瓜洲只隔着一道江水，钟山也只隔几重山峦。春风又一次吹绿了江南两岸，明月啊何时才能照我回到家乡。"},
  {"id":"shyx","emoji":"🏡","name":"书湖阴先生壁","auth":"王安石·宋","verse":"茅檐长扫净无苔，花木成畦手自栽。<br>一水护田将绿绕，两山排闼送青来。","trans":"茅草房檐常常打扫干净没有青苔，花木成行成畦都是主人亲手栽。一条溪水护卫田园将绿苗环绕，两座青山推门送来青翠之色。"},
  {"id":"lwyh","emoji":"🌧️","name":"六月二十七日望湖楼醉书","auth":"苏轼·宋","verse":"黑云翻墨未遮山，白雨跳珠乱入船。<br>卷地风来忽吹散，望湖楼下水如天。","trans":"乌云像打翻的墨汁还没遮住山，白色雨点如跳珠乱蹦进船。忽然卷地狂风把云雨吹散，望湖楼下湖水像天空一样明净。"},
  {"id":"hccj","emoji":"🌸","name":"惠崇春江晚景","auth":"苏轼·宋","verse":"竹外桃花三两枝，春江水暖鸭先知。<br>蒌蒿满地芦芽短，正是河豚欲上时。","trans":"竹林外桃花初放三两枝，春江水暖鸭子最先感知。蒌蒿遍地芦苇刚冒嫩芽，正是河豚将要逆流而上的时候。"},
  {"id":"sqdz","emoji":"🌿","name":"三衢道中","auth":"曾几·宋","verse":"梅子黄时日日晴，小溪泛尽却山行。<br>绿阴不减来时路，添得黄鹂四五声。","trans":"梅子黄熟的时节天天晴朗，乘小船到小溪尽头再走山路。绿树浓荫不比来时少，还添了黄鹂四五声清脆啼鸣。"},
  {"id":"sr","emoji":"👴","name":"示儿","auth":"陆游·宋","verse":"死去元知万事空，但悲不见九州同。<br>王师北定中原日，家祭无忘告乃翁。","trans":"本知人死之后万事皆空，只悲叹没能见到国家统一。等到朝廷军队收复中原那天，家祭时别忘了告诉你的父亲。"},
  {"id":"qyjx","emoji":"🏔️","name":"秋夜将晓出篱门迎凉有感","auth":"陆游·宋","verse":"三万里河东入海，五千仞岳上摩天。<br>遗民泪尽胡尘里，南望王师又一年。","trans":"三万里黄河东流入海，五千仞华山高耸接天。沦陷区百姓在金人铁蹄下泪已流尽，南望宋军又是白白盼了一年。"},
  {"id":"sttyzh_a","emoji":"🌾","name":"四时田园杂兴","auth":"范成大·宋","verse":"昼出耘田夜绩麻，村庄儿女各当家。<br>童孙未解供耕织，也傍桑阴学种瓜。","trans":"白天去田里除草夜里搓麻，农家儿女各自担起家务。小孙儿不懂得耕田织布，也在桑树荫下学着种瓜。"},
  {"id":"gsgy","emoji":"📖","name":"观书有感","auth":"朱熹·宋","verse":"半亩方塘一鉴开，天光云影共徘徊。<br>问渠那得清如许？为有源头活水来。","trans":"半亩方塘像一面镜子展开，天光云影在水中往复徘徊。要问池塘的水为何这样清澈？因为有源头活水不断流来。"},
  {"id":"tlad","emoji":"🏯","name":"题临安邸","auth":"林升·宋","verse":"山外青山楼外楼，西湖歌舞几时休？<br>暖风熏得游人醉，直把杭州作汴州。","trans":"山外有青山楼外有高楼，西湖上的轻歌曼舞何时才罢休？暖风把游玩的人吹得如痴如醉，竟把临时避难的杭州当成了故都汴州。"},
  {"id":"xcsy","emoji":"🌾","name":"乡村四月","auth":"翁卷·宋","verse":"绿遍山原白满川，子规声里雨如烟。<br>乡村四月闲人少，才了蚕桑又插田。","trans":"山坡原野一片葱绿河水泛白光，杜鹃啼鸣中细雨如烟。乡村四月里闲人很少，刚结束养蚕采桑又要插秧。"},
  {"id":"shiy","emoji":"🪨","name":"石灰吟","auth":"于谦·明","verse":"千锤万凿出深山，烈火焚烧若等闲。<br>粉骨碎身浑不怕，要留清白在人间。","trans":"经过千万次锤打凿挖才出深山，烈火焚烧也当作平常。纵使粉身碎骨也全不害怕，只愿把清白留在人间。"},
  {"id":"zs","emoji":"🎋","name":"竹石","auth":"郑燮·清","verse":"咬定青山不放松，立根原在破岩中。<br>千磨万击还坚劲，任尔东西南北风。","trans":"竹子紧紧咬住青山绝不放松，扎根原在破碎的岩石之中。经受千万次磨难依旧坚韧挺拔，任凭你东西南北狂风呼啸。"},
  {"id":"jhzsh","emoji":"🌟","name":"己亥杂诗","auth":"龚自珍·清","verse":"九州生气恃风雷，万马齐喑究可哀。<br>我劝天公重抖擞，不拘一格降人才。","trans":"中华大地的生机要靠风雷激荡，万马无声死气沉沉实在可悲。我劝上天重新振作精神，不拘泥旧格降下各类人才。"},
  {"id":"sttyzh25","emoji":"🌾","name":"四时田园杂兴（其二十五）","auth":"范成大·宋","verse":"梅子金黄杏子肥，麦花雪白菜花稀。<br>日长篱落无人过，惟有蜻蜓蛱蝶飞。","trans":"梅子变得金黄杏子肥大，荞麦花雪白菜花稀疏。夏日白昼变长篱笆边无人经过，只有蜻蜓和蝴蝶飞来飞去。"},
  {"id":"sxssjd","emoji":"🦋","name":"宿新市徐公店","auth":"杨万里·宋","verse":"篱落疏疏一径深，树头新绿未成阴。<br>儿童急走追黄蝶，飞入菜花无处寻。","trans":"稀疏的篱笆旁一条小路伸向远方，树枝上嫩叶刚发还没成荫。孩子们奔跑着追赶黄色蝴蝶，蝴蝶飞进菜花丛里再也找不见。"},
  {"id":"qpycj","emoji":"🏡","name":"清平乐·村居","auth":"辛弃疾·宋","verse":"茅檐低小，溪上青青草。<br>醉里吴音相媚好，白发谁家翁媪？<br>大儿锄豆溪东，中儿正织鸡笼。<br>最喜小儿亡赖，溪头卧剥莲蓬。","trans":"茅草屋又低又小，溪边长满青青野草。带着醉意的吴地方言温柔好听，那白发苍苍的是谁家老夫妻？大儿子在溪东豆地里锄草，二儿子正编织鸡笼。最惹人喜爱的是小儿子顽皮，趴在溪头剥着莲蓬。"},
  {"id":"mh","emoji":"🌸","name":"梅花","auth":"王安石·宋","grade":1,"verse":"墙角数枝梅，凌寒独自开。<br>遥知不是雪，为有暗香来。","trans":"墙角有几枝梅花，冒着严寒独自开放。远远看去知道那不是雪，因为有淡淡的清香飘来。"},
  {"id":"ysss","emoji":"🏯","name":"夜宿山寺","auth":"李白·唐","grade":2,"verse":"危楼高百尺，手可摘星辰。<br>不敢高声语，恐惊天上人。","trans":"山上寺庙的高楼仿佛有百尺高，站在上面伸手就能摘下星星。不敢大声说话，生怕惊动了天上的仙人。"},
  {"id":"zyjsj","emoji":"🐟","name":"舟夜书所见","auth":"查慎行·清","grade":2,"verse":"月黑见渔灯，孤光一点萤。<br>微微风簇浪，散作满河星。","trans":"漆黑的夜里看见渔船上的灯火，孤零零的一点光像萤火虫。微风轻轻吹起波浪，灯火的倒影散开像满河的星星。"},
  {"id":"clq","emoji":"🪷","name":"采莲曲","auth":"王昌龄·唐","grade":3,"verse":"荷叶罗裙一色裁，芙蓉向脸两边开。<br>乱入池中看不见，闻歌始觉有人来。","trans":"采莲姑娘的绿罗裙像荷叶一样，粉红的脸庞像荷花在两边盛开。混入莲池再也分不清，听到歌声才发觉有人来。"},
  {"id":"zljw","emoji":"🍊","name":"赠刘景文","auth":"苏轼·宋","grade":3,"verse":"荷尽已无擎雨盖，菊残犹有傲霜枝。<br>一年好景君须记，最是橙黄橘绿时。","trans":"荷花谢了已没有撑雨的叶子，菊花残了还有傲霜的枝条。一年里最好的景色你一定要记住，正是橙子黄橘子绿的初冬时节。"},
  {"id":"ysj","emoji":"🍂","name":"夜书所见","auth":"叶绍翁·宋","grade":3,"verse":"萧萧梧叶送寒声，江上秋风动客情。<br>知有儿童挑促织，夜深篱落一灯明。","trans":"梧桐叶沙沙响送来寒意，江上秋风牵动游子的思乡之情。知道有孩子们在捉蟋蟀，夜深了篱笆旁还亮着一盏灯。"},
  {"id":"mjy","emoji":"🌅","name":"暮江吟","auth":"白居易·唐","grade":4,"verse":"一道残阳铺水中，半江瑟瑟半江红。<br>可怜九月初三夜，露似真珠月似弓。","trans":"夕阳的余晖铺洒在江面上，一半江水碧绿一半江水通红。可爱的是九月初三的夜晚，露水像珍珠月亮像弯弓。"},
  {"id":"xue","emoji":"❄️","name":"雪梅","auth":"卢梅坡·宋","grade":4,"verse":"梅雪争春未肯降，骚人阁笔费评章。<br>梅须逊雪三分白，雪却输梅一段香。","trans":"梅和雪争比春色互不认输，诗人放下笔难评高下。梅花比雪少三分白，雪却输给梅花一段清香。"},
  {"id":"cfe","emoji":"🌙","name":"嫦娥","auth":"李商隐·唐","grade":4,"verse":"云母屏风烛影深，长河渐落晓星沉。<br>嫦娥应悔偷灵药，碧海青天夜夜心。","trans":"云母屏风上烛影越来越深，银河渐渐西落晨星低沉。嫦娥应当后悔偷吃灵药，如今碧海青天夜夜孤寂。"},
  {"id":"qq","emoji":"✨","name":"乞巧","auth":"林杰·唐","grade":5,"verse":"七夕今宵看碧霄，牵牛织女渡河桥。<br>家家乞巧望秋月，穿尽红丝几万条。","trans":"七夕今晚仰望碧蓝天空，牛郎织女渡过鹊桥相会。家家女儿望着秋月乞巧，穿完了几万条红丝线。"},
  {"id":"chan","emoji":"🐞","name":"蝉","auth":"虞世南·唐","grade":5,"verse":"垂緌饮清露，流响出疏桐。<br>居高声自远，非是藉秋风。","trans":"蝉垂下触须饮着清露，清脆的鸣声从梧桐传出。因为身居高处声音自然传得远，并不是借助秋风的力量。"},
  {"id":"sjqm","emoji":"⛰️","name":"山居秋暝","auth":"王维·唐","grade":5,"verse":"空山新雨后，天气晚来秋。<br>明月松间照，清泉石上流。<br>竹喧归浣女，莲动下渔舟。<br>随意春芳歇，王孙自可留。","trans":"空山刚下过新雨，傍晚天气透着秋凉。明月照在松林间，清泉在石头上流淌。竹林喧响是洗衣女归来，莲叶摇动是渔舟顺流而下。任凭春花凋谢吧，游子自可留居山中。"},
  {"id":"cxs","emoji":"🌬️","name":"长相思","auth":"纳兰性德·清","grade":5,"verse":"山一程，水一程，身向榆关那畔行，夜深千帐灯。<br>风一更，雪一更，聒碎乡心梦不成，故园无此声。","trans":"翻过一程山涉过一程水，向山海关那边进发，深夜军营千帐灯火。风刮一更雪落一更，吵碎思乡梦难以成眠，故乡可没有这样的风雪声。"},
  {"id":"nmj","emoji":"🐦","name":"鸟鸣涧","auth":"王维·唐","grade":5,"verse":"人闲桂花落，夜静春山空。<br>月出惊山鸟，时鸣春涧中。","trans":"人悠闲时桂花轻轻飘落，夜静谧春山一片空寂。月亮升起惊动了山鸟，不时在春涧中啼鸣。"},
  {"id":"zlnb","emoji":"🧊","name":"稚子弄冰","auth":"杨万里·宋","grade":5,"verse":"稚子金盆脱晓冰，彩丝穿取当银钲。<br>敲成玉磬穿林响，忽作玻璃碎地声。","trans":"小孩清晨从铜盆里剜出冰块，用彩线穿起当作银钲。敲起来像玉磬穿林响，忽然变成玻璃碎地般的声音。"},
  {"id":"cw2","emoji":"🐂","name":"村晚","auth":"雷震·宋","grade":5,"verse":"草满池塘水满陂，山衔落日浸寒漪。<br>牧童归去横牛背，短笛无腔信口吹。","trans":"池塘边长满青草池水涨满，山峦衔着落日浸在寒凉的水波里。牧童回家横坐在牛背上，拿着短笛随口吹着不成调的曲子。"},
  {"id":"hs","emoji":"🌸","name":"寒食","auth":"韩翃·唐","grade":6,"verse":"春城无处不飞花，寒食东风御柳斜。<br>日暮汉宫传蜡烛，轻烟散入五侯家。","trans":"春天的京城处处飞舞着落花，寒食节东风吹斜了宫柳。傍晚皇宫传出蜡烛，轻烟飘进了王侯之家。"},
  {"id":"ttqn","emoji":"💫","name":"迢迢牵牛星","auth":"汉乐府","grade":6,"verse":"迢迢牵牛星，皎皎河汉女。<br>纤纤擢素手，札札弄机杼。<br>终日不成章，泣涕零如雨。<br>河汉清且浅，相去复几许。<br>盈盈一水间，脉脉不得语。","trans":"遥远的牵牛星，明亮的织女星。织女伸出纤纤素手，札札地摆弄织机。一整天织不成花纹，眼泪落得像雨。银河又清又浅，相隔能有多远？就在盈盈一水之间，只能含情相望不能说话。"},
  {"id":"syw","emoji":"🌕","name":"十五夜望月","auth":"王建·唐","grade":6,"verse":"中庭地白树栖鸦，冷露无声湿桂花。<br>今夜月明人尽望，不知秋思落谁家。","trans":"庭院里地色洁白树上栖息着乌鸦，清冷的露水无声打湿桂花。今夜明月当空人人仰望，不知这秋思落到了谁家。"},
  {"id":"ms","emoji":"🐎","name":"马诗","auth":"李贺·唐","grade":6,"verse":"大漠沙如雪，燕山月似钩。<br>何当金络脑，快走踏清秋。","trans":"大漠的沙像雪一样白，燕山的月像弯钩一样。何时才能戴上金络头，在清秋时节纵横驰骋。"},
  {"id":"cw","emoji":"🌿","name":"采薇（节选）","auth":"诗经","grade":6,"verse":"昔我往矣，杨柳依依。<br>今我来思，雨雪霏霏。<br>行道迟迟，载渴载饥。<br>我心伤悲，莫知我哀！","trans":"回想当年我出征时，杨柳轻柔随风摇。如今我归来时，大雪纷纷满天飘。走在路上步履迟缓，又渴又饥。我的心中充满悲伤，没有人知道我的哀痛！"},
  {"id":"sjdj","emoji":"🌊","name":"宿建德江","auth":"孟浩然·唐","grade":6,"verse":"移舟泊烟渚，日暮客愁新。<br>野旷天低树，江清月近人。","trans":"把船停泊在烟雾朦胧的小洲，日暮时分游子又添新愁。原野空旷天比树还低，江水清澈月与人相近。"},
  {"id":"xjy","emoji":"🌾","name":"西江月·夜行黄沙道中","auth":"辛弃疾·宋","grade":6,"verse":"明月别枝惊鹊，清风半夜鸣蝉。<br>稻花香里说丰年，听取蛙声一片。<br>七八个星天外，两三点雨山前。<br>旧时茅店社林边，路转溪桥忽见。","trans":"明月升起惊飞枝头喜鹊，清风半夜传来蝉鸣。稻花香里说着丰收年景，听取一片蛙声。天外七八个星，山前两三点雨。旧时茅店在社林边，过了溪桥忽然看见。"},
  {"id":"grcz","emoji":"🏡","name":"过故人庄","auth":"孟浩然·唐","grade":6,"verse":"故人具鸡黍，邀我至田家。<br>绿树村边合，青山郭外斜。<br>开轩面场圃，把酒话桑麻。<br>待到重阳日，还来就菊花。","trans":"老朋友备好饭菜，邀我到他田庄。绿树环绕村庄，青山横在城外。推开窗户面对谷场菜园，举杯闲谈农事。等到重阳佳节，再来赏菊花。"},
  {"id":"cz","emoji":"🚩","name":"七律·长征","auth":"毛泽东","grade":6,"verse":"红军不怕远征难，万水千山只等闲。<br>五岭逶迤腾细浪，乌蒙磅礴走泥丸。<br>金沙水拍云崖暖，大渡桥横铁索寒。<br>更喜岷山千里雪，三军过后尽开颜。","trans":"红军不怕远征的艰难，万水千山只当平常。五岭蜿蜒像翻腾细浪，乌蒙雄伟像滚动泥丸。金沙江水拍打着暖暖的崖壁，大渡桥横着冰冷的铁索。更喜岷山千里冰雪，三军过后个个笑开颜。"},
  {"id":"pms","emoji":"🌈","name":"菩萨蛮·大柏地","auth":"毛泽东","grade":6,"verse":"赤橙黄绿青蓝紫，谁持彩练当空舞？<br>雨后复斜阳，关山阵阵苍。<br>当年鏖战急，弹洞前村壁。<br>装点此关山，今朝更好看。","trans":"赤橙黄绿青蓝紫，是谁拿着彩带在空中起舞？雨后斜阳重又出现，关山一片苍翠。当年激战正紧，子弹打穿了村前墙壁。这些弹痕装点着关山，今天看来更加好看。"},
  {"id":"qibu","emoji":"🌱","name":"七步诗","auth":"曹植·三国","verse":"煮豆燃豆萁，豆在釜中泣。<br>本是同根生，相煎何太急？","trans":"煮豆子点燃豆秸，豆子在锅里哭泣。我们本是同根所生，何必互相煎熬逼迫得这样急？"},
  {"id":"changle","emoji":"⏳","name":"长歌行","auth":"汉乐府","verse":"青青园中葵，朝露待日晞。<br>阳春布德泽，万物生光辉。<br>常恐秋节至，焜黄华叶衰。<br>百川东到海，何时复西归？<br>少壮不努力，老大徒伤悲。","trans":"园中葵菜青青，朝露等太阳晒干。春天洒下恩泽，万物焕发光辉。常怕秋天来到，花叶枯黄凋零。百川奔流到海，何时再向西回？年少不努力，年老只能白白伤悲。"},
  {"id":"chunxi","emoji":"🌧️","name":"春夜喜雨","auth":"杜甫·唐","verse":"好雨知时节，当春乃发生。<br>随风潜入夜，润物细无声。<br>野径云俱黑，江船火独明。<br>晓看红湿处，花重锦官城。","trans":"好雨懂得时令，春天里悄然降临。随微风在夜里飘洒，无声滋润万物。野外小路与云一片漆黑，只有江船灯火明亮。清晨看那湿润红花，锦官城繁花沉甸甸。"},
  {"id":"huangli","emoji":"🐦","name":"绝句","auth":"杜甫·唐","verse":"两个黄鹂鸣翠柳，一行白鹭上青天。<br>窗含西岭千秋雪，门泊东吴万里船。","trans":"两只黄鹂在翠柳间鸣唱，一行白鹭飞上蓝天。窗外映着西岭千年积雪，门外停泊着东吴万里船。"},
  {"id":"wangyue","emoji":"⛰️","name":"望岳","auth":"杜甫·唐","verse":"岱宗夫如何？齐鲁青未了。<br>造化钟神秀，阴阳割昏晓。<br>荡胸生曾云，决眦入归鸟。<br>会当凌绝顶，一览众山小。","trans":"泰山究竟怎样？齐鲁大地青翠连绵。天地聚拢神奇秀美，山南山北分出晨昏。层云升腾涤荡胸襟，极目追踪归鸟。定要登上最高峰，把众山尽收眼底。"},
  {"id":"chunwang","emoji":"🏯","name":"春望","auth":"杜甫·唐","verse":"国破山河在，城春草木深。<br>感时花溅泪，恨别鸟惊心。<br>烽火连三月，家书抵万金。<br>白头搔更短，浑欲不胜簪。","trans":"国都残破山河依旧，春日城空草木丛生。感伤时节花开落泪，怅恨离别鸟鸣惊心。战火连烧三个月，一封家信抵万金。白发越抓越短，简直插不住簪子。"},
  {"id":"yinjiu","emoji":"🌼","name":"饮酒·其五","auth":"陶渊明·东晋","verse":"结庐在人境，而无车马喧。<br>问君何能尔？心远地自偏。<br>采菊东篱下，悠然见南山。<br>山气日夕佳，飞鸟相与还。<br>此中有真意，欲辨已忘言。","trans":"建屋在人间，却没有车马喧闹。问你怎么做到？心境高远自然僻静。东篱下采菊，悠然望见南山。傍晚山间气息真好，飞鸟结伴归还。这里面有真意，想说明却忘了言语。"},
  {"id":"shizhi","emoji":"🏜️","name":"使至塞上","auth":"王维·唐","verse":"单车欲问边，属国过居延。<br>征蓬出汉塞，归雁入胡天。<br>大漠孤烟直，长河落日圆。<br>萧关逢候骑，都护在燕然。","trans":"轻车前往边塞慰问，路过居延属国。像飘飞蓬草出了汉塞，如北归大雁进入胡天。大漠中一缕孤烟笔直，黄河上落日浑圆。在萧关遇见侦察骑兵，说都护在燕然前线。"},
  {"id":"shanju","emoji":"🌙","name":"山居秋暝","auth":"王维·唐","verse":"空山新雨后，天气晚来秋。<br>明月松间照，清泉石上流。<br>竹喧归浣女，莲动下渔舟。<br>随意春芳歇，王孙自可留。","trans":"空山刚下过雨，傍晚天气转秋。明月照在松间，清泉流过石上。竹林喧闹是洗衣女归来，莲叶摇动是渔舟下行。任春花凋谢吧，游子自可长留。"},
  {"id":"niaoming","emoji":"🌿","name":"鸟鸣涧","auth":"王维·唐","verse":"人闲桂花落，夜静春山空。<br>月出惊山鸟，时鸣春涧中。","trans":"人悠闲桂花飘落，夜静谧春山空寂。月亮升起惊动山鸟，不时鸣叫在春涧里。"},
  {"id":"dufu","emoji":"🤝","name":"送杜少府之任蜀州","auth":"王勃·唐","verse":"城阙辅三秦，风烟望五津。<br>与君离别意，同是宦游人。<br>海内存知己，天涯若比邻。<br>无为在歧路，儿女共沾巾。","trans":"三秦护卫长安城，风烟遥望五津。与你离别心情相同，都是在外做官的人。四海之内有知己，天涯也像邻居。不要在岔路口，像儿女般泪湿手巾。"},
  {"id":"youzhou","emoji":"🌌","name":"登幽州台歌","auth":"陈子昂·唐","verse":"前不见古人，后不见来者。<br>念天地之悠悠，独怆然而涕下！","trans":"往前不见古代贤君，往后不见后世明主。想到天地长久广阔，独自悲怆落下眼泪。"},
  {"id":"cibeigu","emoji":"⛵","name":"次北固山下","auth":"王湾·唐","verse":"客路青山外，行舟绿水前。<br>潮平两岸阔，风正一帆悬。<br>海日生残夜，江春入旧年。<br>乡书何处达？归雁洛阳边。","trans":"旅途在青山之外，行船在绿水之前。潮水涨平两岸宽阔，顺风扬起孤帆。海日生于残夜，江春闯入旧年。家信往哪送？托付归雁到洛阳。"},
  {"id":"huanghe","emoji":"🏰","name":"黄鹤楼","auth":"崔颢·唐","verse":"昔人已乘黄鹤去，此地空余黄鹤楼。<br>黄鹤一去不复返，白云千载空悠悠。<br>晴川历历汉阳树，芳草萋萋鹦鹉洲。<br>日暮乡关何处是？烟波江上使人愁。","trans":"古人已乘黄鹤离去，这里只空留黄鹤楼。黄鹤一去不回，白云千载空自飘悠。晴川上汉阳树清晰，鹦鹉洲芳草茂盛。日暮故乡在何处？江上烟波惹人愁。"},
  {"id":"longbiao","emoji":"🌬️","name":"闻王昌龄左迁龙标遥有此寄","auth":"李白·唐","verse":"杨花落尽子规啼，闻道龙标过五溪。<br>我寄愁心与明月，随君直到夜郎西。","trans":"杨花落尽杜鹃悲啼，听说你被贬到龙标要过五溪。我把愁心托付明月，随你直到夜郎以西。"},
  {"id":"xinglu","emoji":"🌊","name":"行路难·其一","auth":"李白·唐","verse":"金樽清酒斗十千，玉盘珍羞直万钱。<br>停杯投箸不能食，拔剑四顾心茫然。<br>欲渡黄河冰塞川，将登太行雪满山。<br>闲来垂钓碧溪上，忽复乘舟梦日边。<br>行路难！行路难！多歧路，今安在？<br>长风破浪会有时，直挂云帆济沧海。","trans":"金杯清酒一斗万钱，玉盘佳肴价值连城。放下杯筷吃不下，拔剑四顾心绪茫然。想渡黄河冰塞河道，要登太行雪满山。闲时垂钓碧溪，忽又梦见乘舟到日边。行路难啊行路难！岔路这么多，如今在哪？终有长风破浪之时，挂起云帆渡沧海。"},
  {"id":"luocheng","emoji":"🎵","name":"春夜洛城闻笛","auth":"李白·唐","verse":"谁家玉笛暗飞声，散入春风满洛城。<br>此夜曲中闻折柳，何人不起故园情。","trans":"谁家玉笛悄悄飞扬，随春风洒满洛阳城。今夜曲中听到折柳，谁能不兴起思乡情。"},
  {"id":"emei","emoji":"🌕","name":"峨眉山月歌","auth":"李白·唐","verse":"峨眉山月半轮秋，影入平羌江水流。<br>夜发清溪向三峡，思君不见下渝州。","trans":"峨眉山挂着半轮秋月，月影落入平羌江水流。夜里从清溪出发向三峡，思念你却见不到，船已驶下渝州。"},
  {"id":"baixue","emoji":"❄️","name":"白雪歌送武判官归京（节选）","auth":"岑参·唐","verse":"北风卷地白草折，胡天八月即飞雪。<br>忽如一夜春风来，千树万树梨花开。","trans":"北风卷地吹断白草，胡地八月就飘飞雪。忽然像一夜春风吹来，千树万树梨花盛开。"},
  {"id":"qiantang","emoji":"🌸","name":"钱塘湖春行","auth":"白居易·唐","verse":"孤山寺北贾亭西，水面初平云脚低。<br>几处早莺争暖树，谁家新燕啄春泥。<br>乱花渐欲迷人眼，浅草才能没马蹄。<br>最爱湖东行不足，绿杨阴里白沙堤。","trans":"孤山寺北贾亭西，水面刚平云脚低垂。几处早莺争栖暖树，谁家新燕啄衔春泥。杂乱春花渐迷人眼，浅草刚能没过马蹄。最爱湖东走不够，绿杨荫里白沙堤。"},
  {"id":"mujiang","emoji":"🌅","name":"暮江吟","auth":"白居易·唐","verse":"一道残阳铺水中，半江瑟瑟半江红。<br>可怜九月初三夜，露似真珠月似弓。","trans":"一道残阳铺洒水中，半江碧绿半江红艳。可爱九月初三夜，露珠像珍珠月像弯弓。"},
  {"id":"boqinhuai","emoji":"🏮","name":"泊秦淮","auth":"杜牧·唐","verse":"烟笼寒水月笼沙，夜泊秦淮近酒家。<br>商女不知亡国恨，隔江犹唱后庭花。","trans":"烟笼罩寒水月笼罩沙，夜泊秦淮靠近酒家。歌女不懂亡国之恨，隔着江还在唱后庭花。"},
  {"id":"chibi","emoji":"⚔️","name":"赤壁","auth":"杜牧·唐","verse":"折戟沉沙铁未销，自将磨洗认前朝。<br>东风不与周郎便，铜雀春深锁二乔。","trans":"断戟沉在沙里铁未销蚀，亲自磨洗认出前朝。若东风不给周郎方便，铜雀台深处将锁住二乔。"},
  {"id":"qiusi","emoji":"✉️","name":"秋思","auth":"张籍·唐","verse":"洛阳城里见秋风，欲作家书意万重。<br>复恐匆匆说不尽，行人临发又开封。","trans":"洛阳城里吹起秋风，想写家信心意万重。又怕匆匆说不完，送信人临走我又拆封。"},
  {"id":"yeyu","emoji":"🌧️","name":"夜雨寄北","auth":"李商隐·唐","verse":"君问归期未有期，巴山夜雨涨秋池。<br>何当共剪西窗烛，却话巴山夜雨时。","trans":"你问归期我还没有期，巴山夜雨涨满秋池。何时才能共剪西窗烛，再聊这巴山夜雨时。"},
  {"id":"shangshan","emoji":"🌾","name":"商山早行","auth":"温庭筠·唐","verse":"晨起动征铎，客行悲故乡。<br>鸡声茅店月，人迹板桥霜。<br>槲叶落山路，枳花明驿墙。<br>因思杜陵梦，凫雁满回塘。","trans":"清晨响起车马铃，客子悲叹离家乡。鸡声里茅店残月，人迹印板桥白霜。槲叶飘落山路，枳花照亮驿墙。想起杜陵梦境，凫雁满布回塘。"},
  {"id":"xiangjian","emoji":"🍂","name":"相见欢","auth":"李煜·南唐","verse":"无言独上西楼，月如钩。<br>寂寞梧桐深院锁清秋。<br>剪不断，理还乱，是离愁。<br>别是一般滋味在心头。","trans":"默默独自上西楼，月儿弯如钩。寂寞梧桐深院锁住清秋。剪也不断，理也还乱，这是离愁。另有一番滋味在心头。"},
  {"id":"yumei","emoji":"🌊","name":"虞美人","auth":"李煜·南唐","verse":"春花秋月何时了？往事知多少。<br>小楼昨夜又东风，故国不堪回首月明中。<br>雕栏玉砌应犹在，只是朱颜改。<br>问君能有几多愁？恰似一江春水向东流。","trans":"春花秋月何时才完？往事知多少。小楼昨夜又起东风，故国不忍回首在明月之中。雕栏玉砌应还在，只是红颜已改。问你能有多少愁？恰似一江春水向东流。"},
  {"id":"yujia","emoji":"🏕️","name":"渔家傲·秋思","auth":"范仲淹·宋","verse":"塞下秋来风景异，衡阳雁去无留意。<br>四面边声连角起。千嶂里，长烟落日孤城闭。<br>浊酒一杯家万里，燕然未勒归无计。<br>羌管悠悠霜满地。人不寐，将军白发征夫泪。","trans":"边塞秋来风景奇异，衡阳雁去毫无留恋。四面边声伴号角响起。千峰里，长烟落日孤城紧闭。浊酒一杯家在万里，燕然未刻归去无计。羌笛悠悠霜满地。人难眠，将军白发征夫泪。"},
  {"id":"feilai","emoji":"🗼","name":"登飞来峰","auth":"王安石·宋","verse":"飞来山上千寻塔，闻说鸡鸣见日升。<br>不畏浮云遮望眼，自缘身在最高层。","trans":"飞来山上有千寻高塔，听说鸡鸣可见日出。不怕浮云遮住远望眼，只因我身在最高层。"},
  {"id":"shufen","emoji":"📜","name":"书愤","auth":"陆游·宋","verse":"早岁那知世事艰，中原北望气如山。<br>楼船夜雪瓜洲渡，铁马秋风大散关。<br>塞上长城空自许，镜中衰鬓已先斑。<br>出师一表真名世，千载谁堪伯仲间。","trans":"年轻时哪知世事艰难，北望中原怒气如山。雪夜楼船瓜洲渡，秋风铁马大散关。想做塞上长城空自许愿，镜中鬓发已先斑白。出师一表真传千古，千载谁人能相比。"},
  {"id":"shiyiyue","emoji":"❄️","name":"十一月四日风雨大作","auth":"陆游·宋","verse":"僵卧孤村不自哀，尚思为国戍轮台。<br>夜阑卧听风吹雨，铁马冰河入梦来。","trans":"僵卧孤村并不自哀，还想为国守卫轮台。夜深卧听风吹雨，铁马冰河进入梦来。"},
  {"id":"lingding","emoji":"🇨🇳","name":"过零丁洋","auth":"文天祥·宋","verse":"辛苦遭逢起一经，干戈寥落四周星。<br>山河破碎风飘絮，身世浮沉雨打萍。<br>惶恐滩头说惶恐，零丁洋里叹零丁。<br>人生自古谁无死？留取丹心照汗青。","trans":"辛苦出身靠一部经书，兵荒马乱四周年。山河破碎如风飘柳絮，身世浮沉似雨打浮萍。惶恐滩头诉说惶恐，零丁洋里哀叹孤零。人生自古谁不死？留取丹心照耀史册。"},
  {"id":"tianjing","emoji":"🍁","name":"天净沙·秋思","auth":"马致远·元","verse":"枯藤老树昏鸦，小桥流水人家，古道西风瘦马。<br>夕阳西下，断肠人在天涯。","trans":"枯藤老树黄昏乌鸦，小桥流水人家，古道西风瘦马。夕阳西下，断肠人漂泊天涯。"},
  {"id":"tongguan","emoji":"⛰️","name":"山坡羊·潼关怀古","auth":"张养浩·元","verse":"峰峦如聚，波涛如怒，山河表里潼关路。<br>望西都，意踌躇。<br>伤心秦汉经行处，宫阙万间都做了土。<br>兴，百姓苦；亡，百姓苦。","trans":"峰峦像聚拢，波涛像发怒，山河表里潼关路。望长安，心踌躇。伤心秦汉经过处，万间宫阙都化尘土。兴，百姓苦；亡，百姓苦。"},
  {"id":"lunshi","emoji":"🖋️","name":"论诗","auth":"赵翼·清","verse":"李杜诗篇万口传，至今已觉不新鲜。<br>江山代有才人出，各领风骚数百年。","trans":"李白杜甫诗篇万人传诵，如今已觉不新鲜。江山代代都有才人涌现，各自引领文坛数百年。"},
  {"id":"jinlv","emoji":"🌸","name":"金缕衣","auth":"杜秋娘·唐","verse":"劝君莫惜金缕衣，劝君惜取少年时。<br>花开堪折直须折，莫待无花空折枝。","trans":"劝你别惜金缕衣，劝你珍惜少年时。花开可折就快折，莫等无花空折枝。"},
  {"id":"wangyuehuai","emoji":"🌕","name":"望月怀远","auth":"张九龄·唐","verse":"海上生明月，天涯共此时。<br>情人怨遥夜，竟夕起相思。<br>灭烛怜光满，披衣觉露滋。<br>不堪盈手赠，还寝梦佳期。","trans":"海上升起明月，天涯共此一时。多情的人怨恨长夜，整夜涌起相思。灭烛爱怜满屋清光，披衣觉露水沾湿。不能捧满手相赠，回房梦里再逢佳期。"},
  {"id":"zhuliguan","emoji":"🎋","name":"竹里馆","auth":"王维·唐","verse":"独坐幽篁里，弹琴复长啸。<br>深林人不知，明月来相照。","trans":"独自坐在幽深竹林，弹琴又长啸。深林无人知晓，明月来相照耀。"},
  {"id":"wuyi","emoji":"🪺","name":"乌衣巷","auth":"刘禹锡·唐","grade":5,"verse":"朱雀桥边野草花，乌衣巷口夕阳斜。<br>旧时王谢堂前燕，飞入寻常百姓家。","trans":"朱雀桥边长满野草野花，乌衣巷口夕阳斜照。从前王导谢安堂前的燕子，如今飞进普通百姓家中。"},
  {"id":"fengqiao","emoji":"🌃","name":"枫桥夜泊","auth":"张继·唐","grade":5,"verse":"月落乌啼霜满天，江枫渔火对愁眠。<br>姑苏城外寒山寺，夜半钟声到客船。","trans":"月落乌鸦啼叫寒霜满天，江边枫树渔火相对愁眠。苏州城外寒山寺，半夜钟声传到客船。"},
  {"id":"yuxi","emoji":"💧","name":"忆江南","auth":"白居易·唐","grade":4,"verse":"江南好，风景旧曾谙。<br>日出江花红胜火，春来江水绿如蓝。能不忆江南？","trans":"江南美好，风景从前熟悉。日出江花红胜火，春来江水绿如蓝。怎能不忆江南？"},
  {"id":"xiaochi","emoji":"🪷","name":"小池","auth":"杨万里·宋","grade":3,"verse":"泉眼无声惜细流，树阴照水爱晴柔。<br>小荷才露尖尖角，早有蜻蜓立上头。","trans":"泉眼无声怜惜细流，树荫照水喜爱晴柔。小荷才露尖尖角，早有蜻蜓立上头。"},
  {"id":"jiangxue","emoji":"❄️","name":"江雪","auth":"柳宗元·唐","grade":4,"verse":"千山鸟飞绝，万径人踪灭。<br>孤舟蓑笠翁，独钓寒江雪。","trans":"千山鸟飞绝迹，万径人踪灭绝。孤舟蓑笠老翁，独钓寒江雪。"},
  {"id":"baidi","emoji":"🌅","name":"早发白帝城","auth":"李白·唐","grade":4,"verse":"朝辞白帝彩云间，千里江陵一日还。<br>两岸猿声啼不住，轻舟已过万重山。","trans":"早晨辞别白帝城在彩云间，千里江陵一日回还。两岸猿声啼叫不停，轻舟已过万重山。"},
  {"id":"wanglu","emoji":"⛰️","name":"望庐山瀑布","auth":"李白·唐","grade":3,"verse":"日照香炉生紫烟，遥看瀑布挂前川。<br>飞流直下三千尺，疑是银河落九天。","trans":"日照香炉峰生紫烟，遥看瀑布挂前川。飞流直下三千尺，疑是银河落九天。"},
  {"id":"liangzhou","emoji":"🍶","name":"凉州词","auth":"王之涣·唐","grade":6,"verse":"黄河远上白云间，一片孤城万仞山。<br>羌笛何须怨杨柳，春风不度玉门关。","trans":"黄河远上白云间，一片孤城万仞山。羌笛何须怨杨柳，春风不度玉门关。"},
  {"id":"chunri","emoji":"🌿","name":"春日","auth":"朱熹·宋","grade":5,"verse":"胜日寻芳泗水滨，无边光景一时新。<br>等闲识得东风面，万紫千红总是春。","trans":"好日寻芳泗水滨，无边光景一时新。轻易识得东风面，万紫千红总是春。"},
  {"id":"jiangpan","emoji":"🌸","name":"江畔独步寻花","auth":"杜甫·唐","grade":5,"verse":"黄四娘家花满蹊，千朵万朵压枝低。<br>留连戏蝶时时舞，自在娇莺恰恰啼。","trans":"黄四娘家小路开满花，千朵万朵压弯枝条。戏蝶留连时时起舞，娇莺自在恰恰啼鸣。"},
  {"id":"shancun","emoji":"🏘️","name":"山村咏怀","auth":"邵雍·宋","grade":1,"verse":"一去二三里，烟村四五家。<br>亭台六七座，八九十枝花。","trans":"走出两三里路，看见炊烟缭绕的村子有四五户人家。村里有六七座亭台，路边开着许多枝鲜花。"},
  {"id":"huaji","emoji":"🐓","name":"画鸡","auth":"唐寅·明","grade":1,"verse":"头上红冠不用裁，满身雪白走将来。<br>平生不敢轻言语，一叫千门万户开。","trans":"头上的红冠子不用裁剪就天然生成，一身雪白的羽毛神气地走过来。它平时从不轻易开口，一声啼叫就唤开千家万户的门。"},
  {"id":"duzuo","emoji":"⛰️","name":"独坐敬亭山","auth":"李白·唐","grade":4,"verse":"众鸟高飞尽，孤云独去闲。<br>相看两不厌，只有敬亭山。","trans":"鸟儿都高高飞走不见了，一片孤云也悠闲地飘远。看来看去彼此都不厌倦的，只有面前这座敬亭山。"},
  {"id":"fengxue","emoji":"🏚️","name":"逢雪宿芙蓉山主人","auth":"刘长卿·唐","grade":4,"verse":"日暮苍山远，天寒白屋贫。<br>柴门闻犬吠，风雪夜归人。","trans":"太阳落山了，青山显得格外遥远；天气寒冷，简陋的茅屋显出主人的清贫。忽然柴门外传来狗叫声，原来是有人在风雪的夜里归来。"},
  {"id":"gumu","emoji":"🌳","name":"绝句（古木阴中）","auth":"志南·宋","grade":3,"verse":"古木阴中系短篷，杖藜扶我过桥东。<br>沾衣欲湿杏花雨，吹面不寒杨柳风。","trans":"把小船系在古树的树荫下，拄着藜杖慢慢走过小桥往东去。杏花时节的细雨飘在衣上像要打湿又没湿透，吹在脸上的杨柳春风一点也不觉得冷。"},
  {"id":"dalinsi","emoji":"🌺","name":"大林寺桃花","auth":"白居易·唐","grade":4,"verse":"人间四月芳菲尽，山寺桃花始盛开。<br>长恨春归无觅处，不知转入此中来。","trans":"四月里山下的花儿都已开完，山上寺院的桃花才刚刚盛开。我常常遗憾春天走了找不到踪影，没想到它悄悄转到这山里来了。"},
  {"id":"qiuci","emoji":"🕊️","name":"秋词","auth":"刘禹锡·唐","grade":5,"verse":"自古逢秋悲寂寥，我言秋日胜春朝。<br>晴空一鹤排云上，便引诗情到碧霄。","trans":"自古以来人们一到秋天就悲叹冷清，我却说秋天比春天更好。晴朗的天空里一只白鹤推开云层直上，把我的诗兴也带到了蓝天之上。"},
  {"id":"dongye","emoji":"📖","name":"冬夜读书示子聿","auth":"陆游·宋","grade":5,"verse":"古人学问无遗力，少壮工夫老始成。<br>纸上得来终觉浅，绝知此事要躬行。","trans":"古人做学问总是全力以赴，年轻时下的功夫到老才见成就。从书本上得到的知识毕竟浅了些，要真正弄懂一件事，必须亲自去实践。"},
  {"id":"canfu","emoji":"🧵","name":"蚕妇","auth":"张俞·宋","grade":4,"verse":"昨日入城市，归来泪满巾。<br>遍身罗绮者，不是养蚕人。","trans":"昨天我到城里去，回来时手帕上满是泪水。因为满身穿着绫罗绸缎的人，都不是辛苦养蚕的人。"},
  {"id":"taozhe","emoji":"🏺","name":"陶者","auth":"梅尧臣·宋","grade":5,"verse":"陶尽门前土，屋上无片瓦。<br>十指不沾泥，鳞鳞居大厦。","trans":"烧瓦的人把门前的泥土都用光了，自己屋顶上却连一片瓦都没有。那些十个指头不沾一点泥的人，却住着瓦片层层叠叠的大房子。"},
  {"id":"zhouguo","emoji":"⛵","name":"舟过安仁","auth":"杨万里·宋","grade":5,"verse":"一叶渔船两小童，收篙停棹坐船中。<br>怪生无雨都张伞，不是遮头是使风。","trans":"一只小渔船上坐着两个小孩，他们收起竹篙、停下船桨坐在船里。怪不得没下雨也张开了伞，原来不是遮头，而是用伞借风让船前进。"},
  {"id":"mutong","emoji":"🐂","name":"牧童","auth":"吕岩·唐","grade":5,"verse":"草铺横野六七里，笛弄晚风三四声。<br>归来饱饭黄昏后，不脱蓑衣卧月明。","trans":"青草像铺开的地毯盖满原野，笛声随晚风飘来三四声。牧童黄昏后回家吃饱了饭，连蓑衣也不脱就躺在月光下歇息。"},
  {"id":"liguinian","emoji":"🎵","name":"江南逢李龟年","auth":"杜甫·唐","grade":5,"verse":"岐王宅里寻常见，崔九堂前几度闻。<br>正是江南好风景，落花时节又逢君。","trans":"当年在岐王府里常常见到你，也在崔九的厅堂前多次听你演唱。如今正是江南风景最美的时候，却在落花的季节又与你相遇。"},
  {"id":"zaomei","emoji":"🌼","name":"早梅","auth":"张谓·唐","grade":4,"verse":"一树寒梅白玉条，迥临村路傍溪桥。<br>不知近水花先发，疑是经冬雪未消。","trans":"一树早开的梅花像白玉做的枝条，远远地立在村路旁靠着溪上小桥。人们不知道它靠近水边所以开得早，还以为是过冬没有融化的积雪。"},
  {"id":"rumengling","emoji":"🪷","name":"如梦令（常记溪亭日暮）","auth":"李清照·宋","grade":6,"verse":"常记溪亭日暮，沉醉不知归路。<br>兴尽晚回舟，误入藕花深处。<br>争渡，争渡，惊起一滩鸥鹭。","trans":"常常记起那天傍晚在溪边亭子游玩，玩得入迷竟忘了回家的路。玩够了天晚才划船返回，一不小心划进了荷花丛的深处。快划呀，快划呀，惊得满滩的水鸟都飞了起来。"},
  {"id":"congjunxing","emoji":"🛡️","name":"从军行","auth":"王昌龄·唐","grade":6,"verse":"青海长云暗雪山，孤城遥望玉门关。<br>黄沙百战穿金甲，不破楼兰终不还。","trans":"青海湖上长云把雪山遮得暗淡，从孤城远远望见玉门关。将士们在黄沙中身经百战，铠甲都磨破了，但不打退敌人就绝不回家。"},
  {"id":"xiangsi","emoji":"🫘","name":"相思","auth":"王维·唐","grade":3,"verse":"红豆生南国，春来发几枝。<br>愿君多采撷，此物最相思。","trans":"红豆生长在南方，春天到了又发出几枝新芽。希望你多采一些吧，因为这种东西最能寄托思念之情。"},
  {"id":"zashi","emoji":"🪟","name":"杂诗","auth":"王维·唐","grade":4,"verse":"君自故乡来，应知故乡事。<br>来日绮窗前，寒梅著花未？","trans":"你是从我的家乡来的，一定知道家乡的事情。请问你来的时候，那雕花窗子前的梅花开了没有？"},
  {"id":"tiducheng","emoji":"🌸","name":"题都城南庄","auth":"崔护·唐","grade":5,"verse":"去年今日此门中，人面桃花相映红。<br>人面不知何处去，桃花依旧笑春风。","trans":"去年的今天就在这扇门里，姑娘的面容和桃花互相映着一片红。今天姑娘不知去了哪里，只有桃花依旧在春风里绽放。"},
  {"id":"qiuxi","emoji":"✨","name":"秋夕","auth":"杜牧·唐","grade":5,"verse":"银烛秋光冷画屏，轻罗小扇扑流萤。<br>天阶夜色凉如水，卧看牵牛织女星。","trans":"银白的烛光和秋色映得画屏发凉，她拿着轻纱小扇扑打飞来的萤火虫。石阶上的夜色凉得像水一样，她躺着仰望天上的牛郎星和织女星。"},
  {"id":"shanting","emoji":"🏞️","name":"山亭夏日","auth":"高骈·唐","grade":4,"verse":"绿树阴浓夏日长，楼台倒影入池塘。<br>水晶帘动微风起，满架蔷薇一院香。","trans":"绿树成荫，夏天的白昼格外长，楼台的影子倒映在池塘里。水晶似的帘子微微晃动，是起了微风，满架的蔷薇让整个院子都香喷喷的。"},
  {"id":"yexue","emoji":"🌨️","name":"夜雪","auth":"白居易·唐","grade":4,"verse":"已讶衾枕冷，复见窗户明。<br>夜深知雪重，时闻折竹声。","trans":"我先是奇怪被子枕头怎么这样冷，又看见窗户外面亮亮的。这才知道夜深时雪下得很大，不时听到竹枝被压折的声音。"},
  {"id":"guancanghai","emoji":"🌊","name":"观沧海（节选）","auth":"曹操·汉","grade":6,"verse":"东临碣石，以观沧海。<br>水何澹澹，山岛竦峙。<br>树木丛生，百草丰茂。<br>秋风萧瑟，洪波涌起。","trans":"向东登上碣石山，来观看大海。海水多么辽阔动荡，山岛高高地矗立着。岛上树木丛丛生长，各种野草十分茂盛。秋风吹得草木沙沙作响，海上翻起了巨大的波浪。"},
  {"id":"guisuishou","emoji":"🐎","name":"龟虽寿（节选）","auth":"曹操·汉","grade":6,"verse":"老骥伏枥，志在千里。<br>烈士暮年，壮心不已。","trans":"年老的良马虽然卧在马槽边，它的志向依然是奔驰千里。有抱负的人到了晚年，雄壮的志气也从不停止。"},
  {"id":"quanxue","emoji":"🕯️","name":"劝学诗","auth":"颜真卿·唐","grade":4,"verse":"三更灯火五更鸡，正是男儿读书时。<br>黑发不知勤学早，白首方悔读书迟。","trans":"深夜还亮着灯，天亮鸡叫又起身，这正是少年人读书的好时候。头发黑的时候不懂得及早勤奋，等到白发才后悔读书太晚了。"},
  {"id":"mingrige","emoji":"⏳","name":"明日歌（节选）","auth":"钱福·明","grade":5,"verse":"明日复明日，明日何其多。<br>我生待明日，万事成蹉跎。","trans":"总说明天再做，明天又推到明天，明天哪里数得完呢。一辈子都在等明天，结果什么事都被耽误了。"},
  {"id":"tianyuanle","emoji":"🍑","name":"田园乐（其六）","auth":"王维·唐","grade":4,"verse":"桃红复含宿雨，柳绿更带朝烟。<br>花落家童未扫，鸟啼山客犹眠。","trans":"粉红的桃花还含着昨夜的雨珠，翠绿的柳枝更笼着清晨的雾气。落花铺了一地小童还没打扫，鸟儿已在啼叫而山中客人仍在睡觉。"},
  {"id":"songlingche","emoji":"🎐","name":"送灵澈上人","auth":"刘长卿·唐","grade":5,"verse":"苍苍竹林寺，杳杳钟声晚。<br>荷笠带斜阳，青山独归远。","trans":"竹林寺笼罩在苍茫的暮色里，远远传来傍晚的钟声。他背着斗笠披着夕阳，独自朝青山深处越走越远。"},
  {"id":"juhua","emoji":"🌻","name":"菊花","auth":"元稹·唐","grade":4,"verse":"秋丛绕舍似陶家，遍绕篱边日渐斜。<br>不是花中偏爱菊，此花开后更无花。","trans":"一丛丛秋菊绕着房屋，好像陶渊明的家。我沿着篱笆一圈圈地看，太阳都渐渐西斜了。并不是我在花中特别偏爱菊花，而是这花开过以后就再没有花开了。"},
  {"id":"youshanxi","emoji":"🏡","name":"游山西村","auth":"陆游·宋","grade":6,"verse":"莫笑农家腊酒浑，丰年留客足鸡豚。<br>山重水复疑无路，柳暗花明又一村。","trans":"不要笑农家过年的酒不够清澈，丰收之年招待客人的鸡和肉很丰盛。山重重水弯弯，正怀疑前面没有路了，忽然柳树成荫花儿明艳，又出现一个村庄。"}

var currentGrade='all';
function gradeOf(p){ return (p.grade!=null)?p.grade:(GRADE[p.id]||null); }
function getView(){
  var arr=[];
  POEMS.forEach(function(p,i){
    var g=gradeOf(p);
    if(currentGrade==='all' || g===currentGrade) arr.push(i);
  });
  return arr;
}

var CHILD='user', KEY='';
function getStore(){ try{ return JSON.parse(localStorage.getItem(KEY))||{}; }catch(e){ return {}; } }
function setStore(o){ try{ localStorage.setItem(KEY, JSON.stringify(o)); }catch(e){} }
function isDone(id){ return !!getStore()[id]; }

/* ============ 断点续学（记住上次展开/朗读的那首）============ */
function saveLast(i){ try{ localStorage.setItem(KEY+'_last', String(i)); }catch(e){} }
function loadLast(){ try{ var v=parseInt(localStorage.getItem(KEY+'_last'),10); if(!isNaN(v)&&v>=0&&v<POEMS.length) return v; }catch(e){} return null; }
function resetLast(){ try{ localStorage.removeItem(KEY+'_last'); }catch(e){} var t=document.getElementById('resumeTip'); if(t) t.remove(); }
function mountResumeBanner(){
  var li=loadLast(); if(li==null) return;
  var h=document.querySelector('header'); if(!h) return;
  var tip=document.createElement('div'); tip.id='resumeTip';
  tip.style.cssText='margin:10px 16px 0;background:#fff7e6;border:1px solid #ffd166;color:#8a6d00;font-size:13px;border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px';
  tip.innerHTML='📍 上次读到第 '+(li+1)+' 首（共 '+POEMS.length+'）';
  var btn=document.createElement('button'); btn.type='button'; btn.textContent='↺ 收起并重置';
  btn.style.cssText='border:none;background:#ff9f1c;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-family:inherit;cursor:pointer;font-weight:700';
  btn.onclick=resetLast;
  tip.appendChild(btn);
  h.insertAdjacentElement('afterend', tip);
}

function render(){
  var view=getView();
  var html='';
  view.forEach(function(i){
    var p=POEMS[i];
    var done=isDone(p.id);
    var g=gradeOf(p);
    html+='<div class="poem'+(done?' done':'')+'" id="poem-'+i+'">'+
      '<div class="pfront" onclick="flip('+i+')">'+
        '<span class="pemoji">'+p.emoji+'</span>'+
        '<div class="ptxt"><div class="pname">'+p.name+(g?('<span class="grade-badge">G'+g+'</span>'):'')+'</div>'+
        '<div class="pauth">'+p.auth+'</div></div>'+
        '<span class="parrow">👉</span>'+
      '</div>'+
      '<div class="pback" id="back-'+i+'" hidden>'+
        '<div class="verse">'+p.verse+'</div>'+
        '<div class="trans">'+p.trans+'</div>'+
        '<div class="pbtns"><button class="b-read" onclick="speak('+i+')">🔊 朗读</button>'+
        '<button class="b-back" onclick="flip('+i+')">⬅️ 收起</button></div>'+
      '</div>'+
      '<button class="pmark" onclick="mark('+i+')">'+
        '<span class="mark-ic">'+(done?'✅':'⬜')+'</span>'+(done?' 已背':' 标记已背')+'</button>'+
    '</div>';
  });
  if(!view.length) html='<p style="text-align:center;color:#aaa;padding:20px">这个年级还没有篇目～</p>';
  document.getElementById('poems').innerHTML=html;
  updateStats();
}
function setGrade(v){ currentGrade=v; render(); }
function flip(i){
  var b=document.getElementById('back-'+i);
  if(b.hidden){ b.hidden=false; document.getElementById('poem-'+i).querySelector('.parrow').textContent='👆'; saveLast(i); }
  else { b.hidden=true; document.getElementById('poem-'+i).querySelector('.parrow').textContent='👉'; }
}
function speak(i){
  var p=POEMS[i];
  saveLast(i);
  var text=(p.name+'。'+p.verse.replace(/<br>/g,'，').replace(/[，。]/g,'，')).replace(/[，]+/g,'，');
  try{
    var u=new SpeechSynthesisUtterance(text.replace(/，/g,'，'));
    u.lang='zh-CN'; u.rate=0.85; u.pitch=1;
    window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
  }catch(e){}
}
function mark(i){
  var p=POEMS[i];
  var store=getStore();
  if(store[p.id]){ delete store[p.id]; } else { store[p.id]=Date.now(); }
  setStore(store);
  render();
  if(Object.keys(getStore()).length===POEMS.length){ celebrate(); }
}
function updateStats(){
  var done=Object.keys(getStore()).length, total=POEMS.length, pct=total?Math.round(done/total*100):0;
  document.getElementById('doneNum').textContent=done;
  document.getElementById('totalNum').textContent=total;
  document.getElementById('pctNum').textContent=pct+'%';
  document.getElementById('progBar').style.width=pct+'%';
  document.getElementById('progTxt').textContent='完成 '+done+' / '+total+' 首';
}
function resetAll(){ if(confirm('确定清空所有“已背”标记？')){ setStore({}); render(); } }
function celebrate(){
  var emo=['🎉','✨','🌸','🌟','📜','⭐','🌺','💮'];
  for(var k=0;k<26;k++){
    (function(){
      var c=document.createElement('div'); c.className='confetti';
      c.textContent=emo[Math.floor(Math.random()*emo.length)];
      c.style.left=Math.random()*100+'vw';
      c.style.animationDuration=(2+Math.random()*2)+'s';
      document.body.appendChild(c);
      setTimeout(function(){ c.remove(); },4200);
    })();
  }
  document.getElementById('celeb').querySelector('p').textContent = POEMS.length+' 首诗词全背下来啦，肚子里装满好句子！';
  document.getElementById('celeb').style.display='flex';
}
function closeCeleb(){ document.getElementById('celeb').style.display='none'; }

(function(){
  var s=Portal.getSession();
  CHILD=(s&&s.child)?s.child:'user';
  KEY='chinese-poem-'+CHILD;
  var d=new Date();
  var wk=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  document.getElementById('dateStr').textContent=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()+' '+wk;
  render();
  var li=loadLast(); if(li!=null) flip(li);
  mountResumeBanner();
})();
</script>
</body>
</html>
